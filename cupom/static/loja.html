<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja - Cupincha</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header>
  <a class="logo" href="/">🏷️ Cupincha</a>
  <nav><a href="/">Home</a></nav>
</header>

<section style="padding-top:2rem">
  <div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:2rem;background:white;padding:1.5rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)">
    <img id="store-logo" src="" alt="" style="width:100px;height:100px;object-fit:contain;border-radius:8px">
    <div>
      <h1 id="store-name" style="font-size:1.5rem;margin-bottom:.5rem"></h1>
      <p id="store-desc" style="color:var(--muted)"></p>
    </div>
  </div>

  <h2>Cupons e Ofertas</h2>
  <div class="coupons-grid" id="store-coupons" style="margin-top:1rem">
    <p>Carregando...</p>
  </div>
</section>

<!-- Modal -->
<div class="modal-backdrop" id="couponModal">
  <div class="modal">
    <button class="close" id="modalClose">&times;</button>
    <h3>🎉 Seu cupom</h3>
    <p id="modalMsg"></p>
    <div class="code-box" id="modalCode" title="Clique para copiar"></div>
    <p style="font-size:.8rem;color:var(--muted)">Clique no código para copiar · A loja abre em nova aba</p>
  </div>
</div>

<footer><p>&copy; 2024 Cupincha</p></footer>
<script src="/assets/js/main.js"></script>
</body>
</html>

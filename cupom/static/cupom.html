<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupom - Cupincha</title>
  <meta name="description" id="meta-desc" content="Cupom de desconto">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header>
  <a class="logo" href="/">🏷️ Cupincha</a>
  <nav><a href="/">Home</a></nav>
</header>

<section style="padding-top:2rem;max-width:640px">
  <div style="background:white;border-radius:8px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,.08)">
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:.3rem">Loja: <strong id="cpn-store"></strong></p>
    <h1 id="cpn-title" style="font-size:1.5rem;margin-bottom:.8rem"></h1>
    <p id="cpn-desc" style="color:var(--muted);margin-bottom:1rem"></p>
    <div id="cpn-discount" style="font-size:1.6rem;font-weight:700;color:var(--primary);margin-bottom:1.5rem"></div>
    <button class="btn" id="cpn-btn" style="max-width:300px;font-size:1rem;padding:.8rem">Pegar Desconto</button>
    <p style="font-size:.75rem;color:var(--muted);margin-top:1rem">
      O código aparece apenas após clicar. O link de afiliado garante sua comissão na rede parceira.
    </p>
  </div>
</section>

<!-- Modal -->
<div class="modal-backdrop" id="couponModal">
  <div class="modal">
    <button class="close" id="modalClose">&times;</button>
    <h3>🎉 Seu cupom</h3>
    <p id="modalMsg"></p>
    <div class="code-box" id="modalCode" title="Clique para copiar"></div>
    <p style="font-size:.8rem;color:var(--muted)">Clique no código para copiar · A loja abre em nova aba</p>
  </div>
</div>

<footer><p>&copy; 2024 Cupincha</p></footer>
<script src="/assets/js/main.js"></script>
</body>
</html>

<script>
  (function () {
    "use strict";

    var EtractionBeneficios = {
      swiper: null,
      mediaQuery: window.matchMedia("(max-width: 767px)"),

      init: function () {
        this.controlarSwiper();
        this.registrarEventos();
      },

      registrarEventos: function () {
        var self = this;

        if (this.mediaQuery.addEventListener) {
          this.mediaQuery.addEventListener("change", function () {
            self.controlarSwiper();
          });

          return;
        }

        this.mediaQuery.addListener(function () {
          self.controlarSwiper();
        });
      },

      controlarSwiper: function () {
        if (this.mediaQuery.matches) {
          this.criarSwiper();
          return;
        }

        this.destruirSwiper();
      },

      criarSwiper: function () {
        var elemento = document.querySelector(
          ".etraction-beneficios__swiper"
        );

        if (
          !elemento ||
          this.swiper ||
          typeof window.Swiper === "undefined"
        ) {
          return;
        }

        this.swiper = new Swiper(elemento, {
          slidesPerView: 1,
          slidesPerGroup: 1,
          spaceBetween: 0,
          centeredSlides: true,
          loop: true,
          speed: 550,
          effect: "fade",

          fadeEffect: {
            crossFade: true
          },

          autoplay: {
            delay: 3000,
            disableOnInteraction: false,
            pauseOnMouseEnter: false
          },

          navigation: {
            prevEl: ".etraction-beneficios__seta--anterior",
            nextEl: ".etraction-beneficios__seta--proxima"
          },

          allowTouchMove: true,
          grabCursor: true,
          observer: true,
          observeParents: true,
          watchSlidesProgress: true,

          a11y: {
            enabled: true,
            prevSlideMessage: "Benefício anterior",
            nextSlideMessage: "Próximo benefício"
          }
        });
      },

      destruirSwiper: function () {
        if (!this.swiper) {
          return;
        }

        this.swiper.destroy(true, true);
        this.swiper = null;
      }
    };

    function iniciarEtractionBeneficios() {
      EtractionBeneficios.init();
    }

    if (document.readyState === "loading") {
      document.addEventListener(
        "DOMContentLoaded",
        iniciarEtractionBeneficios
      );

      return;
    }

    iniciarEtractionBeneficios();
  })();
</script>

    .etraction-tarja-frete {

    .etraction-tarja-cupom {

    }

    .etraction-tarja-seta-proxima {

    }

  @media (max-width: 370px) {

  @media (prefers-reduced-motion: reduce) {
    .etraction-tarja-slide,
    .etraction-tarja-cupom,
    .etraction-tarja-seta {
      transition: none !important;
    }
  }


  /* Reforço para impedir que camadas da plataforma bloqueiem os controles */
  .etraction-tarja-topo {
    z-index: 1 !important;
    isolation: isolate !important;
    pointer-events: auto !important;
  }

  .etraction-tarja-conteudo,
  .etraction-tarja-setas,
  .etraction-tarja-seta,
  .etraction-tarja-cupom {
    pointer-events: auto !important;
  }

  .etraction-tarja-seta,
  .etraction-tarja-cupom {
    z-index: 5 !important;
    touch-action: manipulation !important;
    user-select: none !important;
    -webkit-user-select: none !important;
  }

  .etraction-tarja-seta svg,
  .etraction-tarja-seta svg *,

    pointer-events: none !important;
  }

  /* Integração com a header fixa da ToalhaShow */

  html body #header-react-app.header-fixed {

</style>

<script>
  (function () {
    "use strict";

    var NOME_GLOBAL = "EtractionTarjaTopoV7Header";
    var SELETOR_RAIZ = ".etraction-tarja-topo";
    var TEMPO_ROTACAO = 4500;

    function maisProximo(elemento, seletor) {
      if (!elemento) return null;
      if (elemento.nodeType === 3) elemento = elemento.parentElement;

      if (elemento.closest) {
        return elemento.closest(seletor);
      }

      while (elemento && elemento.nodeType === 1) {
        if (elemento.matches && elemento.matches(seletor)) return elemento;
        elemento = elemento.parentElement;
      }

      return null;
    }

    function obterEstado(raiz) {
      if (!raiz) return null;

      if (!raiz.etractionTarjaEstado) {
        raiz.etractionTarjaEstado = {
          indice: 0,
          intervalo: null
        };
      }

      return raiz.etractionTarjaEstado;
    }

    function obterSlides(raiz) {
      return Array.prototype.slice.call(
        raiz.querySelectorAll(".etraction-tarja-slide")
      );
    }

    function exibirSlide(raiz, indice) {
      var estado = obterEstado(raiz);
      var slides = obterSlides(raiz);
      var quantidade = slides.length;

      if (!estado || !quantidade) return;

      estado.indice = (indice + quantidade) % quantidade;

      slides.forEach(function (slide, posicao) {
        var ativo = posicao === estado.indice;
        slide.classList.toggle("etraction-ativo", ativo);
        slide.setAttribute("aria-hidden", ativo ? "false" : "true");
      });
    }

    function pararRotacao(raiz) {
      var estado = obterEstado(raiz);
      if (!estado || !estado.intervalo) return;

      window.clearInterval(estado.intervalo);
      estado.intervalo = null;
    }

    function iniciarRotacao(raiz) {
      var estado = obterEstado(raiz);
      var slides = obterSlides(raiz);

      if (!estado) return;

      pararRotacao(raiz);

      if (slides.length <= 1 || document.hidden) return;

      estado.intervalo = window.setInterval(function () {
        var slidesAtuais = obterSlides(raiz);

        if (!document.documentElement.contains(raiz)) {
          pararRotacao(raiz);
          return;
        }

        if (slidesAtuais.length > 1) {
          exibirSlide(raiz, estado.indice + 1);
        }
      }, TEMPO_ROTACAO);
    }

    function reiniciarRotacao(raiz) {
      pararRotacao(raiz);
      iniciarRotacao(raiz);
    }

    function confirmarCopia(botao, cupom, sucesso) {
      var texto = botao.querySelector(".etraction-tarja-cupom-texto");
      if (!texto) return;

      window.clearTimeout(botao.etractionTimeout);

      texto.textContent = sucesso ? "COPIADO" : "COPIE: " + cupom;
      botao.classList.toggle("etraction-copiado", sucesso);
      botao.setAttribute(
        "aria-label",
        sucesso ? "Cupom " + cupom + " copiado" : "Copiar cupom " + cupom
      );

      botao.etractionTimeout = window.setTimeout(function () {
        texto.textContent = cupom;
        botao.classList.remove("etraction-copiado");
        botao.setAttribute("aria-label", "Copiar cupom " + cupom);
      }, sucesso ? 1400 : 2400);
    }

    function copiarComFallback(texto) {
      var campo = document.createElement("textarea");
      var copiado = false;

      campo.value = texto;
      campo.setAttribute("readonly", "readonly");
      campo.style.position = "fixed";
      campo.style.top = "0";
      campo.style.left = "0";
      campo.style.width = "1px";
      campo.style.height = "1px";
      campo.style.padding = "0";
      campo.style.border = "0";
      campo.style.opacity = "0";
      campo.style.pointerEvents = "none";

      document.body.appendChild(campo);

      try {
        campo.focus({ preventScroll: true });
      } catch (erroFocus) {
        campo.focus();
      }

      campo.select();
      campo.setSelectionRange(0, campo.value.length);

      try {
        copiado = document.execCommand("copy") === true;
      } catch (erroCopy) {
        copiado = false;
      }

      document.body.removeChild(campo);
      return copiado;
    }

    function copiarCupom(botao) {
      var cupom = botao.getAttribute("data-cupom") || "GANHA5";
      var copiado = copiarComFallback(cupom);

      if (copiado) {
        confirmarCopia(botao, cupom, true);
        return;
      }

      if (
        navigator.clipboard &&
        typeof navigator.clipboard.writeText === "function" &&
        window.isSecureContext
      ) {
        navigator.clipboard.writeText(cupom).then(
          function () {
            confirmarCopia(botao, cupom, true);
          },
          function () {
            confirmarCopia(botao, cupom, false);
          }
        );
        return;
      }

      confirmarCopia(botao, cupom, false);
    }

    function executarControle(controle, evento) {
      var raiz = maisProximo(controle, SELETOR_RAIZ);
      var estado = obterEstado(raiz);

      if (!raiz || !estado) return;

      if (evento) {
        evento.preventDefault();
        evento.stopPropagation();
      }

      if (controle.classList.contains("etraction-tarja-seta-anterior")) {
        exibirSlide(raiz, estado.indice - 1);
        reiniciarRotacao(raiz);
        return;
      }

      if (controle.classList.contains("etraction-tarja-seta-proxima")) {
        exibirSlide(raiz, estado.indice + 1);
        reiniciarRotacao(raiz);
        return;
      }

      if (controle.classList.contains("etraction-tarja-cupom")) {
        copiarCupom(controle);
      }
    }

    function encontrarControle(alvo) {
      return maisProximo(
        alvo,
        ".etraction-tarja-seta-anterior, " +
          ".etraction-tarja-seta-proxima, " +
          ".etraction-tarja-cupom"
      );
    }

    function tratarPointerDown(evento) {
      if (typeof evento.button === "number" && evento.button !== 0) return;

      var controle = encontrarControle(evento.target);
      var raiz = controle ? maisProximo(controle, SELETOR_RAIZ) : null;
      var estado = obterEstado(raiz);

      if (!controle || !raiz || !estado) return;

      executarControle(controle, evento);
    }

    function tratarTeclado(evento) {
      if (evento.key !== "Enter" && evento.key !== " ") return;

      var controle = encontrarControle(evento.target);
      if (!controle) return;

      executarControle(controle, evento);
    }

    function posicionarAntesDaHeader(raiz) {
      var header = document.getElementById("header-react-app");
      var altura;

      if (!raiz || !header || !header.parentNode) return;

      /* Remove a tarja de wrappers que possam criar uma camada inferior. */
      if (raiz.nextElementSibling !== header || raiz.parentNode !== header.parentNode) {
        header.parentNode.insertBefore(raiz, header);
      }

      altura = Math.round(raiz.getBoundingClientRect().height);

      if (!altura) {
        altura = window.innerWidth <= 767 ? 46 : 38;
      }

      header.style.setProperty("--etraction-header-top", altura + "px", "important");
      header.style.setProperty("top", altura + "px", "important");
    }

    function inicializarRaiz(raiz) {
      if (!raiz) return;

      posicionarAntesDaHeader(raiz);

      var estado = obterEstado(raiz);
      var slides = obterSlides(raiz);

      if (!estado || !slides.length) return;

      exibirSlide(raiz, Math.min(estado.indice, slides.length - 1));
      iniciarRotacao(raiz);
      raiz.setAttribute("data-etraction-tarja-inicializada", "true");
    }

    function inicializarTodas() {
      Array.prototype.forEach.call(
        document.querySelectorAll(SELETOR_RAIZ),
        inicializarRaiz
      );
    }

    function registrarEventosGlobais() {
      if (window[NOME_GLOBAL] && window[NOME_GLOBAL].eventosRegistrados) {
        return;
      }

      window[NOME_GLOBAL] = window[NOME_GLOBAL] || {};
      window[NOME_GLOBAL].eventosRegistrados = true;

      window.addEventListener("pointerdown", tratarPointerDown, true);
      window.addEventListener("keydown", tratarTeclado, true);

      window.addEventListener("resize", function () {
        inicializarTodas();
      });

      document.addEventListener("visibilitychange", function () {
        Array.prototype.forEach.call(
          document.querySelectorAll(SELETOR_RAIZ),
          function (raiz) {
            if (document.hidden) {
              pararRotacao(raiz);
            } else {
              iniciarRotacao(raiz);
            }
          }
        );
      });

      if (typeof MutationObserver === "function") {
        var observador = new MutationObserver(function () {
          inicializarTodas();
        });

        observador.observe(document.documentElement, {
          childList: true,
          subtree: true
        });

        window[NOME_GLOBAL].observador = observador;
      }
    }

    registrarEventosGlobais();

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", inicializarTodas, {
        once: true
      });
    } else {
      inicializarTodas();
    }

    window.setTimeout(inicializarTodas, 250);
    window.setTimeout(inicializarTodas, 1000);
    window.setTimeout(inicializarTodas, 2500);
  })();
</script>

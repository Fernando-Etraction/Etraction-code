<style>
  .etraction-tarja-topo {
    position: relative !important;
    width: 100% !important;
    min-height: 38px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: #f4f4f2 !important;
    color: #111111 !important;
    overflow: hidden !important;
    box-sizing: border-box !important;
    font-family: Arial, Helvetica, sans-serif !important;
  }

  .etraction-tarja-topo *,
  .etraction-tarja-topo *::before,
  .etraction-tarja-topo *::after {
    box-sizing: border-box !important;
  }

  .etraction-tarja-conteudo {
    position: relative !important;
    width: 100% !important;
    max-width: 1120px !important;
    min-height: 38px !important;
    margin: 0 auto !important;
    padding: 0 46px !important;
  }

  .etraction-tarja-slides {
    position: relative !important;
    width: 100% !important;
    min-height: 38px !important;
  }

  .etraction-tarja-slide {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    min-height: 38px !important;
    padding: 5px 8px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 7px !important;
    color: #111111 !important;
    font-size: 13px !important;
    font-weight: 400 !important;
    line-height: 1.2 !important;
    text-align: center !important;
    opacity: 0 !important;
    visibility: hidden !important;
    transform: translateY(5px) !important;
    transition:
      opacity 0.25s ease,
      transform 0.25s ease,
      visibility 0.25s ease !important;
    pointer-events: none !important;
  }

  .etraction-tarja-slide.etraction-ativo {
    opacity: 1 !important;
    visibility: visible !important;
    transform: translateY(0) !important;
    pointer-events: auto !important;
  }

  .etraction-tarja-texto {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex-wrap: wrap !important;
    gap: 4px !important;
  }

  .etraction-tarja-destaque {
    color: #111111 !important;
    font-weight: 700 !important;
  }

  .etraction-tarja-cupom {
    min-height: 24px !important;
    padding: 4px 8px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 5px !important;
    border: 1px solid #111111 !important;
    border-radius: 3px !important;
    background: #111111 !important;
    color: #ffffff !important;
    font-family: inherit !important;
    font-size: 11px !important;
    font-weight: 700 !important;
    letter-spacing: 0.5px !important;
    line-height: 1 !important;
    cursor: pointer !important;
    appearance: none !important;
    transition:
      background 0.2s ease,
      color 0.2s ease !important;
  }

  .etraction-tarja-cupom:hover {
    background: #ffffff !important;
    color: #111111 !important;
  }

  .etraction-tarja-cupom.etraction-copiado {
    background: #ffffff !important;
    color: #111111 !important;
  }

  .etraction-tarja-cupom svg {
    width: 12px !important;
    height: 12px !important;
    display: block !important;
    flex: 0 0 auto !important;
    fill: none !important;
    stroke: currentColor !important;
    stroke-width: 1.8 !important;
  }

  .etraction-tarja-seta {
    position: absolute !important;
    top: 50% !important;
    width: 28px !important;
    height: 28px !important;
    padding: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border: 0 !important;
    background: transparent !important;
    color: #111111 !important;
    opacity: 0.6 !important;
    cursor: pointer !important;
    transform: translateY(-50%) !important;
    appearance: none !important;
    z-index: 5 !important;
    transition: opacity 0.2s ease !important;
  }

  .etraction-tarja-seta:hover {
    opacity: 1 !important;
  }

  .etraction-tarja-seta-anterior {
    left: 7px !important;
  }

  .etraction-tarja-seta-proxima {
    right: 7px !important;
  }

  .etraction-tarja-seta svg {
    width: 14px !important;
    height: 14px !important;
    display: block !important;
    fill: none !important;
    stroke: currentColor !important;
    stroke-width: 1.7 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
  }

  @media (max-width: 767px) {
    .etraction-tarja-topo,
    .etraction-tarja-conteudo,
    .etraction-tarja-slides,
    .etraction-tarja-slide {
      min-height: 46px !important;
    }

    .etraction-tarja-conteudo {
      padding: 0 35px !important;
    }

    .etraction-tarja-slide {
      padding: 5px 3px !important;
      gap: 5px !important;
      font-size: 11.5px !important;
      line-height: 1.25 !important;
    }

    .etraction-tarja-cupom {
      min-height: 22px !important;
      padding: 3px 6px !important;
      font-size: 10px !important;
    }

    .etraction-tarja-seta {
      width: 25px !important;
      height: 25px !important;
    }

    .etraction-tarja-seta-anterior {
      left: 3px !important;
    }

    .etraction-tarja-seta-proxima {
      right: 3px !important;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .etraction-tarja-slide,
    .etraction-tarja-cupom,
    .etraction-tarja-seta {
      transition: none !important;
    }
  }
</style>

<div
  class="etraction-tarja-topo"
  role="region"
  aria-label="Condições comerciais"
>
  <div class="etraction-tarja-conteudo">
    <button
      class="etraction-tarja-seta etraction-tarja-seta-anterior"
      type="button"
      aria-label="Informação anterior"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    </button>

    <div class="etraction-tarja-slides" aria-live="polite">
      <div class="etraction-tarja-slide etraction-ativo">
        <span class="etraction-tarja-texto">
          Parcelamento em até
          <strong class="etraction-tarja-destaque">10x no cartão</strong>
        </span>
      </div>

      <div class="etraction-tarja-slide">
        <span class="etraction-tarja-texto">
          Frete fixo de
          <strong class="etraction-tarja-destaque">R$ 14,90</strong>
          para Sul e Sudeste em compras acima de
          <strong class="etraction-tarja-destaque">R$ 229,90</strong>
        </span>
      </div>

      <div class="etraction-tarja-slide">
        <span class="etraction-tarja-texto">
          Utilize o cupom e ganhe
          <strong class="etraction-tarja-destaque">5% OFF</strong>
        </span>

        <button
          class="etraction-tarja-cupom"
          type="button"
          data-cupom="GANHA5"
          aria-label="Copiar cupom GANHA5"
          title="Clique para copiar"
        >
          <span class="etraction-tarja-cupom-texto">GANHA5</span>

          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="8" width="11" height="11" rx="2"></rect>
            <path
              d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <button
      class="etraction-tarja-seta etraction-tarja-seta-proxima"
      type="button"
      aria-label="Próxima informação"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 18l6-6-6-6"></path>
      </svg>
    </button>
  </div>
</div>

<script>
  (function () {
    "use strict";

    var EtractionTarjaTopo = {
      elemento: null,
      slides: [],
      anterior: null,
      proximo: null,
      indice: 0,
      intervalo: null,
      tempo: 4500,

      iniciar: function () {
        this.elemento = document.querySelector(".etraction-tarja-topo");

        if (!this.elemento) {
          return;
        }

        this.slides = Array.prototype.slice.call(
          this.elemento.querySelectorAll(".etraction-tarja-slide")
        );

        this.anterior = this.elemento.querySelector(
          ".etraction-tarja-seta-anterior"
        );

        this.proximo = this.elemento.querySelector(
          ".etraction-tarja-seta-proxima"
        );

        if (!this.slides.length) {
          return;
        }

        this.adicionarEventos();
        this.exibir(0);
        this.iniciarRotacao();
      },

      adicionarEventos: function () {
        var self = this;

        if (this.anterior) {
          this.anterior.addEventListener("click", function () {
            self.exibir(self.indice - 1);
            self.reiniciarRotacao();
          });
        }

        if (this.proximo) {
          this.proximo.addEventListener("click", function () {
            self.exibir(self.indice + 1);
            self.reiniciarRotacao();
          });
        }

        this.elemento
          .querySelectorAll(".etraction-tarja-cupom")
          .forEach(function (botao) {
            botao.addEventListener("click", function () {
              self.copiarCupom(botao);
            });
          });

        this.elemento.addEventListener("mouseenter", function () {
          self.pararRotacao();
        });

        this.elemento.addEventListener("mouseleave", function () {
          self.iniciarRotacao();
        });

        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            self.pararRotacao();
          } else {
            self.iniciarRotacao();
          }
        });
      },

      exibir: function (indice) {
        var quantidade = this.slides.length;

        this.indice = (indice + quantidade) % quantidade;

        this.slides.forEach(function (slide, posicao) {
          var ativo = posicao === this.indice;

          slide.classList.toggle("etraction-ativo", ativo);
          slide.setAttribute("aria-hidden", ativo ? "false" : "true");
        }, this);
      },

      iniciarRotacao: function () {
        var self = this;

        this.pararRotacao();

        if (this.slides.length <= 1) {
          return;
        }

        this.intervalo = window.setInterval(function () {
          self.exibir(self.indice + 1);
        }, this.tempo);
      },

      pararRotacao: function () {
        if (this.intervalo) {
          window.clearInterval(this.intervalo);
          this.intervalo = null;
        }
      },

      reiniciarRotacao: function () {
        this.pararRotacao();
        this.iniciarRotacao();
      },

      copiarCupom: function (botao) {
        var self = this;
        var cupom = botao.getAttribute("data-cupom") || "GANHA5";

        if (
          navigator.clipboard &&
          typeof navigator.clipboard.writeText === "function" &&
          window.isSecureContext
        ) {
          navigator.clipboard
            .writeText(cupom)
            .then(function () {
              self.confirmarCopia(botao);
            })
            .catch(function () {
              self.copiarFallback(cupom);
              self.confirmarCopia(botao);
            });

          return;
        }

        this.copiarFallback(cupom);
        this.confirmarCopia(botao);
      },

      copiarFallback: function (texto) {
        var campo = document.createElement("textarea");

        campo.value = texto;
        campo.setAttribute("readonly", "");
        campo.style.position = "fixed";
        campo.style.left = "-9999px";
        campo.style.opacity = "0";

        document.body.appendChild(campo);

        campo.focus();
        campo.select();
        campo.setSelectionRange(0, campo.value.length);

        try {
          document.execCommand("copy");
        } catch (erro) {
          console.warn("Não foi possível copiar o cupom.", erro);
        }

        document.body.removeChild(campo);
      },

      confirmarCopia: function (botao) {
        var texto = botao.querySelector(".etraction-tarja-cupom-texto");

        if (!texto) {
          return;
        }

        window.clearTimeout(botao.etractionTimeout);

        texto.textContent = "COPIADO";
        botao.classList.add("etraction-copiado");

        botao.etractionTimeout = window.setTimeout(function () {
          texto.textContent = "GANHA5";
          botao.classList.remove("etraction-copiado");
        }, 1400);
      }
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        EtractionTarjaTopo.iniciar();
      });
    } else {
      EtractionTarjaTopo.iniciar();
    }
  })();
</script>

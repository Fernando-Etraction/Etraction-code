    #header-react-app.etraction-header-femme.is-tablet-mobile

    #header-react-app.etraction-header-femme.is-tablet-mobile
      .logo-preview

    #header-react-app.etraction-header-femme,

    #header-react-app.etraction-header-femme *::after {

<script>
  (function () {
    "use strict";

    var EtractionHeaderFemme = {
      header: null,
      tarja: null,
      tarjaWrapper: null,
      observer: null,
      resizeObserver: null,
      scrollFrame: null,
      resizeTimer: null,
      fecharMenuNativo: null,
      limiteRolagem: 120,

      iniciar: function () {
        this.localizarHeader();
        this.observarRenderizacao();

        window.addEventListener("scroll", this.aoRolar.bind(this), {
          passive: true
        });

        window.addEventListener("resize", this.aoRedimensionar.bind(this), {
          passive: true
        });
      },

      localizarHeader: function () {
        var headerEncontrada = document.querySelector("#header-react-app");

        if (!headerEncontrada) {
          return;
        }

        if (this.header === headerEncontrada) {
          return;
        }

        this.header = headerEncontrada;
        this.header.classList.add("etraction-header-femme");
        this.localizarTarja();
        this.configurarFecharMenuMobile();
        this.atualizarPosicaoInicial();
        this.atualizarEstado();
      },

      localizarFecharMenuNativo: function (menu) {
        if (
          this.fecharMenuNativo &&
          this.fecharMenuNativo.isConnected &&
          menu.contains(this.fecharMenuNativo)
        ) {
          return this.fecharMenuNativo;
        }

        var seletores = [
          ".close-button",
          ".close-menu",
          ".menu-close",
          ".menu-mobile-fechar",
          '[aria-label*="fechar" i]',
          '[title*="fechar" i]'
        ];
        var candidatos = menu.querySelectorAll(seletores.join(","));

        for (var indice = 0; indice < candidatos.length; indice += 1) {
          if (
            !candidatos[indice].classList.contains(
              "etraction-menu-mobile-fechar"
            )
          ) {
            this.fecharMenuNativo = candidatos[indice];
            this.fecharMenuNativo.classList.add(
              "etraction-menu-fechar-nativo"
            );
            return this.fecharMenuNativo;
          }
        }

        this.fecharMenuNativo = null;
        return null;
      },

      configurarFecharMenuMobile: function () {
        if (!this.header) {
          return;
        }

        var menu = this.header.querySelector(".menu-mobile-ctn");

        if (!menu) {
          this.fecharMenuNativo = null;
          return;
        }

        var infoUsuario = menu.querySelector(".info-user");

        if (!infoUsuario) {
          return;
        }

        var fecharNativo = this.localizarFecharMenuNativo(menu);
        var fecharCustomizado = infoUsuario.querySelector(
          ".etraction-menu-mobile-fechar"
        );

        if (fecharCustomizado) {
          return;
        }

        var self = this;
        fecharCustomizado = document.createElement("button");
        fecharCustomizado.type = "button";
        fecharCustomizado.className = "etraction-menu-mobile-fechar";
        fecharCustomizado.setAttribute("aria-label", "Fechar menu");
        fecharCustomizado.textContent = "\u00d7";

        fecharCustomizado.addEventListener("click", function (evento) {
          evento.preventDefault();
          evento.stopPropagation();

          var controleNativo =
            self.localizarFecharMenuNativo(menu) || fecharNativo;

          if (controleNativo && controleNativo.isConnected) {
            controleNativo.click();
            return;
          }

          var botaoMenu = self.header.querySelector(
            ".header-menu-button-ctn .menu-button"
          );

          if (botaoMenu) {
            botaoMenu.click();
          }
        });

        infoUsuario.appendChild(fecharCustomizado);
      },

      localizarTarja: function () {
        var tarjaEncontrada = document.querySelector(
          ".etraction-tarja-topo, .promo-banner-unico"
        );

        if (this.tarja === tarjaEncontrada) {
          return;
        }

        if (this.resizeObserver) {
          this.resizeObserver.disconnect();
          this.resizeObserver = null;
        }

        if (this.tarjaWrapper) {
          this.tarjaWrapper.classList.remove("etraction-tarja-wrapper");
        }

        this.tarja = tarjaEncontrada;
        this.tarjaWrapper = this.tarja
          ? this.tarja.closest(".pagina-conteudo-adicional") ||
            this.tarja.parentElement
          : null;

        if (this.tarjaWrapper) {
          this.tarjaWrapper.classList.add("etraction-tarja-wrapper");
        }

        if (this.tarja && "ResizeObserver" in window) {
          var self = this;

          this.resizeObserver = new ResizeObserver(function () {
            self.atualizarPosicaoInicial();
            self.atualizarEstado();
          });

          this.resizeObserver.observe(this.tarja);

          if (this.tarjaWrapper && this.tarjaWrapper !== this.tarja) {
            this.resizeObserver.observe(this.tarjaWrapper);
          }
        }
      },

      atualizarPosicaoInicial: function () {
        if (!this.header) {
          return;
        }

        this.localizarTarja();

        var estavaEmRolagem = this.header.classList.contains(
          "etraction-header-rolagem"
        );

        /*
         * Mede a posição absoluta real, inclusive quando o visualizador da
         * Magazord adiciona espaço antes da tarja. Usar somente a altura da
         * tarja faria a header subir e invadir o texto promocional.
         */
        if (estavaEmRolagem) {
          this.header.classList.remove("etraction-header-rolagem");
        }

        this.header.style.removeProperty("--etraction-header-top");

        var headerRect = this.header.getBoundingClientRect();
        var alturaHeader = Math.max(
          62,
          Math.round(headerRect.height || this.header.offsetHeight)
        );

        if (this.tarja) {
          var tarjaRect = this.tarja.getBoundingClientRect();
          var referencia = this.header.offsetParent;
          var referenciaRect = referencia
            ? referencia.getBoundingClientRect()
            : { top: -window.scrollY };
          var bordaReferencia =
            referencia && referencia !== document.body
              ? referencia.clientTop || 0
              : 0;

          /*
           * "offsetTop + diferença" falha no mobile quando a posição
           * absoluta ainda está em "top: auto": o offset pode ser 0 mesmo
           * com a header visualmente abaixo da tarja. A nova conta usa a
           * mesma referência real do position:absolute e funciona tanto
           * no body quanto dentro de um contêiner posicionado.
           */
          var topoCorreto = Math.max(
            0,
            Math.round(
              tarjaRect.bottom - referenciaRect.top - bordaReferencia
            )
          );

          this.header.style.setProperty(
            "--etraction-header-top",
            topoCorreto + "px"
          );

          this.limiteRolagem = Math.max(
            80,
            Math.round(tarjaRect.bottom + window.scrollY + alturaHeader)
          );
        } else {
          this.limiteRolagem = Math.max(
            80,
            Math.round(headerRect.top + window.scrollY + alturaHeader)
          );
        }

        if (estavaEmRolagem) {
          this.header.classList.add("etraction-header-rolagem");
        }
      },

      atualizarEstado: function () {
        if (!this.header) {
          return;
        }

        this.header.classList.toggle(
          "etraction-header-rolagem",
          window.scrollY > this.limiteRolagem
        );
      },

      aoRolar: function () {
        var self = this;

        if (this.scrollFrame) {
          return;
        }

        this.scrollFrame = window.requestAnimationFrame(function () {
          self.atualizarEstado();
          self.scrollFrame = null;
        });
      },

      aoRedimensionar: function () {
        var self = this;

        window.clearTimeout(this.resizeTimer);

        this.resizeTimer = window.setTimeout(function () {
          self.configurarFecharMenuMobile();
          self.atualizarPosicaoInicial();
          self.atualizarEstado();
        }, 120);
      },

      observarRenderizacao: function () {
        var self = this;

        this.observer = new MutationObserver(function () {
          if (!self.header || !self.header.isConnected) {
            self.localizarHeader();
          }

          self.configurarFecharMenuMobile();

          if (!self.tarja || !self.tarja.isConnected) {
            self.localizarTarja();
            self.atualizarPosicaoInicial();
            self.atualizarEstado();
          }
        });

        this.observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      }
    };

    function iniciarEtractionHeader() {
      EtractionHeaderFemme.iniciar();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", iniciarEtractionHeader, {
        once: true
      });
    } else {
      iniciarEtractionHeader();
    }
  })();
</script>

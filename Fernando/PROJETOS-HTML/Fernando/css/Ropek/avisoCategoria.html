@media (max-width: 767px) {
    #etraction-promocao-lookinhos
    .etraction-promocao-container {
        padding: 0 10px !important;
    }

    #etraction-promocao-lookinhos .pesquisa-promocao {
        margin: 20px auto !important;
        padding: 8px !important;
        border-radius: 18px !important;
    }

    #etraction-promocao-lookinhos .descricao-desconto {
        padding: 24px 14px !important;
        border-width: 3px !important;
        border-radius: 13px !important;
    }

    #etraction-promocao-lookinhos .descricao-desconto h2 {
        flex-direction: column !important;
        gap: 7px !important;
        margin-bottom: 14px !important;
        font-size: 24px !important;
        line-height: 1.15 !important;
        letter-spacing: -0.5px !important;
    }

    #etraction-promocao-lookinhos
    .etraction-promocao-separador {
        font-size: 13px !important;
    }

    #etraction-promocao-lookinhos
    .etraction-promocao-frete {
        padding: 7px 10px !important;
        font-size: 17px !important;
        line-height: 1.25 !important;
    }

    #etraction-promocao-lookinhos .etraction-cupom-area {
        flex-direction: column !important;
        gap: 8px !important;
        margin-bottom: 14px !important;
    }

    #etraction-promocao-lookinhos .etraction-cupom-texto {
        font-size: 13px !important;
    }

    #etraction-promocao-lookinhos .etraction-cupom-botao {
        min-height: 39px !important;
        padding: 8px 16px !important;
        font-size: 14px !important;
    }

    #etraction-promocao-lookinhos .obs {
        font-size: 13px !important;
        line-height: 1.5 !important;
    }
}
</style>

<script>
(function () {
    "use strict";

    var SELETOR_REFERENCIA =
        "#main-area > div.area-breadcrumb";

    var ID_PROMOCAO =
        "etraction-promocao-lookinhos";

    var CODIGO_CUPOM =
        "LOOKINHOS";

    var tentativas = 0;
    var maxTentativas = 50;
    var intervalo = null;

    function copiarTextoFallback(texto) {
        var campo = document.createElement("textarea");

        campo.value = texto;
        campo.setAttribute("readonly", "");
        campo.style.position = "fixed";
        campo.style.top = "-9999px";
        campo.style.left = "-9999px";

        document.body.appendChild(campo);

        campo.select();
        campo.setSelectionRange(0, campo.value.length);

        var copiado = false;

        try {
            copiado = document.execCommand("copy");
        } catch (erro) {
            copiado = false;
        }

        document.body.removeChild(campo);

        return copiado;
    }

    function mostrarCupomCopiado(botao) {
        if (!botao) {
            return;
        }

        var textoOriginal =
            botao.getAttribute("data-texto-original") ||
            CODIGO_CUPOM;

        botao.classList.add("etraction-cupom-copiado");

        botao.innerHTML =
            '<span class="etraction-cupom-icone">' +
                '<svg viewBox="0 0 256 256" aria-hidden="true">' +
                    '<path d="M229.66 77.66l-128 128a8 8 0 0 1-11.32 0l-56-56a8 8 0 0 1 11.32-11.32L96 188.69 218.34 66.34a8 8 0 0 1 11.32 11.32Z"></path>' +
                '</svg>' +
            '</span>' +
            '<span>CUPOM COPIADO!</span>';

        window.setTimeout(function () {
            botao.classList.remove(
                "etraction-cupom-copiado"
            );

            botao.innerHTML =
                '<span class="etraction-cupom-icone">' +
                    '<svg viewBox="0 0 256 256" aria-hidden="true">' +
                        '<path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8Zm-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"></path>' +
                    '</svg>' +
                '</span>' +
                '<span>' + textoOriginal + '</span>';
        }, 2200);
    }

    function copiarCupom(botao) {
        if (
            navigator.clipboard &&
            typeof navigator.clipboard.writeText === "function"
        ) {
            navigator.clipboard
                .writeText(CODIGO_CUPOM)
                .then(function () {
                    mostrarCupomCopiado(botao);
                })
                .catch(function () {
                    if (copiarTextoFallback(CODIGO_CUPOM)) {
                        mostrarCupomCopiado(botao);
                    }
                });

            return;
        }

        if (copiarTextoFallback(CODIGO_CUPOM)) {
            mostrarCupomCopiado(botao);
        }
    }

    function adicionarEventoCupom(promocao) {
        var botao = promocao.querySelector(
            ".etraction-cupom-botao"
        );

        if (!botao) {
            return;
        }

        botao.addEventListener("click", function () {
            copiarCupom(botao);
        });
    }

    function criarPromocao() {
        if (document.getElementById(ID_PROMOCAO)) {
            return true;
        }

        var referencia = document.querySelector(
            SELETOR_REFERENCIA
        );

        if (!referencia) {
            return false;
        }

        var promocao = document.createElement("section");

        promocao.id = ID_PROMOCAO;

        promocao.innerHTML =
            '<div class="etraction-promocao-container">' +
                '<div class="pesquisa-promocao">' +
                    '<div class="descricao-desconto">' +

                        '<h2>' +
                            '<span class="etraction-promocao-oferta">' +
                                '2 Lookinhos por R$144' +
                            '</span>' +

                            '<span class="etraction-promocao-separador">' +
                                'ou' +
                            '</span>' +

                            '<span class="etraction-promocao-oferta">' +
                                '3 Lookinhos por R$207' +
                            '</span>' +

                            '<span class="etraction-promocao-frete">' +
                                '+ Frete Grátis' +
                            '</span>' +
                        '</h2>' +

                        '<div class="etraction-cupom-area">' +
                            '<span class="etraction-cupom-texto">' +
                                'Use o cupom:' +
                            '</span>' +

                            '<button ' +
                                'type="button" ' +
                                'class="etraction-cupom-botao" ' +
                                'data-texto-original="LOOKINHOS" ' +
                                'aria-label="Copiar cupom LOOKINHOS"' +
                            '>' +
                                '<span class="etraction-cupom-icone">' +
                                    '<svg viewBox="0 0 256 256" aria-hidden="true">' +
                                        '<path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8Zm-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"></path>' +
                                    '</svg>' +
                                '</span>' +
                                '<span>LOOKINHOS</span>' +
                            '</button>' +

                            '<p class="etraction-cupom-ajuda">' +
                                'Clique no cupom para copiar' +
                            '</p>' +
                        '</div>' +

                        '<p class="obs">' +
                            'Escolha 2 ou 3 lookinhos e aplique o cupom LOOKINHOS no carrinho.' +

                            '<span class="obs-secundaria">' +
                                'Na compra de 3 lookinhos, você também garante Frete Grátis.' +
                            '</span>' +
                        '</p>' +

                    '</div>' +
                '</div>' +
            '</div>';

        referencia.insertAdjacentElement(
            "afterend",
            promocao
        );

        adicionarEventoCupom(promocao);

        return true;
    }

    function iniciarPromocao() {
        if (criarPromocao()) {
            return;
        }

        intervalo = window.setInterval(function () {
            tentativas++;

            if (
                criarPromocao() ||
                tentativas >= maxTentativas
            ) {
                window.clearInterval(intervalo);
                intervalo = null;
            }
        }, 300);
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            iniciarPromocao,
            { once: true }
        );
    } else {
        iniciarPromocao();
    }
})();
</script>

        var AVATAR_COLORS = [

        var currentUrl = window.location.href;

        function escapeHtml(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function hashString(value) {
            var hash = 0;

            for (var index = 0; index < value.length; index++) {
                hash =
                    ((hash << 5) - hash) +
                    value.charCodeAt(index);

                hash |= 0;
            }

            return Math.abs(hash);
        }

        function getProductKey() {
            var pathname = window.location.pathname
                .replace(/^\/+|\/+$/g, "")
                .toLowerCase();

            return pathname || "produto-sem-slug";
        }

        function formatCount(value) {
            return Number(value).toLocaleString("pt-BR");
        }

        function createStars(rating) {
            var roundedRating = Math.round(
                Number(rating) || 5
            );

            var stars = "";

            for (var index = 1; index <= 5; index++) {
                stars +=
                    index <= roundedRating
                        ? "★"
                        : "☆";
            }

            return stars;
        }

        function getInitials(name) {
            var parts = String(name || "")
                .trim()
                .split(/\s+/)
                .filter(Boolean);

            if (!parts.length) {
                return "CL";
            }

            if (parts.length === 1) {
                return parts[0]
                    .substring(0, 2)
                    .toUpperCase();
            }

            return (
                parts[0].charAt(0) +
                parts[parts.length - 1].charAt(0)
            ).toUpperCase();
        }

        function getAvatarColor(name) {
            return AVATAR_COLORS[
                hashString(name) %
                AVATAR_COLORS.length
            ];
        }

        function getStableProductData() {
            var productKey = getProductKey();

            var storageKey =
                CONFIG.storagePrefix +
                hashString(productKey);

            try {
                var saved = localStorage.getItem(
                    storageKey
                );

                if (saved) {
                    var parsed = JSON.parse(saved);

                    if (
                        parsed &&
                        Number.isFinite(
                            Number(parsed.count)
                        )
                    ) {
                        return {
                            productKey: productKey,
                            count: Number(parsed.count),
                            average: CONFIG.fixedAverage,
                            reviewOffset:
                                Number(parsed.reviewOffset) || 0
                        };
                    }
                }
            } catch (error) {
                /* Continua com valores calculados pelo slug. */
            }

            var productHash = hashString(
                productKey
            );

            var countInterval =
                CONFIG.maxCount -
                CONFIG.minCount +
                1;

            var data = {
                productKey: productKey,

                count:
                    CONFIG.minCount +
                    (
                        productHash %
                        countInterval
                    ),

                average: CONFIG.fixedAverage,

                reviewOffset:
                    productHash %
                    REVIEWS.length
            };

            try {
                localStorage.setItem(
                    storageKey,
                    JSON.stringify(data)
                );
            } catch (error) {
                /* LocalStorage bloqueado. */
            }

            return data;
        }

        function getOrderedReviews(offset) {
            var ordered = [];

            for (
                var index = 0;
                index < REVIEWS.length;
                index++
            ) {
                ordered.push(
                    REVIEWS[
                    (index + offset) %
                    REVIEWS.length
                    ]
                );
            }

            return ordered;
        }

        function getVisibleElement(selector) {
            var elements =
                document.querySelectorAll(selector);

            for (
                var index = 0;
                index < elements.length;
                index++
            ) {
                var element = elements[index];

                if (
                    element.closest(
                        ".etraction-ropek-reviews"
                    )
                ) {
                    continue;
                }

                var rect =
                    element.getBoundingClientRect();

                if (
                    element.offsetParent !== null ||
                    rect.width > 0 ||
                    rect.height > 0
                ) {
                    return element;
                }
            }

            return elements.length
                ? elements[0]
                : null;
        }

        function getInsertTarget() {
            return getVisibleElement(
                CONFIG.insertAfterSelector
            );
        }

        function getReviewTrigger() {
            return getVisibleElement(
                CONFIG.triggerSelector
            );
        }

        function createCheckIcon() {
            return (
                '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
                '<path ' +
                'd="M20 6L9 17L4 12" ' +
                'stroke="currentColor" ' +
                'stroke-width="2.2" ' +
                'stroke-linecap="round" ' +
                'stroke-linejoin="round">' +
                "</path>" +
                "</svg>"
            );
        }

        function createArrowIcon(direction) {
            var path =
                direction === "prev"
                    ? "M15 18L9 12L15 6"
                    : "M9 18L15 12L9 6";

            return (
                '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
                '<path ' +
                'd="' + path + '" ' +
                'stroke="currentColor" ' +
                'stroke-width="2" ' +
                'stroke-linecap="round" ' +
                'stroke-linejoin="round">' +
                "</path>" +
                "</svg>"
            );
        }

        function createReviewCard(review) {
            var avatarColor =
                getAvatarColor(review.name);

            return (
                '<article class="etraction-ropek-reviews__card">' +

                '<div class="etraction-ropek-reviews__card-header">' +

                '<div class="etraction-ropek-reviews__identity">' +

                '<span ' +
                'class="etraction-ropek-reviews__avatar" ' +
                'aria-hidden="true" ' +
                'style="' +
                "--etraction-avatar-bg:" +
                avatarColor.background +
                ";" +
                "--etraction-avatar-color:" +
                avatarColor.text +
                ";" +
                '">' +

                escapeHtml(
                    getInitials(review.name)
                ) +

                "</span>" +

                '<div class="etraction-ropek-reviews__customer">' +

                '<span class="etraction-ropek-reviews__name">' +
                escapeHtml(review.name) +
                "</span>" +

                '<span class="etraction-ropek-reviews__date">' +
                escapeHtml(review.date) +
                "</span>" +

                "</div>" +

                "</div>" +

                '<span ' +
                'class="etraction-ropek-reviews__card-stars" ' +
                'aria-label="' +
                review.rating +
                ' de 5 estrelas">' +

                createStars(review.rating) +

                "</span>" +

                "</div>" +

                '<p class="etraction-ropek-reviews__text">' +
                escapeHtml(review.text) +
                "</p>" +

                '<span class="etraction-ropek-reviews__badge">' +

                createCheckIcon() +

                "Avaliação de cliente" +

                "</span>" +

                "</article>"
            );
        }

        function updateOriginalReviewArea(
            reviewArea,
            data
        ) {
            if (!reviewArea) {
                return;
            }

            reviewArea.classList.add(
                "etraction-ropek-reviews-trigger"
            );

            reviewArea.setAttribute(
                "role",
                "button"
            );

            reviewArea.setAttribute(
                "tabindex",
                "0"
            );

            reviewArea.setAttribute(
                "title",
                "Ver avaliações de clientes"
            );

            var countElement =
                reviewArea.querySelector(
                    ".num-avaliacao .avaliacoes-link"
                ) ||
                reviewArea.querySelector(
                    ".num-avaliacao"
                );

            var countText =
                "mais de " +
                formatCount(data.count) +
                " avaliações";

            if (
                countElement &&
                countElement.textContent.trim() !==
                countText
            ) {
                countElement.textContent =
                    countText;
            }

            var makeReviewLink =
                reviewArea.querySelector(
                    ".faca-avaliacao"
                );

            if (makeReviewLink) {
                makeReviewLink.style.setProperty(
                    "display",
                    "none",
                    "important"
                );
            }

            var averageRating =
                reviewArea.querySelector(
                    ".average-rating"
                );

            if (averageRating) {
                var percentage =
                    (
                        CONFIG.fixedAverage / 5
                    ) * 100;

                averageRating.setAttribute(
                    "data-value",
                    CONFIG.fixedAverage.toFixed(2)
                );

                averageRating.setAttribute(
                    "title",
                    CONFIG.fixedAverage
                        .toFixed(1)
                        .replace(".", ",") +
                    " de 5"
                );

                averageRating.style.setProperty(
                    "--percent",
                    percentage.toFixed(2) + "%"
                );
            }
        }

        function scrollToReviews() {
            var carousel =
                document.getElementById(
                    CONFIG.carouselId
                );

            if (!carousel) {
                applyReviews();

                window.setTimeout(
                    scrollToReviews,
                    150
                );

                return;
            }

            var offset =
                window.innerWidth <= 600
                    ? CONFIG.mobileScrollOffset
                    : CONFIG.desktopScrollOffset;

            var destination =
                carousel.getBoundingClientRect().top +
                window.pageYOffset -
                offset;

            window.scrollTo({
                top: Math.max(
                    0,
                    destination
                ),
                behavior: "smooth"
            });
        }

        function bindTrigger(reviewArea) {
            if (!reviewArea) {
                return;
            }

            if (
                reviewArea.getAttribute(
                    "data-etraction-review-click"
                ) === "true"
            ) {
                return;
            }

            reviewArea.setAttribute(
                "data-etraction-review-click",
                "true"
            );

            reviewArea.addEventListener(
                "click",
                function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();

                    scrollToReviews();
                },
                true
            );

            reviewArea.addEventListener(
                "keydown",
                function (event) {
                    if (
                        event.key !== "Enter" &&
                        event.key !== " "
                    ) {
                        return;
                    }

                    event.preventDefault();

                    scrollToReviews();
                }
            );
        }

        function createCarousel(
            insertTarget,
            data
        ) {
            if (
                !insertTarget ||
                !insertTarget.parentNode
            ) {
                return null;
            }

            var existing =
                document.getElementById(
                    CONFIG.carouselId
                );

            if (existing) {
                existing.remove();
            }

            var orderedReviews =
                getOrderedReviews(
                    data.reviewOffset
                );

            var section =
                document.createElement(
                    "section"
                );

            section.id =
                CONFIG.carouselId;

            section.className =
                "etraction-ropek-reviews";

            section.setAttribute(
                "data-product-key",
                data.productKey
            );

            section.setAttribute(
                "aria-label",
                "Avaliações de clientes da Ropek"
            );

            section.innerHTML =
                '<div class="etraction-ropek-reviews__header">' +

                '<div class="etraction-ropek-reviews__heading">' +

                '<h2 class="etraction-ropek-reviews__title">' +
                "Quem já comprou na Ropek, recomenda" +
                "</h2>" +

                '<p class="etraction-ropek-reviews__subtitle">' +
                "Confira algumas experiências compartilhadas por nossos clientes." +
                "</p>" +

                "</div>" +

                '<div class="etraction-ropek-reviews__summary">' +

                '<strong class="etraction-ropek-reviews__average">' +
                CONFIG.fixedAverage
                    .toFixed(1)
                    .replace(".", ",") +
                "</strong>" +

                '<div class="etraction-ropek-reviews__summary-info">' +

                '<div class="etraction-ropek-reviews__stars">' +
                createStars(
                    CONFIG.fixedAverage
                ) +
                "</div>" +

                '<span class="etraction-ropek-reviews__count">' +
                "mais de " +
                formatCount(data.count) +
                " avaliações" +
                "</span>" +

                "</div>" +

                "</div>" +

                "</div>" +

                '<div class="etraction-ropek-reviews__viewport">' +

                '<div ' +
                'class="' +
                "etraction-ropek-reviews__arrow " +
                "etraction-ropek-reviews__arrow--prev " +
                "is-hidden" +
                '" ' +
                'role="button" ' +
                'tabindex="0" ' +
                'aria-label="Avaliação anterior">' +

                createArrowIcon("prev") +

                "</div>" +

                '<div class="etraction-ropek-reviews__track">' +

                orderedReviews
                    .map(createReviewCard)
                    .join("") +

                "</div>" +

                '<div ' +
                'class="' +
                "etraction-ropek-reviews__arrow " +
                "etraction-ropek-reviews__arrow--next" +
                '" ' +
                'role="button" ' +
                'tabindex="0" ' +
                'aria-label="Próxima avaliação">' +

                createArrowIcon("next") +

                "</div>" +

                "</div>";

            insertTarget.insertAdjacentElement(
                "afterend",
                section
            );

            setupCarousel(section);

            return section;
        }

        function getScrollDistance(track) {
            var card =
                track.querySelector(
                    ".etraction-ropek-reviews__card"
                );

            if (!card) {
                return track.clientWidth;
            }

            var styles =
                window.getComputedStyle(track);

            var gap = parseFloat(
                styles.columnGap ||
                styles.gap ||
                "0"
            );

            return (
                card.getBoundingClientRect().width +
                gap
            );
        }

        function updateArrows(section) {
            var track =
                section.querySelector(
                    ".etraction-ropek-reviews__track"
                );

            var previous =
                section.querySelector(
                    ".etraction-ropek-reviews__arrow--prev"
                );

            var next =
                section.querySelector(
                    ".etraction-ropek-reviews__arrow--next"
                );

            if (
                !track ||
                !previous ||
                !next
            ) {
                return;
            }

            var maximum =
                track.scrollWidth -
                track.clientWidth;

            var tolerance = 5;

            previous.classList.toggle(
                "is-hidden",
                track.scrollLeft <= tolerance
            );

            next.classList.toggle(
                "is-hidden",
                maximum <= 0 ||
                track.scrollLeft >=
                maximum - tolerance
            );
        }

        function scrollCarousel(
            section,
            direction
        ) {
            var track =
                section.querySelector(
                    ".etraction-ropek-reviews__track"
                );

            if (!track) {
                return;
            }

            track.scrollBy({
                left:
                    direction *
                    getScrollDistance(track),

                behavior: "smooth"
            });
        }

        function stopAutoplay() {
            if (autoplayTimer) {
                clearInterval(
                    autoplayTimer
                );

                autoplayTimer = null;
            }

            if (restartTimer) {
                clearTimeout(
                    restartTimer
                );

                restartTimer = null;
            }
        }

        function startAutoplay(section) {
            stopAutoplay();

            if (!CONFIG.autoplay) {
                return;
            }

            var track =
                section.querySelector(
                    ".etraction-ropek-reviews__track"
                );

            if (
                !track ||
                track.scrollWidth <=
                track.clientWidth
            ) {
                return;
            }

            autoplayTimer =
                window.setInterval(
                    function () {
                        if (
                            !document.body.contains(
                                section
                            )
                        ) {
                            stopAutoplay();
                            return;
                        }

                        var maximum =
                            track.scrollWidth -
                            track.clientWidth;

                        if (
                            track.scrollLeft >=
                            maximum - 5
                        ) {
                            track.scrollTo({
                                left: 0,
                                behavior: "smooth"
                            });
                        } else {
                            scrollCarousel(
                                section,
                                1
                            );
                        }
                    },
                    CONFIG.autoplayDelay
                );
        }

        function restartAutoplay(section) {
            stopAutoplay();

            restartTimer =
                window.setTimeout(
                    function () {
                        startAutoplay(section);
                    },
                    4000
                );
        }

        function handleArrowKeyboard(
            event,
            callback
        ) {
            if (
                event.key !== "Enter" &&
                event.key !== " "
            ) {
                return;
            }

            event.preventDefault();

            callback();
        }

        function setupCarousel(section) {
            var track =
                section.querySelector(
                    ".etraction-ropek-reviews__track"
                );

            var previous =
                section.querySelector(
                    ".etraction-ropek-reviews__arrow--prev"
                );

            var next =
                section.querySelector(
                    ".etraction-ropek-reviews__arrow--next"
                );

            if (
                !track ||
                !previous ||
                !next
            ) {
                return;
            }

            previous.addEventListener(
                "click",
                function () {
                    scrollCarousel(
                        section,
                        -1
                    );
                }
            );

            next.addEventListener(
                "click",
                function () {
                    scrollCarousel(
                        section,
                        1
                    );
                }
            );

            previous.addEventListener(
                "keydown",
                function (event) {
                    handleArrowKeyboard(
                        event,
                        function () {
                            scrollCarousel(
                                section,
                                -1
                            );
                        }
                    );
                }
            );

            next.addEventListener(
                "keydown",
                function (event) {
                    handleArrowKeyboard(
                        event,
                        function () {
                            scrollCarousel(
                                section,
                                1
                            );
                        }
                    );
                }
            );

            track.addEventListener(
                "scroll",
                function () {
                    window.requestAnimationFrame(
                        function () {
                            updateArrows(section);
                        }
                    );
                },
                {
                    passive: true
                }
            );

            track.addEventListener(
                "pointerdown",
                stopAutoplay,
                {
                    passive: true
                }
            );

            track.addEventListener(
                "pointerup",
                function () {
                    restartAutoplay(section);
                },
                {
                    passive: true
                }
            );

            section.addEventListener(
                "mouseenter",
                stopAutoplay
            );

            section.addEventListener(
                "mouseleave",
                function () {
                    startAutoplay(section);
                }
            );

            window.requestAnimationFrame(
                function () {
                    updateArrows(section);
                    startAutoplay(section);
                }
            );
        }

        function applyReviews() {
            var insertTarget =
                getInsertTarget();

            var reviewTrigger =
                getReviewTrigger();

            if (
                !insertTarget ||
                !reviewTrigger
            ) {
                return;
            }

            var data =
                getStableProductData();

            updateOriginalReviewArea(
                reviewTrigger,
                data
            );

            bindTrigger(
                reviewTrigger
            );

            var existing =
                document.getElementById(
                    CONFIG.carouselId
                );

            if (
                existing &&
                existing.getAttribute(
                    "data-product-key"
                ) === data.productKey &&
                existing.previousElementSibling ===
                insertTarget
            ) {
                return;
            }

            stopAutoplay();

            createCarousel(
                insertTarget,
                data
            );
        }

        function scheduleApply() {
            clearTimeout(
                mutationTimer
            );

            mutationTimer =
                window.setTimeout(
                    applyReviews,
                    180
                );
        }

        function observePage() {
            var observer =
                new MutationObserver(
                    function () {
                        if (
                            window.location.href !==
                            currentUrl
                        ) {
                            currentUrl =
                                window.location.href;

                            stopAutoplay();

                            var existing =
                                document.getElementById(
                                    CONFIG.carouselId
                                );

                            if (existing) {
                                existing.remove();
                            }
                        }

                        scheduleApply();
                    }
                );

            observer.observe(
                document.documentElement,
                {
                    childList: true,
                    subtree: true
                }
            );
        }

        function initialize() {
            applyReviews();
            observePage();

            var attempts = 0;

            var initialInterval =
                window.setInterval(
                    function () {
                        attempts++;

                        applyReviews();

                        if (
                            attempts >= 20 ||
                            (
                                getInsertTarget() &&
                                getReviewTrigger() &&
                                document.getElementById(
                                    CONFIG.carouselId
                                )
                            )
                        ) {
                            clearInterval(
                                initialInterval
                            );
                        }
                    },
                    500
                );
        }

        if (
            document.readyState ===
            "loading"
        ) {
            document.addEventListener(
                "DOMContentLoaded",
                initialize
            );
        } else {
            initialize();
        }
    })();
</script>

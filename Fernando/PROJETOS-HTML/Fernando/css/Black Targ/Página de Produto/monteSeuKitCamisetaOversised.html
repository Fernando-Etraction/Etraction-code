                .replace(/&/g, '&amp;')

                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')

        function loadStoredSelections() {
            var selections = new Map();
            try {
                var raw = window.localStorage.getItem(SELECTION_STORAGE_KEY);
                if (!raw) return selections;

                var stored = JSON.parse(raw);
                var savedAt = Number(stored && stored.savedAt || 0);
                var items = stored && Array.isArray(stored.items) ? stored.items : [];
                if (!savedAt || Date.now() - savedAt > SELECTION_STORAGE_TTL) {
                    window.localStorage.removeItem(SELECTION_STORAGE_KEY);
                    return selections;
                }

                items.forEach(function (item) {
                    var id = String(item && item.id || '').trim();
                    var code = String(item && item.code || '').trim();
                    var sizeName = normalizeSize(item && item.sizeName);
                    if (!id || !code || !sizeName) return;

                    selections.set(id, {
                        productId: String(item.productId || id),
                        parentCode: String(item.parentCode || ''),
                        name: String(item.name || ''),
                        image: String(item.image || ''),
                        url: String(item.url || ''),
                        code: code,
                        derivationId: String(item.derivationId || ''),
                        sizeName: sizeName,
                        deposit: String(item.deposit || '1')
                    });
                });
            } catch (error) {
                try { window.localStorage.removeItem(SELECTION_STORAGE_KEY); } catch (storageError) { }
            }
            return selections;
        }

        function persistSelections() {

                var items = [];

                    items.push({
                        id: String(id),
                        productId: String(selection.productId || id),
                        parentCode: String(selection.parentCode || ''),

                        derivationId: String(selection.derivationId || ''),
                        sizeName: normalizeSize(selection.sizeName),
                        deposit: String(selection.deposit || '1')
                    });
                });

                window.localStorage.setItem(SELECTION_STORAGE_KEY, JSON.stringify({
                    savedAt: Date.now(),
                    items: items
                }));
            } catch (error) {
                /* A seleção continua funcionando durante a página atual. */

        function hasStock(value) {
            if (typeof value === 'boolean') return value;
            if (typeof value === 'number') return value > 0;
            var normalized = String(value == null ? '' : value).trim().toLowerCase();
            if (!normalized) return false;
            if (/^-?\d+(?:[.,]\d+)?$/.test(normalized)) {
                return Number(normalized.replace(',', '.')) > 0;
            }
            return ['0', 'false', 'nao', 'não', 'indisponivel', 'indisponível', 'sem estoque']
                .indexOf(normalized) === -1;
        }

        function normalizePath(value) {
            try {
                var path = new URL(value || '/', window.location.href).pathname;
                return (path.replace(/\/+$/, '') || '/').toLowerCase();
            } catch (error) {
                return String(value || '/').split('?')[0].replace(/\/+$/, '').toLowerCase() || '/';
            }
        }

        function absoluteProductUrl(value) {
            try {
                return new URL(value, CATEGORY_URL).href;
            } catch (error) {
                return String(value || CATEGORY_URL);
            }
        }

        function extractJsonValue(source, openIndex) {
            var open = source.charAt(openIndex);
            var close = open === '[' ? ']' : '}';
            var depth = 0;
            var inString = false;
            var escaped = false;

            for (var i = openIndex; i < source.length; i++) {
                var character = source.charAt(i);
                if (inString) {
                    if (escaped) {
                        escaped = false;
                    } else if (character === '\\') {
                        escaped = true;
                    } else if (character === '"') {
                        inString = false;
                    }
                    continue;
                }
                if (character === '"') {
                    inString = true;
                } else if (character === open) {
                    depth += 1;
                } else if (character === close) {
                    depth -= 1;
                    if (depth === 0) return source.slice(openIndex, i + 1);
                }
            }
            throw new Error('JSON incorporado incompleto.');
        }

        function parseCatalogHtml(html) {
            var parsedDocument = new DOMParser().parseFromString(html, 'text/html');
            var scripts = parsedDocument.querySelectorAll('script');
            var largestList = [];

            for (var i = 0; i < scripts.length; i++) {
                var source = scripts[i].textContent || '';
                if (source.indexOf('dataVitrine') === -1) continue;
                var match = /\bitens\s*:\s*/.exec(source);
                if (!match) continue;

                try {
                    var openIndex = source.indexOf('[', match.index + match[0].length);
                    var items = JSON.parse(extractJsonValue(source, openIndex));
                    if (Array.isArray(items) && items.length > largestList.length) largestList = items;
                } catch (error) {
                    /* Tenta a próxima vitrine incorporada. */
                }
            }
            if (!largestList.length) throw new Error('Nenhum produto encontrado na categoria.');
            return largestList;
        }

        function parseProductHtml(html) {
            var markerIndex = html.indexOf('const dataProduct');
            if (markerIndex === -1) markerIndex = html.indexOf('var dataProduct');
            if (markerIndex === -1) throw new Error('Dados do produto não encontrados.');

            var source = html.slice(markerIndex);
            var match = /\bproduto\s*:\s*/.exec(source);
            if (!match) throw new Error('Produto não encontrado nos dados da página.');
            var openIndex = source.indexOf('{', match.index + match[0].length);
            return JSON.parse(extractJsonValue(source, openIndex));
        }

        function catalogSizes(item) {
            var groups = Array.isArray(item.derivacoesItem) ? item.derivacoesItem : [];
            var sizes = [];
            var used = {};

            groups.forEach(function (group) {
                (Array.isArray(group) ? group : []).forEach(function (size) {
                    var name = String(size.derivacao || '').trim();
                    var key = normalizeSize(name);
                    if (!name || used[key]) return;
                    used[key] = true;
                    sizes.push({
                        name: name,
                        itemId: String(size.iteder_id || ''),
                        derivationId: '',
                        code: '',
                        inStock: hasStock(size.estoque)
                    });
                });
            });
            return sizes;
        }

        function productFromCatalog(item, index) {

                id: String(item.derivacao_id || item.codigo || ('catalog-' + index)),
                parentCode: String(item.codigo || ''),

                image: String(item.midia_url || ''),
                url: String(item.link || ''),

        function cloneFallbackProduct(product) {
            return {
                id: product.id,

                productId: product.productId,
                name: product.name,

        function initialProducts() {

        function mergeFallbackDetails(product) {
            var fallback = FALLBACK_PRODUCTS.find(function (item) {
                return item.parentCode === product.parentCode ||
                    normalizePath(item.url) === normalizePath(product.url);
            });
            if (!fallback) return product;

            product.productId = fallback.productId;
            product.sizes = product.sizes.map(function (catalogSize) {
                var savedSize = findSize(fallback, catalogSize.name);
                return {
                    name: catalogSize.name,
                    derivationId: savedSize ? savedSize.derivationId : '',
                    code: savedSize ? savedSize.code : '',
                    inStock: catalogSize.inStock
                };
            });
            product.detailsLoaded = product.sizes.every(function (size) {
                return !size.inStock || Boolean(size.code);
            });
            return product;
        }

        function createRequestOptions() {
            var options = { credentials: 'same-origin', cache: 'no-store' };
            if (window.AbortController) {
                var controller = new AbortController();
                requestControllers.push(controller);
                options.signal = controller.signal;
            }
            return options;

        function loadCatalog(force) {
            if (state.catalogLoaded && !force) return Promise.resolve(state.products);
            if (state.catalogPromise && !force) return state.catalogPromise;

            state.catalogLoading = true;
            state.catalogError = '';
            renderProducts();

            state.catalogPromise = fetch(CATEGORY_URL, createRequestOptions())
                .then(function (response) {
                    if (!response.ok) throw new Error('Categoria indisponível: ' + response.status);
                    return response.text();
                })
                .then(function (html) {
                    var products = parseCatalogHtml(html)
                        .map(productFromCatalog)
                        .map(mergeFallbackDetails)
                        .filter(function (product) {
                            return Boolean(product.url);
                        });

                    if (!products.length) throw new Error('A categoria não retornou camisetas.');
                    state.products = products;
                    state.catalogLoaded = true;

                    var validProducts = {};
                    products.forEach(function (product) { validProducts[product.id] = product; });
                    var selectionChanged = false;
                    var remappedSelections = [];
                    state.selected.forEach(function (selection, productId) {
                        var product = validProducts[productId] || products.find(function (candidate) {
                            return Boolean(
                                selection.parentCode && candidate.parentCode === selection.parentCode ||
                                selection.url && normalizePath(candidate.url) === normalizePath(selection.url)
                            );
                        });
                        if (product && !productHasSize(product, selection.sizeName)) {
                            state.selected.delete(productId);
                            selectionChanged = true;
                            return;
                        }
                        if (product && product.id !== productId) {
                            remappedSelections.push({
                                oldId: productId,
                                newId: product.id,
                                selection: Object.assign({}, selection, {
                                    productId: product.productId || selection.productId,
                                    parentCode: product.parentCode || selection.parentCode,
                                    name: product.name || selection.name,
                                    image: product.image || selection.image,
                                    url: product.url || selection.url,
                                    deposit: product.deposit || selection.deposit
                                })
                            });
                        }
                    });
                    remappedSelections.forEach(function (item) {
                        state.selected.delete(item.oldId);
                        state.selected.set(item.newId, item.selection);
                        selectionChanged = true;
                    });
                    if (selectionChanged) persistSelections();
                    return products;
                })
                .catch(function (error) {
                    if (error && error.name === 'AbortError') return [];
                    state.catalogError = 'Não foi possível carregar as camisetas da categoria.';
                    state.catalogPromise = null;
                    console.error('[eTraction] Erro ao carregar catálogo Oversized:', error);
                    return [];
                })
                .then(function (products) {
                    state.catalogLoading = false;
                    if (!destroyed) {
                        renderProducts();
                        updateUI();
                    }
                    return products;
                });

            return state.catalogPromise;
        }

        function sizesFromProductData(productData) {
            var derivations = Array.isArray(productData.derivacoes) ? productData.derivacoes : [];
            return derivations.map(function (size) {
                return {
                    name: String(size.derivacao_nome || size.iteder_nome || ''),

        function loadProductDetails(product) {
            if (product.detailsLoaded) return Promise.resolve(product);
            if (product.detailsPromise) return product.detailsPromise;

            product.detailsLoading = true;
            product.detailsError = '';
            renderProducts();
            updateUI();

            product.detailsPromise = fetch(new URL(product.url, CATEGORY_URL).href, createRequestOptions())
                .then(function (response) {
                    if (!response.ok) throw new Error('Produto indisponível: ' + response.status);
                    return response.text();
                })
                .then(parseProductHtml)
                .then(function (productData) {
                    var sizes = sizesFromProductData(productData);
                    if (!sizes.length) throw new Error('Nenhum SKU de tamanho foi encontrado.');
                    product.sizes = sizes;

                    product.parentCode = String(productData.codigo || product.parentCode);

                .catch(function (error) {

                    console.error('[eTraction] Erro ao carregar produto Oversized:', error);

                })
                .then(function (result) {
                    product.detailsLoading = false;
                    product.detailsPromise = null;
                    if (!destroyed) {
                        renderProducts();

                    product.detailsLoading = false;

        function readCurrentPageData() {
            if (state.currentPageDataRead && state.currentPageData) return state.currentPageData;
            var scripts = document.querySelectorAll('script');
            for (var i = 0; i < scripts.length; i++) {
                var source = scripts[i].textContent || '';
                if (source.indexOf('dataProduct') === -1) continue;
                try {
                    state.currentPageData = parseProductHtml(source);
                    break;
                } catch (error) {
                    /* Continua procurando o bloco principal do produto. */
                }
            }
            state.currentPageDataRead = true;
            return state.currentPageData;

        function findSize(product, sizeName) {
            var normalized = normalizeSize(sizeName);
            var sizes = product && Array.isArray(product.sizes) ? product.sizes : [];
            for (var i = 0; i < sizes.length; i++) {
                if (normalizeSize(sizes[i].name) === normalized) return sizes[i];
            }
            return null;
        }

        function tierFor(count) {
            if (count >= BEST_TIER_START) {
                return {
                    each: 87,
                    label: 'R$87 cada',
                    message: 'Melhor oferta desbloqueada: R$87 cada + frete grátis',
                    benefit: 'R$87 por camiseta + frete grátis'
                };
            }
            if (count === 3) {
                return {
                    each: 99,
                    label: 'R$99 cada',
                    message: 'Adicione mais 1 e pague R$87 cada + frete grátis',
                    benefit: 'R$99 por camiseta'
                };
            }
            if (count === 2) {
                return {
                    each: 109,
                    label: 'R$109 cada',
                    message: 'Adicione mais 1 e reduza para R$99 cada',
                    benefit: 'R$109 por camiseta'
                };
            }
            return {
                each: BASE_PRICE,
                label: 'Adicione mais 1',
                message: 'Adicione mais 1 camiseta e pague R$109 em cada',
                benefit: 'Escolha mais 1 peça'
            };
        }

        function currentProduct() {
            var selectedSize = document.querySelector(
                '#pagina-produto-react-app .variacao-lista [data-derivacao-item-name].selected, ' +
                '#pagina-produto-react-app .variacao-lista [data-derivacao-item-name][aria-selected="true"], ' +
                '#pagina-produto-react-app .variacao-lista [data-derivacao-item-name][data-state="checked"]'
            );
            var hiddenSize = document.getElementById('prod-nome-derivacao');
            var sizeName = selectedSize && selectedSize.dataset
                ? selectedSize.dataset.derivacaoItemName
                : '';

            if (!sizeName && hiddenSize) sizeName = hiddenSize.value;
            if (!sizeName && selectedSize) {
                var label = selectedSize.querySelector('.variacao-label');
                sizeName = label ? label.textContent : selectedSize.textContent;
            }

            sizeName = normalizeSize(sizeName);
            var hiddenCode = document.getElementById('prod-codigo');
            var hiddenName = document.getElementById('prod-nome');
            var hiddenDeposit = document.getElementById('prod-deposito');
            var pageData = readCurrentPageData();
            var pageSizes = pageData ? sizesFromProductData(pageData) : [];
            var size = findSize({ sizes: pageSizes }, sizeName);
            var parentCode = pageData
                ? String(pageData.codigo || '')
                : String(hiddenCode && hiddenCode.value || '');
            var code = size ? size.code : String(hiddenCode && hiddenCode.value || '').trim();
            var hasContext = Boolean(hiddenCode || hiddenName || pageData);

            if (code === parentCode && !size) code = '';
            state.currentParentCode = parentCode;

            return {
                id: String(pageData && pageData.produto_id || parentCode || 'produto-atual'),
                parentCode: parentCode,
                url: window.location.href,
                name: String(
                    hiddenName && hiddenName.value ||
                    pageData && (pageData.nome || pageData.titulo) ||
                    'Produto atual da página'
                ),
                sizeName: sizeName,
                derivationId: size ? size.derivationId : '',
                code: code,
                deposit: String(
                    size && size.deposit ||
                    hiddenDeposit && hiddenDeposit.value ||
                    pageData && pageData.deposito ||
                    '1'
                ),
                hasContext: hasContext,
                valid: Boolean(sizeName && code && (!size || size.inStock))
            };
        }

        function isCurrentCatalogProduct(product) {
            if (!product) return false;
            if (
                state.currentParentCode &&
                product.parentCode &&
                String(product.parentCode) === String(state.currentParentCode)
            ) {
                return true;
            }
            return normalizePath(product.url) === normalizePath(window.location.href);
        }

        function isCurrentStoredSelection(selection) {
            if (!selection) return false;
            if (
                state.currentParentCode &&
                selection.parentCode &&
                String(selection.parentCode) === String(state.currentParentCode)
            ) {
                return true;
            }
            return Boolean(
                selection.url &&
                normalizePath(selection.url) === normalizePath(window.location.href)
            );
        }

        function storedCurrentSelection() {
            var result = null;
            state.selected.forEach(function (selection, productId) {
                if (!result && isCurrentStoredSelection(selection)) {
                    result = { productId: productId, selection: selection };
                }
            });
            return result;
        }

        function removeStoredCurrentSelection() {
            var removed = false;
            state.selected.forEach(function (selection, productId) {
                if (isCurrentStoredSelection(selection)) {
                    state.selected.delete(productId);
                    removed = true;
                }
            });
            if (removed) persistSelections();
            return removed;
        }

        function kitState() {
            var current = currentProduct();
            var storedCurrent = storedCurrentSelection();
            var currentChoice = storedCurrent
                ? storedCurrent.selection
                : (current.valid ? current : null);
            var additional = [];

            state.selected.forEach(function (selection, productId) {
                if (storedCurrent && productId === storedCurrent.productId) return;
                if (isCurrentStoredSelection(selection)) return;
                additional.push(selection);
            });

            return {
                current: current,
                currentChoice: currentChoice,
                storedCurrent: storedCurrent,
                additional: additional,
                count: 1 + additional.length
            };
        }

        function saveCurrentPageSelection() {
            var current = currentProduct();
            if (!current.valid) return false;

            var catalogProduct = state.products.find(isCurrentCatalogProduct);
            var productId = String(catalogProduct && catalogProduct.id || current.id);
            state.selected.set(productId, {
                productId: String(catalogProduct && catalogProduct.productId || current.id),
                parentCode: String(catalogProduct && catalogProduct.parentCode || current.parentCode || ''),
                name: String(catalogProduct && catalogProduct.name || current.name || ''),
                image: String(catalogProduct && catalogProduct.image || ''),
                url: String(catalogProduct && catalogProduct.url || current.url || ''),
                code: String(current.code),
                derivationId: String(current.derivationId || ''),
                sizeName: normalizeSize(current.sizeName),
                deposit: String(current.deposit || '1')
            });
            persistSelections();
            return true;
        }

        function availableSizes(product) {
            return (Array.isArray(product.sizes) ? product.sizes : []).filter(function (size) {
                return Boolean(size && size.inStock && normalizeSize(size.name));
            });
        }

        function productHasSize(product, sizeName) {
            var requested = normalizeSize(sizeName);
            return availableSizes(product).some(function (size) {
                return normalizeSize(size.name) === requested;
            });
        }

        function compareSizes(first, second) {
            var firstName = normalizeSize(first);
            var secondName = normalizeSize(second);
            var firstIndex = SIZE_ORDER.indexOf(firstName);
            var secondIndex = SIZE_ORDER.indexOf(secondName);
            var firstRank = firstIndex === -1 ? SIZE_ORDER.length : firstIndex;
            var secondRank = secondIndex === -1 ? SIZE_ORDER.length : secondIndex;
            if (firstRank !== secondRank) return firstRank - secondRank;
            return firstName.localeCompare(secondName, 'pt-BR', { numeric: true });
        }

        function catalogFilterSizes() {
            var unique = {};
            state.products.forEach(function (product) {
                availableSizes(product).forEach(function (size) {
                    unique[normalizeSize(size.name)] = true;
                });
            });
            return Object.keys(unique).sort(compareSizes);
        }

        function renderSizeFilters() {
            var sizes = catalogFilterSizes();
            if (state.sizeFilter && sizes.indexOf(state.sizeFilter) === -1) {
                state.sizeFilter = '';
            }
            filterOptions.innerHTML = [''].concat(sizes).map(function (sizeName) {
                var label = sizeName || 'Todos';
                var isActive = state.sizeFilter === sizeName;
                return (
                    '<button class="etraction-bt-kit-filter' + (isActive ? ' is-active' : '') + '" ' +
                    'type="button" data-size-filter="' + escapeHtml(sizeName) + '" ' +
                    'aria-pressed="' + (isActive ? 'true' : 'false') + '">' +
                    escapeHtml(label) +
                    '</button>'
                );
            }).join('');
        }

        function visibleProducts() {
            return state.products.filter(function (product) {
                if (!availableSizes(product).length) return false;
                if (isCurrentCatalogProduct(product)) return true;
                return !state.sizeFilter || productHasSize(product, state.sizeFilter);
            }).sort(function (first, second) {
                var firstIsCurrent = isCurrentCatalogProduct(first);
                var secondIsCurrent = isCurrentCatalogProduct(second);
                if (firstIsCurrent === secondIsCurrent) return 0;
                return firstIsCurrent ? -1 : 1;
            });
        }

        function renderProducts() {
            var previousScroll = grid.scrollTop;
            renderSizeFilters();

            if (state.catalogLoading && !state.products.length) {
                grid.innerHTML =
                    '<div class="etraction-bt-kit-catalog-status" role="status">' +
                    '<span class="etraction-bt-kit-catalog-status__spinner" aria-hidden="true"></span>' +
                    '<span>Carregando todas as camisetas Oversized...</span>' +
                    '</div>';
                return;
            }
            if (state.catalogError && !state.products.length) {
                grid.innerHTML =
                    '<div class="etraction-bt-kit-catalog-status" role="alert">' +
                    '<span>' + escapeHtml(state.catalogError) + '</span>' +
                    '<button class="etraction-bt-kit-catalog-status__retry" type="button" ' +
                    'data-etraction-bt-kit-retry>Tentar novamente</button>' +
                    '</div>';
                return;
            }
            if (!state.products.length) {
                grid.innerHTML =
                    '<div class="etraction-bt-kit-catalog-status">' +
                    '<span>Abra o montador para carregar as camisetas.</span>' +
                    '</div>';
                return;
            }

            var productsToRender = visibleProducts();
            if (!productsToRender.length) {
                var emptyMessage = state.sizeFilter
                    ? 'Nenhuma camiseta disponível no tamanho ' + state.sizeFilter + '.'
                    : 'Nenhuma camiseta disponível no momento.';
                grid.innerHTML =
                    '<div class="etraction-bt-kit-catalog-status" role="status">' +
                    '<span>' + escapeHtml(emptyMessage) + '</span>' +
                    (state.sizeFilter
                        ? '<button class="etraction-bt-kit-catalog-status__retry" type="button" ' +
                        'data-etraction-bt-kit-clear-filter>Ver todos os tamanhos</button>'
                        : '') +
                    '</div>';
                return;
            }

            grid.innerHTML = productsToRender.map(function (product) {
                var isCurrentProduct = isCurrentCatalogProduct(product);
                var sizesToRender = product.detailsLoading ? [] : availableSizes(product);
                var sizes = sizesToRender.map(function (size) {
                    return (
                        '<button class="etraction-bt-kit-size" ' +
                        'type="button" ' +
                        'data-product="' + escapeHtml(product.id) + '" ' +
                        'data-derivation-id="' + escapeHtml(size.derivationId) + '" ' +
                        'data-code="' + escapeHtml(size.code) + '" ' +
                        'data-size-name="' + escapeHtml(size.name) + '" ' +
                        'aria-label="Selecionar tamanho ' + escapeHtml(size.name) + '">' +
                        escapeHtml(size.name) +
                        '</button>'
                    );
                }).join('');

                var cardState = product.detailsLoading
                    ? 'Carregando tamanhos...'
                    : (product.detailsError || (isCurrentProduct
                        ? 'Produto atual • escolha um tamanho'
                        : 'Escolha um tamanho para incluir'));

                return (
                    '<article class="etraction-bt-kit-card' +
                    (product.detailsLoading ? ' is-loading' : '') +
                    (isCurrentProduct ? ' is-current' : '') +
                    '" data-card="' + escapeHtml(product.id) + '">' +
                    '<div class="etraction-bt-kit-card__image-wrap">' +
                    '<img class="etraction-bt-kit-card__image" ' +
                    'src="' + escapeHtml(product.image) + '" ' +
                    'alt="' + escapeHtml(product.name) + '" ' +
                    'width="420" height="525" loading="lazy">' +
                    '<span class="etraction-bt-kit-card__current-label">Produto atual</span>' +
                    '<span class="etraction-bt-kit-card__check" aria-hidden="true">✓</span>' +
                    '</div>' +
                    '<div class="etraction-bt-kit-card__body">' +
                    '<h3 class="etraction-bt-kit-card__name">' + escapeHtml(product.name) + '</h3>' +
                    '<span class="etraction-bt-kit-card__price">' + escapeHtml(cardState) + '</span>' +
                    '<div class="etraction-bt-kit-card__sizes">' + sizes + '</div>' +
                    '<div class="etraction-bt-kit-card__actions">' +
                    '<a class="etraction-bt-kit-card__view" ' +
                    'href="' + escapeHtml(absoluteProductUrl(product.url)) + '" ' +
                    'data-etraction-bt-kit-view>Veja o produto</a>' +
                    '<button class="etraction-bt-kit-card__add" type="button" ' +
                    'data-etraction-bt-kit-card-add ' +
                    'data-product="' + escapeHtml(product.id) + '" disabled>' +
                    'Adicionar ao carrinho' +
                    '</button>' +
                    '</div>' +
                    '</div>' +
                    '</article>'
                );
            }).join('');
            grid.scrollTop = previousScroll;
        }

        function syncCurrentProduct() {
            var product = currentProduct();
            var stored = storedCurrentSelection();
            var currentChoice = stored ? stored.selection : (product.valid ? product : null);
            document.getElementById('etraction-bt-kit-current-name').textContent = product.name;
            document.getElementById('etraction-bt-kit-current-size').textContent = currentChoice
                ? 'Tamanho ' + currentChoice.sizeName
                : (product.hasContext
                    ? 'Tamanho pendente — escolha antes de adicionar'
                    : 'Prévia do construtor — tamanho escolhido na página do produto');
            if (currentChoice) hideInlineError();
            return product;
        }

        function updateUI() {
            var selectionState = kitState();
            var count = selectionState.count;
            var tier = tierFor(count);
            var total = count * tier.each;

            document.getElementById('etraction-bt-kit-count').textContent =
                count + (count === 1 ? ' peça selecionada' : ' peças selecionadas');
            document.getElementById('etraction-bt-kit-tier').textContent = tier.label;
            document.getElementById('etraction-bt-kit-message').textContent = tier.message;
            document.getElementById('etraction-bt-kit-progress-bar').style.width =
                Math.min((count / BEST_TIER_START) * 100, 100) + '%';
            document.getElementById('etraction-bt-kit-summary-label').textContent =
                'Seu kit: ' + count + (count === 1 ? ' camiseta' : ' camisetas');
            document.getElementById('etraction-bt-kit-total').textContent = money(total);
            document.getElementById('etraction-bt-kit-benefit').textContent = tier.benefit;

            addButton.disabled = state.adding || count < 2;
            addButton.textContent = state.adding
                ? 'Adicionando ao carrinho...'
                : (state.previewMode
                    ? (count < 2
                        ? 'Escolha mais 1 camiseta'
                        : 'Kit com ' + count + ' camisetas selecionado')
                    : (count < 2
                        ? 'Escolha mais 1 camiseta'
                        : 'Adicionar ' + count + ' camisetas ao carrinho'));

            grid.querySelectorAll('.etraction-bt-kit-card').forEach(function (card) {
                var selected = state.selected.get(card.dataset.card);
                var product = state.products.find(function (item) {
                    return item.id === card.dataset.card;
                });
                var price = card.querySelector('.etraction-bt-kit-card__price');
                var cardAddButton = card.querySelector('.etraction-bt-kit-card__add');
                var isCurrentProduct = isCurrentCatalogProduct(product);
                var activeSelection = selected || (
                    isCurrentProduct ? selectionState.currentChoice : null
                );
                card.classList.toggle('is-current', isCurrentProduct);
                card.classList.toggle('is-selected', Boolean(selected) || isCurrentProduct);
                price.textContent = activeSelection
                    ? 'Tamanho ' + activeSelection.sizeName + ' • ' + money(tier.each)
                    : (product && product.detailsLoading
                        ? 'Carregando tamanhos...'
                        : (product && product.detailsError || (isCurrentProduct
                            ? 'Produto atual • escolha um tamanho'
                            : 'Escolha um tamanho para incluir')));

                if (cardAddButton) {
                    cardAddButton.disabled = state.adding || !activeSelection || count < 2;
                    cardAddButton.textContent = state.adding && activeSelection
                        ? 'Adicionando...'
                        : 'Adicionar ao carrinho';
                }

                card.querySelectorAll('.etraction-bt-kit-size').forEach(function (button) {
                    var isSelected = Boolean(
                        activeSelection && (
                            (activeSelection.derivationId && activeSelection.derivationId === button.dataset.derivationId) ||
                            normalizeSize(activeSelection.sizeName) === normalizeSize(button.dataset.sizeName)
                        )
                    );
                    button.classList.toggle('is-selected', isSelected);
                    button.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
                });
            });
        }

        function showInlineError(message) {
            inlineError.textContent = message;
            inlineError.classList.add('is-visible');
        }

        function hideInlineError() {
            inlineError.textContent = '';
            inlineError.classList.remove('is-visible');
        }

        function showProgressFeedback(message) {
            var messageElement = document.getElementById('etraction-bt-kit-message');
            clearTimeout(feedbackTimer);
            messageElement.textContent = message;
            feedbackTimer = setTimeout(function () {
                if (!destroyed) updateUI();
            }, 2800);
        }

        function openModal() {
            var current = syncCurrentProduct();
            state.previewMode = !current.hasContext;
            hideInlineError();
            lastFocused = document.activeElement;
            modal.hidden = false;
            openButton.setAttribute('aria-expanded', 'true');
            document.body.classList.add('etraction-bt-kit-lock');
            renderProducts();
            updateUI();
            loadCatalog(false);

            window.requestAnimationFrame(function () {
                var closeButton = modal.querySelector('.etraction-bt-kit-modal__close');
                if (closeButton) closeButton.focus();
            });
        }

        function closeModal() {
            modal.hidden = true;
            openButton.setAttribute('aria-expanded', 'false');
            document.body.classList.remove('etraction-bt-kit-lock');
            if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
        }

        function setAdding(value) {
            state.adding = value;
            updateUI();
        }

        function addKitToCart() {
            var selectionState = kitState();
            var current = selectionState.current;
            var currentChoice = selectionState.currentChoice;
            var count = selectionState.count;

            state.previewMode = !current.hasContext;
            if (state.previewMode || !current.hasContext) {
                showProgressFeedback('O carrinho fica disponível na página de um produto Oversized.');
                return;
            }
            if (!currentChoice || !currentChoice.code) {
                var currentCard = grid.querySelector('.etraction-bt-kit-card.is-current');
                showProgressFeedback('Escolha o tamanho da camiseta atual para adicionar o kit.');
                if (currentCard) {
                    currentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }
            if (count < 2 || state.adding) return;
            if (!window.Zord || !Zord.checkout || typeof Zord.checkout.addCarts !== 'function') {
                showProgressFeedback('O carrinho ainda está carregando. Tente novamente em instantes.');
                return;
            }

            var items = [{
                codigo: currentChoice.code,
                quantidade: 1,
                deposito: currentChoice.deposit || '1'
            }];
            selectionState.additional.forEach(function (item) {
                items.push({ codigo: item.code, quantidade: 1, deposito: item.deposit });
            });

            setAdding(true);
            clearTimeout(addingTimer);
            addingTimer = setTimeout(function () {
                if (!destroyed && state.adding) {
                    setAdding(false);
                    showProgressFeedback('A adição demorou mais que o esperado. Tente novamente.');
                }
            }, 12000);

            try {
                Zord.checkout.addCarts(
                    items,
                    function () {
                        clearTimeout(addingTimer);
                        skipSelectionPersistence = true;
                        state.selected.clear();
                        clearStoredSelections();
                        window.location.assign('/checkout/cart');
                    },
                    { source: 'Kit Oversized PDP', codigoOrigem: state.currentParentCode }
                );
            } catch (error) {
                clearTimeout(addingTimer);
                setAdding(false);
                showProgressFeedback('Não foi possível adicionar o kit. Tente novamente.');
                console.error('[eTraction] Erro ao adicionar kit Oversized:', error);
            }
        }

        function commitProductSelection(product, size) {
            if (!size || !size.inStock || !size.code) {
                product.detailsError = 'Esse tamanho acabou de ficar indisponível.';
                renderProducts();
                updateUI();
                return;
            }

            product.detailsError = '';
            var oldSelection = state.selected.get(product.id);
            var sameSelection = Boolean(
                oldSelection && oldSelection.code === size.code
            );

            if (sameSelection) {
                state.selected.delete(product.id);
                persistSelections();
                updateUI();
                return;
            }
            state.selected.set(product.id, {
                productId: product.productId || product.id,
                parentCode: product.parentCode || '',
                name: product.name || '',
                image: product.image || '',
                url: product.url || '',
                code: size.code,
                derivationId: size.derivationId,
                sizeName: size.name,
                deposit: product.deposit
            });
            persistSelections();
            updateUI();
        }

        function selectProductSize(product, requestedSize) {
            commitProductSelection(product, findSize(product, requestedSize));
        }

        function selectProductButton(product, button) {
            var code = String(button.dataset.code || '').trim();
            if (!code) return false;
            commitProductSelection(product, {
                name: button.dataset.sizeName,
                derivationId: String(button.dataset.derivationId || ''),
                code: code,
                inStock: !button.disabled
            });
            return true;
        }

        function setSizeFilter(sizeName) {
            state.sizeFilter = normalizeSize(sizeName);
            renderProducts();
            updateUI();
            grid.scrollTop = 0;
        }

        function handleFilterClick(event) {
            var button = event.target.closest('[data-size-filter]');
            if (!button) return;
            setSizeFilter(button.dataset.sizeFilter);
        }

        function handleGridClick(event) {
            var retry = event.target.closest('[data-etraction-bt-kit-retry]');
            if (retry) {
                state.catalogPromise = null;
                loadCatalog(true);
                return;
            }

            var clearFilter = event.target.closest('[data-etraction-bt-kit-clear-filter]');
            if (clearFilter) {
                setSizeFilter('');
                return;
            }

            var viewLink = event.target.closest('[data-etraction-bt-kit-view]');
            if (viewLink) {
                saveCurrentPageSelection();
                persistSelections();
                return;
            }

            var cardAddButton = event.target.closest('[data-etraction-bt-kit-card-add]');
            if (cardAddButton) {
                event.preventDefault();
                event.stopPropagation();
                if (cardAddButton.disabled) return;

                var cardProduct = state.products.find(function (item) {
                    return item.id === cardAddButton.dataset.product;
                });
                var selectedProduct = state.selected.get(cardAddButton.dataset.product);
                if (!selectedProduct && isCurrentCatalogProduct(cardProduct)) {
                    selectedProduct = kitState().currentChoice;
                }
                if (!selectedProduct) {
                    showProgressFeedback('Escolha o tamanho desta camiseta antes de adicionar.');
                    return;
                }
                addKitToCart();
                return;
            }

            var button = event.target.closest('.etraction-bt-kit-size');
            if (!button || button.disabled) return;
            event.preventDefault();
            event.stopPropagation();

            var product = state.products.find(function (item) {
                return item.id === button.dataset.product;
            });
            if (!product) return;
            var requestedSize = button.dataset.sizeName;

            /* O SKU do snapshot permite selecionar imediatamente, inclusive no construtor. */
            if (selectProductButton(product, button)) return;
            if (product.detailsLoaded) {
                selectProductSize(product, requestedSize);
                return;
            }
            loadProductDetails(product).then(function () {
                if (!destroyed) selectProductSize(product, requestedSize);
            }).catch(function (error) {
                if (!error || error.name !== 'AbortError') {
                    showProgressFeedback('Não foi possível validar esse produto. Tente novamente.');
                }
            });
        }

        function handleDocumentClick(event) {
            if (event.target.closest('#pagina-produto-react-app .variacao-lista')) {
                setTimeout(function () {
                    currentProduct();
                    removeStoredCurrentSelection();
                    syncCurrentProduct();
                    updateUI();
                }, 50);
            }
        }

        function handleDocumentKeydown(event) {
            if (modal.hidden) return;
            if (event.key === 'Escape') {
                closeModal();
                return;
            }
            if (event.key !== 'Tab') return;

            var focusable = modal.querySelectorAll(
                'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), ' +
                'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
            );
            if (!focusable.length) return;

            var first = focusable[0];
            var last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        }

        function mountTrigger() {
            if (destroyed) return false;
            var app = document.getElementById('pagina-produto-react-app');
            var buyArea = app && (
                app.querySelector('.quantidade-comprar.area-comprar') ||
                app.querySelector('#area-comprar') ||
                app.querySelector('.area-buy-product')
            );
            if (!app || !buyArea || !buyArea.parentNode) return false;

            if (root.parentNode !== buyArea.parentNode || root.nextSibling !== buyArea) {
                buyArea.parentNode.insertBefore(root, buyArea);
            }
            if (modal.parentNode !== document.body) document.body.appendChild(modal);
            state.mounted = true;

            if (!observer) {
                observer = new MutationObserver(function () {
                    if (mountScheduled) return;
                    mountScheduled = true;
                    window.requestAnimationFrame(function () {
                        mountScheduled = false;
                        if (!destroyed) mountTrigger();
                    });
                });
                observer.observe(app, { childList: true, subtree: true });
            }
            return true;
        }

        function waitForMount(attempt) {
            if (destroyed || mountTrigger()) return;
            /* No construtor, mantém o bloco na posição em que foi inserido. */
            if (attempt >= 80) return;
            mountTimer = setTimeout(function () { waitForMount(attempt + 1); }, 250);
        }

        function destroy() {
            destroyed = true;
            clearTimeout(mountTimer);
            clearTimeout(feedbackTimer);
            clearTimeout(addingTimer);
            if (observer) observer.disconnect();
            requestControllers.forEach(function (controller) {
                try { controller.abort(); } catch (error) { /* Requisição já finalizada. */ }
            });

            openButton.removeEventListener('click', openModal);
            addButton.removeEventListener('click', addKitToCart);
            filterOptions.removeEventListener('click', handleFilterClick);
            grid.removeEventListener('click', handleGridClick, true);
            document.removeEventListener('click', handleDocumentClick);
            document.removeEventListener('keydown', handleDocumentKeydown);
            window.removeEventListener('pagehide', handlePageHide);
            modal.querySelectorAll('[data-etraction-bt-kit-close]').forEach(function (button) {
                button.removeEventListener('click', closeModal);
            });

            document.body.classList.remove('etraction-bt-kit-lock');
            if (styleElement) styleElement.remove();
            root.remove();
            modal.remove();
        }

        renderProducts();
        updateUI();
        openButton.addEventListener('click', openModal);
        addButton.addEventListener('click', addKitToCart);
        filterOptions.addEventListener('click', handleFilterClick);
        grid.addEventListener('click', handleGridClick, true);
        document.addEventListener('click', handleDocumentClick);
        document.addEventListener('keydown', handleDocumentKeydown);
        window.addEventListener('pagehide', handlePageHide);
        modal.querySelectorAll('[data-etraction-bt-kit-close]').forEach(function (button) {
            button.addEventListener('click', closeModal);
        });

        waitForMount(0);
        window[GLOBAL_KEY] = {
            destroy: destroy,
            refresh: function () {
                state.currentPageDataRead = false;
                state.currentPageData = null;
                syncCurrentProduct();
                updateUI();
                mountTrigger();
            }
        };
    })();
</script>

<style>
  /* =========================================================
     PRÉ-VENDA — OCULTAR COMPRA E FRETE
  ========================================================= */

  .main-produto.etraction-pre-venda-ativa
    .informacoes-compra-produto
    .quantidade-comprar,
  .main-produto.etraction-pre-venda-ativa
    .informacoes-compra-produto
    .area-comprar,
  .main-produto.etraction-pre-venda-ativa
    .informacoes-compra-produto
    .box-frete,
  .main-produto.etraction-pre-venda-ativa
    .informacoes-compra-produto
    .calculo-frete,
  .main-produto.etraction-pre-venda-ativa
    .informacoes-compra-produto
    button.button-buy,
  .main-produto.etraction-pre-venda-ativa
    .informacoes-compra-produto
    button[name="adicionar"],
  .main-produto.etraction-pre-venda-ativa
    .informacoes-compra-produto
    .quantidade,
  .main-produto.etraction-pre-venda-ativa
    .informacoes-compra-produto
    .stories-fixo[data-position="abaixoCalculoFrete"] {
    display: none !important;
  }

  /* Possíveis botões fixos do mobile */
  .main-produto.etraction-pre-venda-ativa
    .button-buy-fixed,
  .main-produto.etraction-pre-venda-ativa
    .button-buy-float,
  .main-produto.etraction-pre-venda-ativa
    .botao-comprar-fixo,
  .main-produto.etraction-pre-venda-ativa
    .comprar-fixo-mobile,
  .main-produto.etraction-pre-venda-ativa
    [class*="button-buy-fixed"],
  .main-produto.etraction-pre-venda-ativa
    [class*="comprar-fixo"] {
    display: none !important;
  }

  /* =========================================================
     AVISO DE PRÉ-VENDA
  ========================================================= */

  .etraction-aviso-pre-venda {
    display: flex !important;
    align-items: flex-start !important;
    width: 100% !important;
    box-sizing: border-box !important;
    margin-top: 16px !important;
    padding: 18px !important;
    background: #f5f5f5 !important;
    border: 1px solid #dedede !important;
    border-left: 4px solid #111111 !important;
    border-radius: 3px !important;
    color: #111111 !important;
  }

  .etraction-aviso-pre-venda__icone {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 0 0 34px !important;
    width: 34px !important;
    height: 34px !important;
    margin-right: 13px !important;
    border-radius: 50% !important;
    background: #111111 !important;
    color: #ffffff !important;
  }

  .etraction-aviso-pre-venda__icone svg {
    display: block !important;
    width: 18px !important;
    height: 18px !important;
    fill: currentColor !important;
  }

  .etraction-aviso-pre-venda__conteudo {
    flex: 1 !important;
    min-width: 0 !important;
  }

  .etraction-aviso-pre-venda__titulo {
    display: block !important;
    margin: 0 0 5px !important;
    color: #111111 !important;
    font-size: 15px !important;
    font-weight: 700 !important;
    line-height: 1.3 !important;
    letter-spacing: 0.02em !important;
    text-transform: uppercase !important;
  }

  .etraction-aviso-pre-venda__texto {
    display: block !important;
    margin: 0 !important;
    color: #555555 !important;
    font-size: 13px !important;
    font-weight: 400 !important;
    line-height: 1.55 !important;
  }

  @media (max-width: 767px) {
    .etraction-aviso-pre-venda {
      margin-top: 14px !important;
      padding: 15px !important;
    }

    .etraction-aviso-pre-venda__icone {
      flex-basis: 30px !important;
      width: 30px !important;
      height: 30px !important;
      margin-right: 11px !important;
    }

    .etraction-aviso-pre-venda__icone svg {
      width: 16px !important;
      height: 16px !important;
    }

    .etraction-aviso-pre-venda__titulo {
      font-size: 14px !important;
    }

    .etraction-aviso-pre-venda__texto {
      font-size: 12px !important;
    }
  }
</style>

<script>
  (function () {
    "use strict";

    var EtractionPreVenda = {
      observer: null,
      scheduled: false,

      normalizarTexto: function (texto) {
        return String(texto || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim()
          .toLowerCase();
      },

      produtoEhPreVenda: function () {
        var campoCategoria = document.querySelector("#prod-categorias");

        if (!campoCategoria) {
          return false;
        }

        var categoria = this.normalizarTexto(campoCategoria.value);

        return (
          categoria === "pre venda" ||
          categoria.indexOf("pre venda") !== -1
        );
      },

      criarAviso: function () {
        var aviso = document.createElement("div");

        aviso.className = "etraction-aviso-pre-venda";
        aviso.setAttribute("role", "status");

        aviso.innerHTML =
          '<div class="etraction-aviso-pre-venda__icone" aria-hidden="true">' +
            '<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">' +
              '<path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24Zm0 192a88 88 0 1 1 88-88 88.1 88.1 0 0 1-88 88Zm8-88V72a8 8 0 0 0-16 0v56a8 8 0 0 0 3.51 6.62l40 27.08a8 8 0 1 0 8.98-13.24Z"></path>' +
            "</svg>" +
          "</div>" +
          '<div class="etraction-aviso-pre-venda__conteudo">' +
            '<strong class="etraction-aviso-pre-venda__titulo">' +
              "Produto em pré-venda" +
            "</strong>" +
            '<p class="etraction-aviso-pre-venda__texto">' +
              "Este produto ainda não está disponível para compra. " +
              "Em breve, as vendas serão liberadas." +
            "</p>" +
          "</div>";

        return aviso;
      },

      inserirAviso: function (produto) {
        var areaInformacoes = produto.querySelector(
          ".informacoes-compra-produto"
        );

        if (!areaInformacoes) {
          return;
        }

        var avisos = areaInformacoes.querySelectorAll(
          ".etraction-aviso-pre-venda"
        );

        if (avisos.length > 1) {
          for (var i = 1; i < avisos.length; i++) {
            avisos[i].remove();
          }
        }

        if (avisos.length) {
          return;
        }

        var aviso = this.criarAviso();

        var areaCompra = areaInformacoes.querySelector(
          ".quantidade-comprar, .area-comprar"
        );

        var garantia = areaInformacoes.querySelector(".info-garantia");

        var cashback = areaInformacoes.querySelector(".box-fidegg");

        var derivacoes = areaInformacoes.querySelector(".derivacoes-produto");

        if (areaCompra && areaCompra.parentNode) {
          areaCompra.parentNode.insertBefore(aviso, areaCompra);
          return;
        }

        if (garantia) {
          garantia.insertAdjacentElement("afterend", aviso);
          return;
        }

        if (cashback) {
          cashback.insertAdjacentElement("afterend", aviso);
          return;
        }

        if (derivacoes) {
          derivacoes.insertAdjacentElement("afterend", aviso);
          return;
        }

        areaInformacoes.appendChild(aviso);
      },

      aplicar: function () {
        this.scheduled = false;

        var produto = document.querySelector(".main-produto");

        if (!produto || !this.produtoEhPreVenda()) {
          return;
        }

        produto.classList.add("etraction-pre-venda-ativa");

        this.inserirAviso(produto);
      },

      agendarAplicacao: function () {
        var self = this;

        if (this.scheduled) {
          return;
        }

        this.scheduled = true;

        window.requestAnimationFrame(function () {
          self.aplicar();
        });
      },

      observar: function () {
        var self = this;

        if (this.observer || !document.body) {
          return;
        }

        this.observer = new MutationObserver(function () {
          self.agendarAplicacao();
        });

        this.observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      },

      iniciar: function () {
        this.aplicar();
        this.observar();

        window.setTimeout(this.aplicar.bind(this), 300);
        window.setTimeout(this.aplicar.bind(this), 800);
        window.setTimeout(this.aplicar.bind(this), 1500);
      }
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        EtractionPreVenda.iniciar();
      });
    } else {
      EtractionPreVenda.iniciar();
    }
  })();
</script>

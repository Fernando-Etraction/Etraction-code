<script>
(function () {

    "use strict";


    var ID =
        "etraction-dmfit-pdp-coupon";


    function criarCupom() {

        if (
            document.getElementById(ID)
        ) {
            return true;
        }


        var referencia =
            document.querySelector(
                ".info-garantia.mt-space-10.text-xs"
            );


        if (!referencia) {
            return false;
        }


        var bloco =
            document.createElement(
                "div"
            );


        bloco.id = ID;

        bloco.className =
            "etraction-dmfit-pdp-coupon";


        bloco.innerHTML = `
            <div class="etraction-dmfit-pdp-coupon__content">

                <span class="etraction-dmfit-pdp-coupon__label">
                    ANIVERSÁRIO DMFIT
                </span>

                <span class="etraction-dmfit-pdp-coupon__title">
                    Ganhe mais
                    <strong>17% OFF</strong>
                    com o cupom
                </span>

            </div>

            <button
                type="button"
                class="etraction-dmfit-pdp-coupon__button"
                data-etraction-coupon="DM17"
                aria-label="Copiar cupom DM17"
            >
                <strong class="etraction-dmfit-pdp-coupon__code">
                    DM17
                </strong>

                <span class="etraction-dmfit-pdp-coupon__copy">
                    COPIAR
                </span>
            </button>
        `;


        referencia.insertAdjacentElement(
            "afterend",
            bloco
        );


        iniciarCupom(
            bloco
        );


        return true;
    }


    function fallbackCopy(text) {

        var textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.select();


        try {

            document.execCommand(
                "copy"
            );

        } catch (error) {}


        document.body.removeChild(
            textarea
        );
    }


    function iniciarCupom(bloco) {

        var botao =
            bloco.querySelector(
                "[data-etraction-coupon]"
            );


        if (!botao) {
            return;
        }


        botao.addEventListener(
            "click",
            function () {

                var cupom =
                    botao.getAttribute(
                        "data-etraction-coupon"
                    ) || "DM17";


                var copy =
                    botao.querySelector(
                        ".etraction-dmfit-pdp-coupon__copy"
                    );


                function sucesso() {

                    if (!copy) {
                        return;
                    }


                    copy.textContent =
                        "COPIADO";


                    setTimeout(
                        function () {

                            copy.textContent =
                                "COPIAR";

                        },
                        1600
                    );
                }


                if (
                    navigator.clipboard &&
                    navigator.clipboard.writeText
                ) {

                    navigator.clipboard
                        .writeText(
                            cupom
                        )
                        .then(
                            sucesso
                        )
                        .catch(
                            function () {

                                fallbackCopy(
                                    cupom
                                );

                                sucesso();
                            }
                        );

                } else {

                    fallbackCopy(
                        cupom
                    );

                    sucesso();
                }

            }
        );
    }


    function iniciar() {

        if (
            criarCupom()
        ) {
            return;
        }


        var tentativas = 0;


        var intervalo =
            setInterval(
                function () {

                    tentativas++;


                    if (
                        criarCupom() ||
                        tentativas >= 40
                    ) {

                        clearInterval(
                            intervalo
                        );
                    }

                },
                300
            );
    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            iniciar,
            {
                once: true
            }
        );

    } else {

        iniciar();
    }

})();
</script>

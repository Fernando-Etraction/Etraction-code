<script>
(function () {
    "use strict";

    var root = document.getElementById("etraction-dmfit-topbar-v2");

    if (!root) return;

    var buttons = root.querySelectorAll("[data-etraction-coupon]");

    function fallbackCopy(text) {
        var textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        textarea.style.pointerEvents = "none";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();

        try {
            document.execCommand("copy");
        } catch (e) {}

        document.body.removeChild(textarea);
    }

    function getFeedbackElement(button) {
        return (
            button.querySelector(".etraction-dmfit-topbar__coupon-copy") ||
            button.querySelector(".etraction-dmfit-marquee__coupon-copy")
        );
    }

    function handleFeedback(button) {
        var feedbackEl = getFeedbackElement(button);
        if (!feedbackEl) return;

        var originalText = feedbackEl.textContent;
        feedbackEl.textContent = "COPIADO";
        button.style.transform = "scale(1.03)";

        setTimeout(function () {
            button.style.transform = "";
        }, 180);

        setTimeout(function () {
            feedbackEl.textContent = originalText;
        }, 1700);
    }

    buttons.forEach(function (button) {
        button.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();

            var coupon = button.getAttribute("data-etraction-coupon") || "DM17";

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(coupon)
                    .then(function () {
                        handleFeedback(button);
                    })
                    .catch(function () {
                        fallbackCopy(coupon);
                        handleFeedback(button);
                    });
            } else {
                fallbackCopy(coupon);
                handleFeedback(button);
            }
        });
    });
})();
</script>

        var ok = false;

        try {

            ok = document.execCommand("copy");

        } catch (e) {

            ok = false;

        }



        document.body.removeChild(input);

        return ok;

    }



    function copyCoupon(button) {

        var text = button.getAttribute("data-etraction-coupon") || DEFAULT_COUPON;



        function fallback() {

            var ok = legacyCopy(text);

            feedback(button, ok);



            if (!ok) {

                try {

                    window.prompt("Copie o cupom:", text);

                } catch (e) {}

            }

        }



        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {

            navigator.clipboard.writeText(text).then(function () {

                feedback(button, true);

            }).catch(fallback);

        } else {

            fallback();

        }

    }



    function navigate(url) {

        var destination = url || DESTINATION;



        try {

            if (window.top && window.top !== window) {

                window.top.location.href = destination;

                return;

            }

        } catch (e) {}



        window.location.href = destination;

    }



    function findInteractive(target) {

        if (!target || !target.closest) return null;

        return target.closest("#" + ROOT_ID + " a[href], #" + ROOT_ID + " [data-etraction-coupon]");

    }



    function activate(element, event) {

        if (!element) return;



        var root = getRoot();

        if (!root || !root.contains(element)) return;



        if (event) {

            event.preventDefault();

            event.stopPropagation();

        }



        if (element.matches("[data-etraction-coupon]")) {

            copyCoupon(element);

            return;

        }



        if (element.matches("a[href]")) {

            navigate(element.getAttribute("href") || DESTINATION);

        }

    }



    function bindRoot(root) {

        if (!root || root.dataset.etractionBound === "true") return;

        root.dataset.etractionBound = "true";



        /* Pausa o marquee durante o toque/clique para o alvo não fugir do dedo. */

        root.addEventListener("pointerdown", function (event) {

            if (findInteractive(event.target)) {

                root.classList.add("is-interacting");

            }

        }, true);



        root.addEventListener("pointercancel", function () {

            root.classList.remove("is-interacting");

        }, true);



        /*

         * pointerup é usado de propósito. Alguns temas interceptam CLICK

         * globalmente; aqui executamos antes desse click existir.

         */

        root.addEventListener("pointerup", function (event) {

            var element = findInteractive(event.target);

            if (!element) return;



            root.classList.remove("is-interacting");

            activate(element, event);

        }, true);



        /* Bloqueia somente o click tardio, evitando ação duplicada. */

        root.addEventListener("click", function (event) {

            var element = findInteractive(event.target);

            if (!element) return;

            event.preventDefault();

            event.stopPropagation();

        }, true);



        root.addEventListener("keydown", function (event) {

            if (event.key !== "Enter" && event.key !== " ") return;

            var element = findInteractive(event.target);

            if (!element) return;

            activate(element, event);

        }, true);

    }



    function normalizeLinks(root) {

        if (!root) return;

        root.querySelectorAll("a[href]").forEach(function (link) {

            link.setAttribute("href", DESTINATION);

            link.setAttribute("target", "_self");

            link.setAttribute("rel", "noopener");

        });

    }



    function init() {

        var root = getRoot();

        if (!root) return;



        /* Mantém a tarja imediatamente antes do header da loja. */

        positionTopbar();



        normalizeLinks(root);

        bindRoot(root);

    }



    init();



    /* Se a plataforma recriar o header ou a tarja, reposiciona novamente. */

    var scheduled = false;

    var observer = new MutationObserver(function () {

        if (scheduled) return;



        scheduled = true;



        requestAnimationFrame(function () {

            scheduled = false;

            init();

        });

    });



    observer.observe(document.documentElement, {

        childList: true,

        subtree: true

    });



    setTimeout(init, 300);

    setTimeout(init, 800);

    setTimeout(init, 1500);

})();

</script>

<style>
/* =========================================================
   ESQUENTA BLACK DMFIT
   Banner com cronômetro + preço "De / Por" nos cards + filtro de categoria
   (o mesmo CSS serve para as 3 páginas; o que muda é o CONFIG do script)
========================================================= */

/* =========================================================
   SEÇÃO (ponta a ponta)
========================================================= */

.etraction-dmfit-esq-hero {
    --esq-pink: #eb0870;
    --esq-hot: #ff2589;
    --esq-soft: #ff7ab8;
    --esq-ink: #ffffff;
    --esq-muted: #a99fa7;
    --esq-line: #2b2228;

    position: relative !important;

    width: calc(100vw - var(--etraction-esq-sb, 0px)) !important;

    margin: 0 0 20px calc(50% - (100vw - var(--etraction-esq-sb, 0px)) / 2) !important;
    padding: 0 0 26px !important;

    background:
        radial-gradient(60% 70% at 12% 0%, rgba(235, 8, 112, .26) 0%, rgba(235, 8, 112, 0) 70%),
        radial-gradient(50% 60% at 95% 100%, rgba(255, 37, 137, .16) 0%, rgba(255, 37, 137, 0) 70%),
        #0d0b0d !important;

    color: var(--esq-ink) !important;

    font-family: Montserrat, Arial, sans-serif !important;
    text-align: left !important;

    box-sizing: border-box !important;
}


.etraction-dmfit-esq-hero *,
.etraction-dmfit-esq-hero *::before,
.etraction-dmfit-esq-hero *::after {
    box-sizing: border-box !important;
}


.etraction-dmfit-esq-hero [hidden] {
    display: none !important;
}


/* =========================================================
   FAIXA DO TOPO
========================================================= */

.etraction-dmfit-esq-strip {
    display: flex !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    justify-content: center !important;

    gap: 6px 28px !important;

    min-height: 36px !important;

    padding: 6px 16px !important;

    background: linear-gradient(90deg, #b8005a 0%, #eb0870 45%, #ff3d97 100%) !important;

    font-size: 10.5px !important;
    font-weight: 800 !important;
    line-height: 1.2 !important;

    letter-spacing: .14em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-esq-strip__live,
.etraction-dmfit-esq-strip__end {
    display: inline-flex !important;
    align-items: center !important;

    gap: 8px !important;
}


.etraction-dmfit-esq-strip__live i {
    width: 7px !important;
    height: 7px !important;

    border-radius: 50% !important;

    background: #ffffff !important;

    animation: etractionDmfitEsqPulse 1.6s ease-out infinite !important;
}


.etraction-dmfit-esq-strip__chip {
    padding: 3px 7px !important;

    border: 1px solid rgba(255, 255, 255, .28) !important;
    border-radius: 4px !important;

    background: rgba(0, 0, 0, .35) !important;

    color: #ffffff !important;

    font-size: 11px !important;
    font-weight: 800 !important;

    letter-spacing: .06em !important;

    font-variant-numeric: tabular-nums !important;
}


/* =========================================================
   CARD
========================================================= */

.etraction-dmfit-esq-card {
    position: relative !important;

    display: grid !important;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) !important;

    width: calc(100% - 32px) !important;
    max-width: 1140px !important;

    margin: 22px auto 0 !important;

    overflow: hidden !important;

    border: 1px solid var(--esq-line) !important;
    border-radius: 16px !important;

    background: linear-gradient(160deg, #161216 0%, #0f0c0f 100%) !important;

    box-shadow: 0 24px 48px rgba(0, 0, 0, .45) !important;
}


.etraction-dmfit-esq-card::before {
    content: "" !important;

    position: absolute !important;
    z-index: 2 !important;

    top: 0 !important;
    left: 0 !important;
    right: 0 !important;

    height: 3px !important;

    background: linear-gradient(90deg, var(--esq-pink), var(--esq-hot), var(--esq-soft)) !important;
}


/* número vazado gigante no fundo da coluna da direita */

.etraction-dmfit-esq-card__ghost {
    position: absolute !important;
    z-index: -1 !important;

    right: -14px !important;
    bottom: -40px !important;

    color: transparent !important;

    font-size: 150px !important;
    font-weight: 900 !important;
    line-height: 1 !important;

    letter-spacing: -.05em !important;

    white-space: nowrap !important;

    -webkit-text-stroke: 1px rgba(255, 37, 137, .14) !important;

    pointer-events: none !important;
    user-select: none !important;
}


/* =========================================================
   COLUNA DA ESQUERDA
========================================================= */

.etraction-dmfit-esq-card__main {
    position: relative !important;
    z-index: 1 !important;

    padding: 28px 32px 26px !important;
}


.etraction-dmfit-esq-kicker {
    display: block !important;

    margin: 0 0 10px !important;

    color: var(--esq-hot) !important;

    font-size: 10px !important;
    font-weight: 800 !important;
    line-height: 1.3 !important;

    letter-spacing: .22em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-esq-title {
    display: flex !important;
    flex-direction: column !important;

    margin: 0 !important;
    padding: 0 !important;

    color: var(--esq-ink) !important;

    font-family: inherit !important;
    font-size: clamp(34px, 4.6vw, 58px) !important;
    font-weight: 900 !important;
    line-height: .9 !important;

    letter-spacing: -.04em !important;

    text-align: left !important;
    text-transform: uppercase !important;
}


.etraction-dmfit-esq-title__hot {
    background: linear-gradient(90deg, var(--esq-pink) 0%, var(--esq-hot) 45%, var(--esq-soft) 100%) !important;

    -webkit-background-clip: text !important;
    background-clip: text !important;

    color: transparent !important;
    -webkit-text-fill-color: transparent !important;
}


.etraction-dmfit-esq-sub {
    margin: 10px 0 16px !important;

    color: var(--esq-muted) !important;

    font-size: 11px !important;
    font-weight: 700 !important;
    line-height: 1.4 !important;

    letter-spacing: .26em !important;

    text-transform: uppercase !important;
}


/* caixa da oferta: preço à esquerda, detalhes à direita */

.etraction-dmfit-esq-offer {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;

    gap: 10px !important;

    padding: 14px 18px !important;

    border: 1px solid #2f252c !important;
    border-radius: 12px !important;

    background: rgba(255, 255, 255, .025) !important;

    text-align: center !important;
}


.etraction-dmfit-esq-offer__pill {
    padding: 5px 12px !important;

    border: 1px solid #3a2e36 !important;
    border-radius: 999px !important;

    background: #221a20 !important;

    color: #ffffff !important;

    font-size: 9.5px !important;
    font-weight: 800 !important;
    line-height: 1.2 !important;

    letter-spacing: .08em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-esq-offer__row {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    gap: 20px !important;
}


.etraction-dmfit-esq-offer__main {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
}


.etraction-dmfit-esq-offer__label {
    color: var(--esq-muted) !important;

    font-size: 10px !important;
    font-weight: 700 !important;

    letter-spacing: .16em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-esq-offer__price {
    display: flex !important;
    align-items: flex-start !important;

    margin: 4px 0 0 !important;

    color: #ffffff !important;

    font-weight: 900 !important;
    line-height: .85 !important;
}


.etraction-dmfit-esq-offer__price small {
    margin: 6px 5px 0 0 !important;

    font-size: 18px !important;
    font-weight: 800 !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-esq-offer__price strong {
    font-size: 80px !important;
    font-weight: 900 !important;

    letter-spacing: -.06em !important;
}


.etraction-dmfit-esq-offer__price sup {
    position: static !important;

    margin: 5px 0 0 3px !important;

    font-size: 22px !important;
    font-weight: 800 !important;
    line-height: 1 !important;
}


.etraction-dmfit-esq-offer__info {
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-start !important;

    gap: 6px !important;

    padding-left: 20px !important;

    border-left: 1px solid #2f252c !important;

    text-align: left !important;
}


.etraction-dmfit-esq-offer__tag {
    padding: 4px 9px !important;

    border-radius: 4px !important;

    background: var(--esq-pink) !important;

    color: #ffffff !important;

    font-size: 10px !important;
    font-weight: 900 !important;

    letter-spacing: .14em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-esq-offer__save {
    margin: 0 !important;

    color: #e9e3e8 !important;

    font-size: 13px !important;
    font-weight: 500 !important;
    line-height: 1.35 !important;
}


.etraction-dmfit-esq-offer__save b {
    color: var(--esq-hot) !important;

    font-weight: 900 !important;
}


.etraction-dmfit-esq-offer__de {
    color: #7d737b !important;

    font-size: 11.5px !important;
    font-weight: 500 !important;

    text-decoration: line-through !important;
}


/* =========================================================
   COLUNA DA DIREITA
========================================================= */

.etraction-dmfit-esq-card__side {
    position: relative !important;
    z-index: 1 !important;

    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;

    padding: 28px 32px 26px !important;

    overflow: hidden !important;

    border-left: 1px solid var(--esq-line) !important;

    background: radial-gradient(80% 60% at 70% 40%, rgba(235, 8, 112, .1) 0%, rgba(235, 8, 112, 0) 70%) !important;
}


.etraction-dmfit-esq-sticker {
    position: absolute !important;

    top: 18px !important;
    right: -6px !important;

    padding: 7px 14px 7px 12px !important;

    border-radius: 4px !important;

    background: #ffffff !important;

    color: var(--esq-pink) !important;

    font-size: 12px !important;
    font-weight: 900 !important;
    line-height: 1 !important;

    letter-spacing: .04em !important;

    text-transform: uppercase !important;

    transform: rotate(5deg) !important;

    box-shadow: 0 10px 24px rgba(235, 8, 112, .4) !important;
}


.etraction-dmfit-esq-side__label {
    color: var(--esq-hot) !important;

    font-size: 10px !important;
    font-weight: 900 !important;

    letter-spacing: .2em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-esq-side__text {
    margin: 6px 0 16px !important;

    color: #d6cfd4 !important;

    font-size: 14px !important;
    font-weight: 500 !important;
    line-height: 1.45 !important;
}


.etraction-dmfit-esq-side__text strong {
    color: #ffffff !important;

    font-weight: 900 !important;
}


/* cronômetro grande */

.etraction-dmfit-esq-clock__label {
    display: block !important;

    margin-bottom: 8px !important;

    color: var(--esq-muted) !important;

    font-size: 10px !important;
    font-weight: 800 !important;

    letter-spacing: .16em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-esq-clock__grid {
    display: flex !important;
    align-items: flex-start !important;

    gap: 6px !important;
}


.etraction-dmfit-esq-clock__unit {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;

    width: 64px !important;

    padding: 9px 0 7px !important;

    border: 1px solid rgba(255, 37, 137, .45) !important;
    border-radius: 9px !important;

    background: #1a1418 !important;
}


.etraction-dmfit-esq-clock__unit strong {
    color: #ffffff !important;

    font-size: 28px !important;
    font-weight: 900 !important;
    line-height: 1 !important;

    font-variant-numeric: tabular-nums !important;
}


.etraction-dmfit-esq-clock__unit span {
    margin-top: 5px !important;

    color: var(--esq-muted) !important;

    font-size: 8.5px !important;
    font-weight: 800 !important;

    letter-spacing: .14em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-esq-clock__grid i {
    padding-top: 10px !important;

    color: var(--esq-hot) !important;

    font-size: 22px !important;
    font-style: normal !important;
    font-weight: 900 !important;
    line-height: 1 !important;
}


/* botão */

.etraction-dmfit-esq-cta {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    gap: 10px !important;

    width: 100% !important;
    max-width: 330px !important;
    min-height: 46px !important;

    margin: 18px 0 0 !important;
    padding: 0 20px !important;

    border: 0 !important;
    border-radius: 9px !important;

    background: linear-gradient(90deg, var(--esq-pink) 0%, var(--esq-hot) 100%) !important;

    color: #ffffff !important;

    font-family: inherit !important;
    font-size: 13px !important;
    font-weight: 900 !important;

    letter-spacing: .12em !important;

    text-transform: uppercase !important;

    cursor: pointer !important;

    box-shadow: 0 10px 24px rgba(235, 8, 112, .38) !important;

    transition: transform .2s ease, box-shadow .2s ease !important;
}


.etraction-dmfit-esq-cta:hover {
    transform: translateY(-2px) !important;

    box-shadow: 0 14px 30px rgba(235, 8, 112, .5) !important;
}


.etraction-dmfit-esq-cta:focus-visible,
.etraction-dmfit-esq-cats__chip:focus-visible {
    outline: 2px solid #ffffff !important;
    outline-offset: 3px !important;
}


.etraction-dmfit-esq-side__note {
    margin-top: 8px !important;

    color: #7d737b !important;

    font-size: 11px !important;
    font-weight: 500 !important;
}


/* =========================================================
   FILTRO POR CATEGORIA
========================================================= */

.etraction-dmfit-esq-cats {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    gap: 14px !important;

    width: calc(100% - 32px) !important;
    max-width: 1140px !important;

    margin: 18px auto 0 !important;
}


.etraction-dmfit-esq-cats__label {
    flex: 0 0 auto !important;

    color: var(--esq-muted) !important;

    font-size: 10px !important;
    font-weight: 800 !important;

    letter-spacing: .2em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-esq-cats__list {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: center !important;

    gap: 8px !important;

    margin: 0 !important;
    padding: 0 !important;
}


.etraction-dmfit-esq-cats__chip {
    display: inline-flex !important;
    align-items: center !important;

    min-height: 36px !important;

    padding: 0 16px !important;

    border: 1px solid #3a2e36 !important;
    border-radius: 999px !important;

    background: #1a1418 !important;

    color: #ffffff !important;

    font-size: 11px !important;
    font-weight: 800 !important;

    letter-spacing: .08em !important;

    text-decoration: none !important;
    text-transform: uppercase !important;

    white-space: nowrap !important;

    transition: border-color .2s ease, background-color .2s ease !important;
}


.etraction-dmfit-esq-cats__chip:hover {
    border-color: var(--esq-hot) !important;

    color: #ffffff !important;

    text-decoration: none !important;
}


.etraction-dmfit-esq-cats__chip.is-ativo {
    border-color: transparent !important;

    background: linear-gradient(90deg, var(--esq-pink) 0%, var(--esq-hot) 100%) !important;

    box-shadow: 0 6px 16px rgba(235, 8, 112, .35) !important;
}


@keyframes etractionDmfitEsqPulse {

    0% {
        box-shadow: 0 0 0 0 rgba(255, 255, 255, .7);
    }

    100% {
        box-shadow: 0 0 0 8px rgba(255, 255, 255, 0);
    }

}


/* =========================================================
   PREÇO DE / POR NOS CARDS
========================================================= */

.etraction-dmfit-esq-ok .old-price {
    display: none !important;
}


.etraction-dmfit-esq-de {
    display: flex !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    justify-content: center !important;

    gap: 3px 6px !important;

    margin: 0 0 2px !important;

    color: #8a8a8a !important;

    font-size: 12px !important;
    font-weight: 500 !important;
    line-height: 1.2 !important;
}


/* em card estreito o selo desce para a linha de baixo, sem quebrar o preço */
.etraction-dmfit-esq-de > span {
    white-space: nowrap !important;
}


.etraction-dmfit-esq-de s {
    color: #8a8a8a !important;

    text-decoration: line-through !important;
}


.etraction-dmfit-esq-de__off {
    padding: 2px 5px !important;

    border-radius: 4px !important;

    background: #eb0870 !important;

    color: #ffffff !important;

    font-size: 10px !important;
    font-weight: 800 !important;
    line-height: 1.2 !important;
}


.etraction-dmfit-esq-economia {
    display: block !important;

    margin: 7px auto 0 !important;
    padding: 4px 8px !important;

    border-radius: 4px !important;

    background: #fff0f6 !important;

    color: #eb0870 !important;

    font-size: 11px !important;
    font-weight: 700 !important;
    line-height: 1.3 !important;

    text-align: center !important;
}


.etraction-dmfit-esq-economia strong {
    color: inherit !important;

    font-weight: 900 !important;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1024px) {

    .etraction-dmfit-esq-card__main,
    .etraction-dmfit-esq-card__side {
        padding: 24px 22px 22px !important;
    }


    .etraction-dmfit-esq-clock__unit {
        width: 56px !important;
    }


    .etraction-dmfit-esq-clock__unit strong {
        font-size: 24px !important;
    }


    .etraction-dmfit-esq-offer__price strong {
        font-size: 68px !important;
    }


    .etraction-dmfit-esq-offer__row {
        gap: 14px !important;
    }


    .etraction-dmfit-esq-offer__info {
        padding-left: 14px !important;
    }


    .etraction-dmfit-esq-cats {
        flex-direction: column !important;

        gap: 10px !important;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 767px) {

    .etraction-dmfit-esq-hero {
        margin-bottom: 14px !important;
        padding-bottom: 16px !important;
    }


    .etraction-dmfit-esq-strip {
        gap: 4px 12px !important;

        min-height: 0 !important;

        padding: 7px 10px !important;

        font-size: 9.5px !important;

        letter-spacing: .1em !important;
    }


    /* o cronômetro grande do card já aparece logo abaixo */
    .etraction-dmfit-esq-strip__end {
        display: none !important;
    }


    .etraction-dmfit-esq-card {
        grid-template-columns: minmax(0, 1fr) !important;

        width: calc(100% - 20px) !important;

        margin-top: 12px !important;

        border-radius: 12px !important;
    }


    .etraction-dmfit-esq-card__ghost {
        font-size: 96px !important;

        bottom: -24px !important;
    }


    .etraction-dmfit-esq-card__main {
        padding: 18px 14px 14px !important;

        text-align: center !important;
    }


    .etraction-dmfit-esq-kicker {
        margin-bottom: 6px !important;

        font-size: 9px !important;

        letter-spacing: .14em !important;
    }


    /* título numa linha só */
    .etraction-dmfit-esq-title {
        flex-direction: row !important;
        justify-content: center !important;

        gap: .22em !important;

        font-size: clamp(26px, 8.6vw, 36px) !important;

        text-align: center !important;
    }


    .etraction-dmfit-esq-sub {
        margin: 6px 0 12px !important;

        font-size: 9px !important;

        letter-spacing: .16em !important;
    }


    .etraction-dmfit-esq-offer {
        gap: 8px !important;

        padding: 12px 10px !important;
    }


    .etraction-dmfit-esq-offer__pill {
        font-size: 8.5px !important;
    }


    .etraction-dmfit-esq-offer__row {
        gap: 12px !important;
    }


    .etraction-dmfit-esq-offer__label {
        font-size: 8.5px !important;

        letter-spacing: .1em !important;
    }


    .etraction-dmfit-esq-offer__price strong {
        font-size: 58px !important;
    }


    .etraction-dmfit-esq-offer__price small {
        margin-top: 4px !important;

        font-size: 14px !important;
    }


    .etraction-dmfit-esq-offer__price sup {
        font-size: 17px !important;
    }


    .etraction-dmfit-esq-offer__info {
        gap: 5px !important;

        padding-left: 12px !important;
    }


    .etraction-dmfit-esq-offer__save {
        font-size: 11.5px !important;
    }


    .etraction-dmfit-esq-offer__de {
        font-size: 10.5px !important;
    }


    .etraction-dmfit-esq-card__side {
        align-items: center !important;

        padding: 14px 14px 16px !important;

        border-top: 1px solid var(--esq-line) !important;
        border-left: 0 !important;

        text-align: center !important;
    }


    /* no celular o essencial: texto curto, cronômetro e botão */
    .etraction-dmfit-esq-sticker,
    .etraction-dmfit-esq-side__label,
    .etraction-dmfit-esq-side__note {
        display: none !important;
    }


    .etraction-dmfit-esq-side__text {
        margin: 0 0 10px !important;

        font-size: 12.5px !important;
    }


    .etraction-dmfit-esq-clock__label {
        margin-bottom: 6px !important;

        font-size: 9px !important;
    }


    .etraction-dmfit-esq-clock__grid {
        justify-content: center !important;

        gap: 4px !important;
    }


    .etraction-dmfit-esq-clock__unit {
        width: 52px !important;

        padding: 7px 0 6px !important;
    }


    .etraction-dmfit-esq-clock__unit strong {
        font-size: 21px !important;
    }


    .etraction-dmfit-esq-clock__unit span {
        margin-top: 4px !important;

        font-size: 7.5px !important;
    }


    .etraction-dmfit-esq-clock__grid i {
        padding-top: 8px !important;

        font-size: 17px !important;
    }


    .etraction-dmfit-esq-cta {
        min-height: 42px !important;

        margin-top: 12px !important;

        font-size: 12px !important;
    }


    /* categorias: uma linha só, arrastando para o lado */
    .etraction-dmfit-esq-cats {
        width: 100% !important;

        gap: 8px !important;

        margin-top: 14px !important;
    }


    .etraction-dmfit-esq-cats__label {
        font-size: 9px !important;
    }


    .etraction-dmfit-esq-cats__list {
        flex-wrap: nowrap !important;
        justify-content: flex-start !important;

        width: 100% !important;

        padding: 0 10px 2px !important;

        overflow-x: auto !important;

        scrollbar-width: none !important;

        -webkit-overflow-scrolling: touch !important;
    }


    .etraction-dmfit-esq-cats__list::-webkit-scrollbar {
        display: none !important;
    }


    .etraction-dmfit-esq-cats__chip {
        flex: 0 0 auto !important;

        min-height: 34px !important;

        padding: 0 14px !important;

        font-size: 10px !important;
    }


    .etraction-dmfit-esq-de {
        gap: 3px 4px !important;

        font-size: 11px !important;
    }


    .etraction-dmfit-esq-de__off {
        font-size: 9px !important;
    }


    .etraction-dmfit-esq-economia {
        padding: 4px 6px !important;

        font-size: 10px !important;
    }

}


@media (prefers-reduced-motion: reduce) {

    .etraction-dmfit-esq-hero *,
    .etraction-dmfit-esq-cta {
        animation: none !important;
        transition: none !important;
    }

}
</style>


<script>
(function () {

    "use strict";


    /* =========================================================
       CONFIG DA PÁGINA
    ========================================================= */

    var CONFIG = {

        // só roda nestas páginas
        PAGINAS: [
            "/esquenta-black"
        ],

        // fim da oferta (horário de Brasília). null = zera todo dia à meia-noite
        // ex. de data fixa: "2026-10-31T23:59:59-03:00"
        FIM: null,

        // TIPO "preco": preço fixo no PIX | TIPO "porcentagem": "até X% OFF"
        OFERTA: {
            TIPO: "porcentagem",
            VALOR: 50,
            ETIQUETA: "OFF"
        },

        // só usado no TIPO "preco"
        DE_ATE: 0,

        // aqui os cards já têm o preço riscado e o selo de % da própria loja
        DE_POR: false,

        MIN_ECONOMIA: 5,

        TEXTOS: {
            KICKER: "DMFIT · A Black começou antes",
            SUB: "Não precisa esperar novembro",
            PILL: "Leggings, tops, shorts e mais",
            LABEL: "Peças com",
            DETALHE: "Desconto já aplicado no preço, <b>sem cupom</b>.",
            STICKER: "Sem cupom",
            LADO: "O desconto já aparece no preço de cada peça. É só escolher e levar.",
            CTA: "Ver as peças",
            NOTA: "Válido para os itens desta página."
        },

        // banners nativos que o novo substitui
        ESCONDER: [
            ".conteudo-adicional-topo"
        ],

        // filtro por categoria (id da Magazord, ?categoria=ID). [] = sem filtro
        CATEGORIAS: [
            { ID: 19, NOME: "Calças e leggings" },
            { ID: 20, NOME: "Tops" },
            { ID: 21, NOME: "Shorts e bermudas" },
            { ID: 23, NOME: "Macaquinhos" },
            { ID: 22, NOME: "Blusas e regatas" }
        ]
    };


    /* ========================================================= */


    var caminho =
        location.pathname
            .replace(/\/+$/, "")
            .toLowerCase();


    if (
        CONFIG.PAGINAS.indexOf(caminho) === -1
    ) {
        return;
    }


    var EH_PRECO =
        CONFIG.OFERTA.TIPO === "preco";


    // meia-noite de hoje no horário de Brasília (UTC-3, sem horário de verão)
    function fimDoDia() {

        var DIA = 86400000;

        var BRASILIA = -3 * 3600000;


        return Math.floor((Date.now() + BRASILIA) / DIA) * DIA + DIA - BRASILIA;
    }


    var DIARIO =
        !CONFIG.FIM;

    var FIM =
        DIARIO ? fimDoDia() : new Date(CONFIG.FIM).getTime();


    /* =========================================================
       PREÇOS
    ========================================================= */

    function lerPreco(texto) {

        var achado =
            String(texto || "").match(
                /(\d{1,3}(?:\.\d{3})*,\d{2})/
            );


        if (!achado) {
            return 0;
        }


        return parseFloat(
            achado[1]
                .replace(/\./g, "")
                .replace(",", ".")
        );
    }


    function lerParcelado(texto) {

        var achado =
            String(texto || "").match(
                /(\d+)\s*x\s*de\s*R\$\s*(\d{1,3}(?:\.\d{3})*,\d{2})/i
            );


        if (!achado) {
            return 0;
        }


        return Math.round(
            parseInt(achado[1], 10) *
            lerPreco(achado[2]) *
            100
        ) / 100;
    }


    function moeda(valor) {

        return valor.toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );
    }


    function limparCard(holder) {

        var antigos =
            holder.querySelectorAll(
                ".etraction-dmfit-esq-de, .etraction-dmfit-esq-economia"
            );


        for (var i = 0; i < antigos.length; i++) {
            antigos[i].parentNode.removeChild(antigos[i]);
        }


        holder.classList.remove(
            "etraction-dmfit-esq-ok"
        );
    }


    // aplica o "De / Por" no card e devolve o preço "De" encontrado
    function aplicarCard(holder) {

        var pixEl =
            holder.querySelector(".price-pix");

        var primario =
            holder.querySelector(".price-primary");


        if (!pixEl || !primario) {
            return 0;
        }


        var pix =
            lerPreco(pixEl.textContent);


        // "De" = maior entre o preço antigo nativo e o total no cartão
        var antigoEl =
            holder.querySelector(".old-price");

        var secundario =
            holder.querySelector(".price-secondary");

        var de =
            Math.max(
                antigoEl ? lerPreco(antigoEl.textContent) : 0,
                secundario ? lerParcelado(secundario.textContent) : 0
            );


        var assinatura =
            pix + "|" + de;


        if (
            holder.getAttribute("data-etraction-esq") === assinatura &&
            (
                !holder.classList.contains("etraction-dmfit-esq-ok") ||
                holder.querySelector(".etraction-dmfit-esq-de")
            )
        ) {
            return de;
        }


        limparCard(holder);

        holder.setAttribute(
            "data-etraction-esq",
            assinatura
        );


        if (!pix || !de || de <= pix) {
            return de;
        }


        var economia =
            Math.round((de - pix) * 100) / 100;

        // arredonda para baixo para nunca anunciar mais desconto do que existe
        var porcentagem =
            Math.floor(economia / de * 100);


        if (porcentagem < CONFIG.MIN_ECONOMIA) {
            return de;
        }


        var linhaDe =
            document.createElement("div");

        linhaDe.className =
            "etraction-dmfit-esq-de";

        linhaDe.innerHTML =
            '<span>De <s>' + moeda(de) + '</s></span>' +
            '<span class="etraction-dmfit-esq-de__off">-' + porcentagem + '%</span>';


        var linhaEconomia =
            document.createElement("div");

        linhaEconomia.className =
            "etraction-dmfit-esq-economia";

        linhaEconomia.innerHTML =
            'Economize <strong>' + moeda(economia) + '</strong> no PIX';


        primario.parentNode.insertBefore(
            linhaDe,
            primario
        );

        holder.appendChild(
            linhaEconomia
        );

        holder.classList.add(
            "etraction-dmfit-esq-ok"
        );


        return de;
    }


    function aplicarCards() {

        if (!CONFIG.DE_POR) {
            return;
        }


        var holders =
            document.querySelectorAll(
                ".detalhes-valor-produto .price-holder"
            );

        var maiorDe = 0;


        for (var i = 0; i < holders.length; i++) {
            maiorDe = Math.max(maiorDe, aplicarCard(holders[i]));
        }


        if (maiorDe) {
            atualizarOferta(maiorDe);
        }
    }


    /* =========================================================
       BANNER
    ========================================================= */

    var hero = null;

    var relogio = null;


    function montarOferta() {

        var T = CONFIG.TEXTOS;

        var valor = CONFIG.OFERTA.VALOR;

        var numero, detalhe;


        if (EH_PRECO) {

            numero =
                '<small>R$</small><strong>' + Math.floor(valor) + '</strong>' +
                '<sup>,' + moeda(valor).slice(-2) + '</sup>';

            detalhe =
                '<p class="etraction-dmfit-esq-offer__save">Economize até <b data-etx-esq="eco"></b></p>' +
                '<span class="etraction-dmfit-esq-offer__de">De até <span data-etx-esq="de"></span></span>';

        } else {

            numero =
                '<small>Até</small><strong>' + valor + '</strong><sup>%</sup>';

            detalhe =
                T.DETALHE ? '<p class="etraction-dmfit-esq-offer__save">' + T.DETALHE + '</p>' : "";
        }


        return `
            <div class="etraction-dmfit-esq-offer">

                <span class="etraction-dmfit-esq-offer__pill">${T.PILL}</span>

                <div class="etraction-dmfit-esq-offer__row">

                    <div class="etraction-dmfit-esq-offer__main">
                        <span class="etraction-dmfit-esq-offer__label">${T.LABEL}</span>
                        <div class="etraction-dmfit-esq-offer__price">${numero}</div>
                    </div>

                    <div class="etraction-dmfit-esq-offer__info">
                        <span class="etraction-dmfit-esq-offer__tag">${CONFIG.OFERTA.ETIQUETA}</span>
                        ${detalhe}
                    </div>

                </div>

            </div>
        `;
    }


    function montarCategorias() {

        if (!CONFIG.CATEGORIAS.length) {
            return "";
        }


        var url =
            new URL(location.href);

        var atual =
            url.searchParams.get("categoria") || "";


        function link(id) {

            var destino =
                new URL(location.href);

            destino.searchParams.delete("pagina");

            if (id) {
                destino.searchParams.set("categoria", id);
            } else {
                destino.searchParams.delete("categoria");
            }

            return destino.pathname + destino.search;
        }


        var lista =
            [{ ID: "", NOME: "Todas" }].concat(CONFIG.CATEGORIAS);

        var chips = "";


        for (var i = 0; i < lista.length; i++) {

            var ativo =
                String(lista[i].ID) === atual;

            chips +=
                '<a class="etraction-dmfit-esq-cats__chip' + (ativo ? " is-ativo" : "") + '"' +
                ' href="' + link(lista[i].ID) + '"' +
                (ativo ? ' aria-current="true"' : "") + '>' +
                lista[i].NOME +
                '</a>';
        }


        return `
            <nav class="etraction-dmfit-esq-cats" aria-label="Filtrar por categoria">
                <span class="etraction-dmfit-esq-cats__label">Filtre por categoria</span>
                <div class="etraction-dmfit-esq-cats__list">${chips}</div>
            </nav>
        `;
    }


    function montarHero() {

        var T = CONFIG.TEXTOS;

        var secao =
            document.createElement("section");

        secao.className =
            "etraction-dmfit-esq-hero";

        secao.setAttribute("aria-label", "Esquenta Black DMFIT");


        var quando =
            DIARIO ? "hoje " : "";

        var fantasma =
            EH_PRECO ? "R$" + Math.floor(CONFIG.OFERTA.VALOR) : CONFIG.OFERTA.VALOR + "%";

        var sticker =
            T.STICKER || 'Até <span data-etx-esq="off"></span>% OFF';


        secao.innerHTML = `
            <div class="etraction-dmfit-esq-strip">

                <span class="etraction-dmfit-esq-strip__live">
                    <i aria-hidden="true"></i>
                    Esquenta Black liberado
                </span>

                <span class="etraction-dmfit-esq-strip__end" data-etx-esq-timer>
                    Termina ${quando}em:
                    <b class="etraction-dmfit-esq-strip__chip">
                        <span data-u="d"><span data-t="d">00</span>D </span><span data-t="h">00</span>H <span data-t="m">00</span>M <span data-t="s">00</span>S
                    </b>
                </span>

            </div>

            <div class="etraction-dmfit-esq-card">

                <div class="etraction-dmfit-esq-card__main">

                    <span class="etraction-dmfit-esq-kicker">${T.KICKER}</span>

                    <h2 class="etraction-dmfit-esq-title">
                        <span>Esquenta</span>
                        <span class="etraction-dmfit-esq-title__hot">Black</span>
                    </h2>

                    <p class="etraction-dmfit-esq-sub">${T.SUB}</p>

                    ${montarOferta()}

                </div>

                <div class="etraction-dmfit-esq-card__side">

                    <span class="etraction-dmfit-esq-card__ghost" aria-hidden="true">${fantasma}</span>

                    <span class="etraction-dmfit-esq-sticker">${sticker}</span>

                    <span class="etraction-dmfit-esq-side__label">
                        Desconto desbloqueado
                    </span>

                    <p class="etraction-dmfit-esq-side__text">${T.LADO}</p>

                    <div class="etraction-dmfit-esq-clock" data-etx-esq-timer role="timer" aria-label="Tempo restante da oferta">

                        <span class="etraction-dmfit-esq-clock__label">
                            A oferta ${DIARIO ? "de hoje " : ""}termina em
                        </span>

                        <div class="etraction-dmfit-esq-clock__grid">

                            <div class="etraction-dmfit-esq-clock__unit" data-u="d">
                                <strong data-t="d">00</strong>
                                <span>dias</span>
                            </div>

                            <i data-u="d" aria-hidden="true">:</i>

                            <div class="etraction-dmfit-esq-clock__unit">
                                <strong data-t="h">00</strong>
                                <span>horas</span>
                            </div>

                            <i aria-hidden="true">:</i>

                            <div class="etraction-dmfit-esq-clock__unit">
                                <strong data-t="m">00</strong>
                                <span>min</span>
                            </div>

                            <i aria-hidden="true">:</i>

                            <div class="etraction-dmfit-esq-clock__unit">
                                <strong data-t="s">00</strong>
                                <span>seg</span>
                            </div>

                        </div>

                    </div>

                    <button type="button" class="etraction-dmfit-esq-cta">
                        ${T.CTA}
                        <span aria-hidden="true">↓</span>
                    </button>

                    <span class="etraction-dmfit-esq-side__note">${T.NOTA}</span>

                </div>

            </div>

            ${montarCategorias()}
        `;


        secao
            .querySelector(".etraction-dmfit-esq-cta")
            .addEventListener(
                "click",
                function () {

                    var lista =
                        document.querySelector(".container-list") ||
                        document.querySelector("#search-area");

                    if (lista) {
                        lista.scrollIntoView({ behavior: "smooth", block: "start" });
                    }

                }
            );


        return secao;
    }


    function escrever(chave, texto) {

        var alvo =
            hero && hero.querySelector('[data-etx-esq="' + chave + '"]');


        if (alvo && alvo.textContent !== texto) {
            alvo.textContent = texto;
        }
    }


    function atualizarOferta(deAte) {

        var valor =
            CONFIG.OFERTA.VALOR;


        if (!hero || !EH_PRECO || deAte <= valor) {
            return;
        }


        var economia =
            Math.round((deAte - valor) * 100) / 100;


        escrever("de", moeda(deAte));

        escrever("eco", moeda(economia));

        escrever("off", String(Math.floor(economia / deAte * 100)));
    }


    // ajusta a seção de ponta a ponta sem gerar rolagem lateral pela barra do Windows
    function medirBarra() {

        document.documentElement.style.setProperty(
            "--etraction-esq-sb",
            (window.innerWidth - document.documentElement.clientWidth) + "px"
        );
    }


    function doisDigitos(n) {
        return n < 10 ? "0" + n : String(n);
    }


    function atualizarTimer() {

        if (!hero) {
            return;
        }


        var resta =
            Math.max(0, Math.floor((FIM - Date.now()) / 1000));


        // modo diário: virou o dia, recomeça a contagem
        if (resta <= 0 && DIARIO) {

            FIM = fimDoDia();

            resta = Math.min(86399, Math.floor((FIM - Date.now()) / 1000));
        }


        var i;


        if (resta <= 0) {

            clearInterval(relogio);

            // acabou: some só com os cronômetros
            var timers =
                hero.querySelectorAll("[data-etx-esq-timer]");

            for (i = 0; i < timers.length; i++) {
                timers[i].hidden = true;
            }

            return;
        }


        var valores = {
            d: Math.floor(resta / 86400),
            h: Math.floor(resta % 86400 / 3600),
            m: Math.floor(resta % 3600 / 60),
            s: resta % 60
        };


        var numeros =
            hero.querySelectorAll("[data-t]");

        for (i = 0; i < numeros.length; i++) {

            var texto =
                doisDigitos(valores[numeros[i].getAttribute("data-t")]);

            if (numeros[i].textContent !== texto) {
                numeros[i].textContent = texto;
            }
        }


        // no último dia (e no modo diário) a parte de dias some
        var dias =
            hero.querySelectorAll('[data-u="d"]');

        for (i = 0; i < dias.length; i++) {
            dias[i].hidden = valores.d === 0;
        }
    }


    function criarHero() {

        if (hero) {
            return true;
        }


        // abaixo da descrição/título da página ou do breadcrumb; sem eles, acima da vitrine
        var depoisDe =
            document.querySelector("#main-area > .descricao-pesquisa") ||
            document.querySelector("#main-area > .area-breadcrumb");

        var lista =
            document.querySelector(".container-list");


        if (!depoisDe && !lista) {
            return false;
        }


        for (var i = 0; i < CONFIG.ESCONDER.length; i++) {

            var nativos =
                document.querySelectorAll(CONFIG.ESCONDER[i]);

            // inline + important para ganhar do CSS da loja
            for (var n = 0; n < nativos.length; n++) {
                nativos[n].style.setProperty("display", "none", "important");
            }
        }


        hero = montarHero();


        if (depoisDe) {
            depoisDe.insertAdjacentElement("afterend", hero);
        } else {
            lista.parentNode.insertBefore(hero, lista);
        }


        medirBarra();

        window.addEventListener("resize", medirBarra);


        atualizarOferta(CONFIG.DE_ATE);

        atualizarTimer();

        relogio =
            setInterval(atualizarTimer, 1000);


        // veio de um clique no filtro: leva direto para as categorias
        var filtros =
            hero.querySelector(".etraction-dmfit-esq-cats");

        if (filtros && new URL(location.href).searchParams.get("categoria")) {

            window.scrollTo(
                0,
                filtros.getBoundingClientRect().top + window.pageYOffset - 110
            );


            // no celular a lista rola de lado: centraliza a categoria ativa
            var faixaCats =
                filtros.querySelector(".etraction-dmfit-esq-cats__list");

            var ativa =
                filtros.querySelector(".is-ativo");

            if (ativa && faixaCats.scrollWidth > faixaCats.clientWidth) {

                faixaCats.scrollLeft +=
                    ativa.getBoundingClientRect().left -
                    faixaCats.getBoundingClientRect().left -
                    (faixaCats.clientWidth - ativa.offsetWidth) / 2;
            }
        }


        return true;
    }


    /* =========================================================
       INICIAR
    ========================================================= */

    var agendado = false;


    function rodar() {

        agendado = false;

        criarHero();

        aplicarCards();
    }


    function agendar() {

        if (agendado) {
            return;
        }


        agendado = true;

        setTimeout(rodar, 60);
    }


    function iniciar() {

        rodar();


        // a vitrine é React: refaz quando filtra, ordena ou pagina
        new MutationObserver(
            function (mutacoes) {

                for (var i = 0; i < mutacoes.length; i++) {

                    var alvo =
                        mutacoes[i].target;

                    var el =
                        alvo.nodeType === 1 ? alvo : alvo.parentElement;


                    // ignora o próprio banner (cronômetro trocando os números)
                    if (
                        el &&
                        el.closest &&
                        el.closest(".etraction-dmfit-esq-hero")
                    ) {
                        continue;
                    }


                    agendar();

                    return;
                }

            }
        ).observe(
            document.body,
            {
                childList: true,
                subtree: true,
                characterData: true
            }
        );
    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            iniciar,
            {
                once: true
            }
        );

    } else {

        iniciar();
    }

})();
</script>

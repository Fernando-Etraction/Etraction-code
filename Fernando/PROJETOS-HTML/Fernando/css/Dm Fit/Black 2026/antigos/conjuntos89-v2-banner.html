<script>
(function () {

    "use strict";


    var CONFIG = {

        // só roda nestas páginas
        PAGINAS: [
            "/conjuntotudo89"
        ],

        // fim da oferta (horário de Brasília). null = zera todo dia à meia-noite
        // ex. de data fixa: "2026-10-30T23:59:59-03:00"
        FIM: null,

        // preço da oferta no PIX (o "De até" e o % saem dos próprios cards)
        PRECO: 89,

        // usado no banner até os cards carregarem
        DE_ATE: 169.90,

        // só mostra o "De / Por" no card quando a economia passar disto (%)
        MIN_ECONOMIA: 5
    };


    var caminho =
        location.pathname
            .replace(/\/+$/, "")
            .toLowerCase();


    if (
        CONFIG.PAGINAS.indexOf(caminho) === -1
    ) {
        return;
    }


    // meia-noite de hoje no horário de Brasília (UTC-3, sem horário de verão)
    function fimDoDia() {

        var DIA = 86400000;

        var BRASILIA = -3 * 3600000;


        return Math.floor((Date.now() + BRASILIA) / DIA) * DIA + DIA - BRASILIA;
    }


    var DIARIO =
        !CONFIG.FIM;

    var FIM =
        DIARIO ? fimDoDia() : new Date(CONFIG.FIM).getTime();


    /* =========================================================
       PREÇOS
    ========================================================= */

    function lerPreco(texto) {

        var achado =
            String(texto || "").match(
                /(\d{1,3}(?:\.\d{3})*,\d{2})/
            );


        if (!achado) {
            return 0;
        }


        return parseFloat(
            achado[1]
                .replace(/\./g, "")
                .replace(",", ".")
        );
    }


    function lerParcelado(texto) {

        var achado =
            String(texto || "").match(
                /(\d+)\s*x\s*de\s*R\$\s*(\d{1,3}(?:\.\d{3})*,\d{2})/i
            );


        if (!achado) {
            return 0;
        }


        return Math.round(
            parseInt(achado[1], 10) *
            lerPreco(achado[2]) *
            100
        ) / 100;
    }


    function moeda(valor) {

        return valor.toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );
    }


    function limparCard(holder) {

        var antigos =
            holder.querySelectorAll(
                ".etraction-dmfit-89-de, .etraction-dmfit-89-economia"
            );


        for (var i = 0; i < antigos.length; i++) {
            antigos[i].parentNode.removeChild(antigos[i]);
        }


        holder.classList.remove(
            "etraction-dmfit-89-ok"
        );
    }


    // aplica o "De / Por" no card e devolve o preço "De" encontrado
    function aplicarCard(holder) {

        var pixEl =
            holder.querySelector(".price-pix");

        var primario =
            holder.querySelector(".price-primary");


        if (!pixEl || !primario) {
            return 0;
        }


        var pix =
            lerPreco(pixEl.textContent);


        // "De" = maior entre o preço antigo nativo e o total no cartão
        var antigoEl =
            holder.querySelector(".old-price");

        var secundario =
            holder.querySelector(".price-secondary");

        var de =
            Math.max(
                antigoEl ? lerPreco(antigoEl.textContent) : 0,
                secundario ? lerParcelado(secundario.textContent) : 0
            );


        var assinatura =
            pix + "|" + de;


        if (
            holder.getAttribute("data-etraction-89") === assinatura &&
            (
                !holder.classList.contains("etraction-dmfit-89-ok") ||
                holder.querySelector(".etraction-dmfit-89-de")
            )
        ) {
            return de;
        }


        limparCard(holder);

        holder.setAttribute(
            "data-etraction-89",
            assinatura
        );


        if (!pix || !de || de <= pix) {
            return de;
        }


        var economia =
            Math.round((de - pix) * 100) / 100;

        // arredonda para baixo para nunca anunciar mais desconto do que existe
        var porcentagem =
            Math.floor(economia / de * 100);


        if (porcentagem < CONFIG.MIN_ECONOMIA) {
            return de;
        }


        var linhaDe =
            document.createElement("div");

        linhaDe.className =
            "etraction-dmfit-89-de";

        linhaDe.innerHTML =
            '<span>De <s>' + moeda(de) + '</s></span>' +
            '<span class="etraction-dmfit-89-de__off">-' + porcentagem + '%</span>';


        var linhaEconomia =
            document.createElement("div");

        linhaEconomia.className =
            "etraction-dmfit-89-economia";

        linhaEconomia.innerHTML =
            'Economize <strong>' + moeda(economia) + '</strong> no PIX';


        primario.parentNode.insertBefore(
            linhaDe,
            primario
        );

        holder.appendChild(
            linhaEconomia
        );

        holder.classList.add(
            "etraction-dmfit-89-ok"
        );


        return de;
    }


    function aplicarCards() {

        var holders =
            document.querySelectorAll(
                ".detalhes-valor-produto .price-holder"
            );

        var maiorDe = 0;


        for (var i = 0; i < holders.length; i++) {
            maiorDe = Math.max(maiorDe, aplicarCard(holders[i]));
        }


        if (maiorDe) {
            atualizarOferta(maiorDe);
        }
    }


    /* =========================================================
       BANNER
    ========================================================= */

    var hero = null;

    var relogio = null;


    function montarHero() {

        var secao =
            document.createElement("section");

        secao.className =
            "etraction-dmfit-89-hero";

        secao.setAttribute("aria-label", "Esquenta Black DMFIT");


        var quando =
            DIARIO ? "hoje " : "";


        secao.innerHTML = `
            <div class="etraction-dmfit-89-strip">

                <span class="etraction-dmfit-89-strip__live">
                    <i aria-hidden="true"></i>
                    Esquenta Black liberado
                </span>

                <span class="etraction-dmfit-89-strip__end" data-etx89-timer>
                    Termina ${quando}em:
                    <b class="etraction-dmfit-89-strip__chip">
                        <span data-u="d"><span data-t="d">00</span>D </span><span data-t="h">00</span>H <span data-t="m">00</span>M <span data-t="s">00</span>S
                    </b>
                </span>

            </div>

            <div class="etraction-dmfit-89-card">

                <div class="etraction-dmfit-89-card__main">

                    <span class="etraction-dmfit-89-kicker">
                        DMFIT · A Black começou antes
                    </span>

                    <h2 class="etraction-dmfit-89-title">
                        <span>Esquenta</span>
                        <span class="etraction-dmfit-89-title__hot">Black</span>
                    </h2>

                    <p class="etraction-dmfit-89-sub">
                        Não precisa esperar novembro
                    </p>

                    <div class="etraction-dmfit-89-offer">

                        <span class="etraction-dmfit-89-offer__pill">
                            Top + calça ou short
                        </span>

                        <span class="etraction-dmfit-89-offer__label">
                            Conjunto completo por
                        </span>

                        <div class="etraction-dmfit-89-offer__price" aria-label="${moeda(CONFIG.PRECO)}">
                            <small>R$</small><strong>${Math.floor(CONFIG.PRECO)}</strong><sup>,${moeda(CONFIG.PRECO).slice(-2)}</sup>
                        </div>

                        <span class="etraction-dmfit-89-offer__pix">
                            no PIX
                        </span>

                        <p class="etraction-dmfit-89-offer__save">
                            Economize até <b data-etx89="eco"></b>
                        </p>

                        <span class="etraction-dmfit-89-offer__de">
                            De até <span data-etx89="de"></span>
                        </span>

                    </div>

                </div>

                <div class="etraction-dmfit-89-card__side">

                    <span class="etraction-dmfit-89-card__ghost" aria-hidden="true">R$89</span>

                    <span class="etraction-dmfit-89-sticker">
                        Até <span data-etx89="off"></span>% OFF
                    </span>

                    <span class="etraction-dmfit-89-side__label">
                        Desconto desbloqueado
                    </span>

                    <p class="etraction-dmfit-89-side__text">
                        Sem cupom: o <strong>R$89</strong> já aparece no PIX.
                    </p>

                    <div class="etraction-dmfit-89-clock" data-etx89-timer role="timer" aria-label="Tempo restante da oferta">

                        <span class="etraction-dmfit-89-clock__label">
                            A oferta ${DIARIO ? "de hoje " : ""}termina em
                        </span>

                        <div class="etraction-dmfit-89-clock__grid">

                            <div class="etraction-dmfit-89-clock__unit" data-u="d">
                                <strong data-t="d">00</strong>
                                <span>dias</span>
                            </div>

                            <i data-u="d" aria-hidden="true">:</i>

                            <div class="etraction-dmfit-89-clock__unit">
                                <strong data-t="h">00</strong>
                                <span>horas</span>
                            </div>

                            <i aria-hidden="true">:</i>

                            <div class="etraction-dmfit-89-clock__unit">
                                <strong data-t="m">00</strong>
                                <span>min</span>
                            </div>

                            <i aria-hidden="true">:</i>

                            <div class="etraction-dmfit-89-clock__unit">
                                <strong data-t="s">00</strong>
                                <span>seg</span>
                            </div>

                        </div>

                    </div>

                    <button type="button" class="etraction-dmfit-89-cta">
                        Ver os conjuntos
                        <span aria-hidden="true">↓</span>
                    </button>

                    <span class="etraction-dmfit-89-side__note">
                        Válido para os itens desta página.
                    </span>

                </div>

            </div>
        `;


        secao
            .querySelector(".etraction-dmfit-89-cta")
            .addEventListener(
                "click",
                function () {

                    var lista =
                        document.querySelector(".container-list");

                    if (lista) {
                        lista.scrollIntoView({ behavior: "smooth", block: "start" });
                    }

                }
            );


        return secao;
    }


    function escrever(chave, texto) {

        var alvo =
            hero && hero.querySelector('[data-etx89="' + chave + '"]');


        if (alvo && alvo.textContent !== texto) {
            alvo.textContent = texto;
        }
    }


    function atualizarOferta(deAte) {

        if (!hero || deAte <= CONFIG.PRECO) {
            return;
        }


        var economia =
            Math.round((deAte - CONFIG.PRECO) * 100) / 100;


        escrever("de", moeda(deAte));

        escrever("eco", moeda(economia));

        escrever("off", String(Math.floor(economia / deAte * 100)));
    }


    // ajusta a seção de ponta a ponta sem gerar rolagem lateral pela barra do Windows
    function medirBarra() {

        document.documentElement.style.setProperty(
            "--etraction-89-sb",
            (window.innerWidth - document.documentElement.clientWidth) + "px"
        );
    }


    function doisDigitos(n) {
        return n < 10 ? "0" + n : String(n);
    }


    function atualizarTimer() {

        if (!hero) {
            return;
        }


        var resta =
            Math.max(0, Math.floor((FIM - Date.now()) / 1000));


        // modo diário: virou o dia, recomeça a contagem
        if (resta <= 0 && DIARIO) {

            FIM = fimDoDia();

            resta = Math.min(86399, Math.floor((FIM - Date.now()) / 1000));
        }


        var i;


        if (resta <= 0) {

            clearInterval(relogio);

            // acabou: some só com os cronômetros
            var timers =
                hero.querySelectorAll("[data-etx89-timer]");

            for (i = 0; i < timers.length; i++) {
                timers[i].hidden = true;
            }

            return;
        }


        var valores = {
            d: Math.floor(resta / 86400),
            h: Math.floor(resta % 86400 / 3600),
            m: Math.floor(resta % 3600 / 60),
            s: resta % 60
        };


        var numeros =
            hero.querySelectorAll("[data-t]");

        for (i = 0; i < numeros.length; i++) {

            var texto =
                doisDigitos(valores[numeros[i].getAttribute("data-t")]);

            if (numeros[i].textContent !== texto) {
                numeros[i].textContent = texto;
            }
        }


        // no último dia (e no modo diário) a parte de dias some
        var dias =
            hero.querySelectorAll('[data-u="d"]');

        for (i = 0; i < dias.length; i++) {
            dias[i].hidden = valores.d === 0;
        }
    }


    function criarHero() {

        if (hero) {
            return true;
        }


        var cupom =
            document.querySelector(".pesquisa-cupom");

        var breadcrumb =
            document.querySelector("#main-area > .area-breadcrumb");

        var lista =
            document.querySelector(".container-list");


        // abaixo do breadcrumb; sem ele, no lugar do banner de cupom ou acima da vitrine
        var ancora =
            breadcrumb ||
            (cupom && cupom.parentNode) ||
            lista;


        if (!ancora) {
            return false;
        }


        if (cupom) {
            cupom.classList.add("etraction-dmfit-89-escondido");
        }


        hero = montarHero();


        if (ancora === breadcrumb) {
            ancora.insertAdjacentElement("afterend", hero);
        } else {
            ancora.parentNode.insertBefore(hero, ancora);
        }


        medirBarra();

        window.addEventListener("resize", medirBarra);


        atualizarOferta(CONFIG.DE_ATE);

        atualizarTimer();

        relogio =
            setInterval(atualizarTimer, 1000);


        return true;
    }


    /* =========================================================
       INICIAR
    ========================================================= */

    var agendado = false;


    function rodar() {

        agendado = false;

        criarHero();

        aplicarCards();
    }


    function agendar() {

        if (agendado) {
            return;
        }


        agendado = true;

        setTimeout(rodar, 60);
    }


    function iniciar() {

        rodar();


        // a vitrine é React: refaz quando filtra, ordena ou pagina
        new MutationObserver(
            function (mutacoes) {

                for (var i = 0; i < mutacoes.length; i++) {

                    var alvo =
                        mutacoes[i].target;

                    var el =
                        alvo.nodeType === 1 ? alvo : alvo.parentElement;


                    // ignora o próprio banner (cronômetro trocando os números)
                    if (
                        el &&
                        el.closest &&
                        el.closest(".etraction-dmfit-89-hero")
                    ) {
                        continue;
                    }


                    agendar();

                    return;
                }

            }
        ).observe(
            document.body,
            {
                childList: true,
                subtree: true,
                characterData: true
            }
        );
    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            iniciar,
            {
                once: true
            }
        );

    } else {

        iniciar();
    }

})();
</script>

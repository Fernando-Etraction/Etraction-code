<style>
/* =========================================================
   ESQUENTA DMFIT | CONJUNTOS R$89
   Cronômetro no banner + preço "De / Por" nos cards
========================================================= */

/* =========================================================
   CRONÔMETRO
========================================================= */

.etraction-dmfit-89-timer {
    flex: 0 0 auto !important;

    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;

    gap: 10px !important;

    margin: 0 !important;
    padding: 0 !important;

    font-family: inherit !important;
}


.etraction-dmfit-89-timer__label {
    color: #d0cbd0 !important;

    font-size: 11px !important;
    font-weight: 800 !important;
    line-height: 1.3 !important;

    letter-spacing: .12em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-89-timer__grid {
    display: flex !important;
    align-items: flex-start !important;

    gap: 6px !important;
}


.etraction-dmfit-89-timer__unit {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;

    width: 64px !important;

    padding: 10px 0 8px !important;

    border: 1px solid rgba(255, 37, 137, .4) !important;
    border-radius: 8px !important;

    background: rgba(255, 37, 137, .12) !important;
}


.etraction-dmfit-89-timer__unit[hidden] {
    display: none !important;
}


.etraction-dmfit-89-timer__num {
    color: #ffffff !important;

    font-size: 28px !important;
    font-weight: 800 !important;
    line-height: 1 !important;

    font-variant-numeric: tabular-nums !important;
}


.etraction-dmfit-89-timer__txt {
    margin-top: 5px !important;

    color: #d0cbd0 !important;

    font-size: 9px !important;
    font-weight: 700 !important;
    line-height: 1 !important;

    letter-spacing: .1em !important;

    text-transform: uppercase !important;
}


.etraction-dmfit-89-timer__sep {
    padding-top: 10px !important;

    color: #ff2589 !important;

    font-size: 24px !important;
    font-weight: 800 !important;
    line-height: 1 !important;
}


.etraction-dmfit-89-timer__sep[hidden] {
    display: none !important;
}


/* sem banner nativo: faixa própria acima da vitrine */

.etraction-dmfit-89-solo {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;

    gap: 24px !important;

    width: 100% !important;
    max-width: 1140px !important;

    margin: 0 auto 24px !important;
    padding: 22px 28px !important;

    border-top: 4px solid #ff2589 !important;
    border-radius: 12px !important;

    background: linear-gradient(115deg, #101010 0%, #1b1118 100%) !important;

    box-sizing: border-box !important;
    font-family: Montserrat, Arial, sans-serif !important;
}


.etraction-dmfit-89-solo__title {
    margin: 0 !important;

    color: #ffffff !important;

    font-size: 24px !important;
    font-weight: 800 !important;
    line-height: 1.15 !important;

    text-transform: uppercase !important;
}


/* banner nativo sem o cupom (precisa ganhar do ".container .pesquisa-cupom .aplicar-desconto" da loja) */

.container .pesquisa-cupom.etraction-dmfit-89-sem-cupom .aplicar-desconto {
    display: none !important;
}


/* =========================================================
   PREÇO DE / POR NOS CARDS
========================================================= */

.etraction-dmfit-89-ok .old-price {
    display: none !important;
}


.etraction-dmfit-89-de {
    display: flex !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    justify-content: center !important;

    gap: 3px 6px !important;

    margin: 0 0 2px !important;

    color: #8a8a8a !important;

    font-size: 12px !important;
    font-weight: 500 !important;
    line-height: 1.2 !important;
}


/* em card estreito o selo desce para a linha de baixo, sem quebrar o preço */
.etraction-dmfit-89-de > span {
    white-space: nowrap !important;
}


.etraction-dmfit-89-de s {
    color: #8a8a8a !important;

    text-decoration: line-through !important;
}


.etraction-dmfit-89-de__off {
    padding: 2px 5px !important;

    border-radius: 4px !important;

    background: #eb0870 !important;

    color: #ffffff !important;

    font-size: 10px !important;
    font-weight: 800 !important;
    line-height: 1.2 !important;
}


.etraction-dmfit-89-economia {
    display: block !important;

    margin: 7px auto 0 !important;
    padding: 4px 8px !important;

    border-radius: 4px !important;

    background: #fff0f6 !important;

    color: #eb0870 !important;

    font-size: 11px !important;
    font-weight: 700 !important;
    line-height: 1.3 !important;

    text-align: center !important;
}


.etraction-dmfit-89-economia strong {
    color: inherit !important;

    font-weight: 900 !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 767px) {

    .etraction-dmfit-89-timer {
        width: 100% !important;
    }


    .etraction-dmfit-89-timer__label {
        font-size: 10px !important;
    }


    .etraction-dmfit-89-timer__grid {
        gap: 4px !important;
    }


    .etraction-dmfit-89-timer__unit {
        width: 54px !important;

        padding: 8px 0 7px !important;
    }


    .etraction-dmfit-89-timer__num {
        font-size: 22px !important;
    }


    .etraction-dmfit-89-timer__sep {
        padding-top: 8px !important;

        font-size: 20px !important;
    }


    .etraction-dmfit-89-solo {
        flex-direction: column !important;

        gap: 14px !important;

        margin-bottom: 18px !important;
        padding: 18px 16px !important;

        text-align: center !important;
    }


    .etraction-dmfit-89-solo__title {
        font-size: 19px !important;
    }


    .etraction-dmfit-89-de {
        gap: 3px 4px !important;

        font-size: 11px !important;
    }


    .etraction-dmfit-89-de__off {
        font-size: 9px !important;
    }


    .etraction-dmfit-89-economia {
        padding: 4px 6px !important;

        font-size: 10px !important;
    }

}
</style>


<script>
(function () {

    "use strict";


    var CONFIG = {

        // só roda nestas páginas
        PAGINAS: [
            "/conjuntotudo89"
        ],

        // fim da oferta (horário de Brasília). null = zera todo dia à meia-noite
        // ex. de data fixa: "2026-10-30T23:59:59-03:00"
        FIM: null,

        // textos do banner nativo (null = mantém o que vem da Magazord)
        TITULO: "Conjunto por apenas R$89 no PIX",
        TEXTO: "Desconto já aplicado no preço, <strong>sem cupom</strong>.<br>Válido para os itens desta página.",

        // false = esconde a caixa do cupom TUDO89 e coloca o cronômetro no lugar
        MOSTRAR_CUPOM: false,

        // só mostra o "De / Por" quando a economia passar disto (%)
        MIN_ECONOMIA: 5
    };


    var caminho =
        location.pathname
            .replace(/\/+$/, "")
            .toLowerCase();


    if (
        CONFIG.PAGINAS.indexOf(caminho) === -1
    ) {
        return;
    }


    // meia-noite de hoje no horário de Brasília (UTC-3, sem horário de verão)
    function fimDoDia() {

        var DIA = 86400000;

        var BRASILIA = -3 * 3600000;


        return Math.floor((Date.now() + BRASILIA) / DIA) * DIA + DIA - BRASILIA;
    }


    var DIARIO =
        !CONFIG.FIM;

    var FIM =
        DIARIO ? fimDoDia() : new Date(CONFIG.FIM).getTime();


    /* =========================================================
       PREÇOS
    ========================================================= */

    function lerPreco(texto) {

        var achado =
            String(texto || "").match(
                /(\d{1,3}(?:\.\d{3})*,\d{2})/
            );


        if (!achado) {
            return 0;
        }


        return parseFloat(
            achado[1]
                .replace(/\./g, "")
                .replace(",", ".")
        );
    }


    function lerParcelado(texto) {

        var achado =
            String(texto || "").match(
                /(\d+)\s*x\s*de\s*R\$\s*(\d{1,3}(?:\.\d{3})*,\d{2})/i
            );


        if (!achado) {
            return 0;
        }


        return Math.round(
            parseInt(achado[1], 10) *
            lerPreco(achado[2]) *
            100
        ) / 100;
    }


    function moeda(valor) {

        return valor.toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );
    }


    function limparCard(holder) {

        var antigos =
            holder.querySelectorAll(
                ".etraction-dmfit-89-de, .etraction-dmfit-89-economia"
            );


        for (var i = 0; i < antigos.length; i++) {
            antigos[i].parentNode.removeChild(antigos[i]);
        }


        holder.classList.remove(
            "etraction-dmfit-89-ok"
        );
    }


    function aplicarCard(holder) {

        var pixEl =
            holder.querySelector(".price-pix");

        var primario =
            holder.querySelector(".price-primary");


        if (!pixEl || !primario) {
            return;
        }


        var pix =
            lerPreco(pixEl.textContent);


        // "De" = maior entre o preço antigo nativo e o total no cartão
        var antigoEl =
            holder.querySelector(".old-price");

        var secundario =
            holder.querySelector(".price-secondary");

        var de =
            Math.max(
                antigoEl ? lerPreco(antigoEl.textContent) : 0,
                secundario ? lerParcelado(secundario.textContent) : 0
            );


        var assinatura =
            pix + "|" + de;


        if (
            holder.getAttribute("data-etraction-89") === assinatura &&
            (
                !holder.classList.contains("etraction-dmfit-89-ok") ||
                holder.querySelector(".etraction-dmfit-89-de")
            )
        ) {
            return;
        }


        limparCard(holder);

        holder.setAttribute(
            "data-etraction-89",
            assinatura
        );


        if (!pix || !de || de <= pix) {
            return;
        }


        var economia =
            Math.round((de - pix) * 100) / 100;

        // arredonda para baixo para nunca anunciar mais desconto do que existe
        var porcentagem =
            Math.floor(economia / de * 100);


        if (porcentagem < CONFIG.MIN_ECONOMIA) {
            return;
        }


        var linhaDe =
            document.createElement("div");

        linhaDe.className =
            "etraction-dmfit-89-de";

        linhaDe.innerHTML =
            '<span>De <s>' + moeda(de) + '</s></span>' +
            '<span class="etraction-dmfit-89-de__off">-' + porcentagem + '%</span>';


        var linhaEconomia =
            document.createElement("div");

        linhaEconomia.className =
            "etraction-dmfit-89-economia";

        linhaEconomia.innerHTML =
            'Economize <strong>' + moeda(economia) + '</strong> no PIX';


        primario.parentNode.insertBefore(
            linhaDe,
            primario
        );

        holder.appendChild(
            linhaEconomia
        );

        holder.classList.add(
            "etraction-dmfit-89-ok"
        );
    }


    function aplicarCards() {

        var holders =
            document.querySelectorAll(
                ".detalhes-valor-produto .price-holder"
            );


        for (var i = 0; i < holders.length; i++) {
            aplicarCard(holders[i]);
        }
    }


    /* =========================================================
       CRONÔMETRO
    ========================================================= */

    var timer = null;

    var relogio = null;


    function montarTimer() {

        var bloco =
            document.createElement("div");

        bloco.className =
            "etraction-dmfit-89-timer";

        bloco.setAttribute("role", "timer");
        bloco.setAttribute("aria-label", "Tempo restante da oferta");

        bloco.innerHTML = `
            <span class="etraction-dmfit-89-timer__label">
                A oferta termina em
            </span>

            <div class="etraction-dmfit-89-timer__grid">

                <div class="etraction-dmfit-89-timer__unit" data-unit="d">
                    <strong class="etraction-dmfit-89-timer__num">00</strong>
                    <span class="etraction-dmfit-89-timer__txt">dias</span>
                </div>

                <span class="etraction-dmfit-89-timer__sep" data-sep="d" aria-hidden="true">:</span>

                <div class="etraction-dmfit-89-timer__unit" data-unit="h">
                    <strong class="etraction-dmfit-89-timer__num">00</strong>
                    <span class="etraction-dmfit-89-timer__txt">horas</span>
                </div>

                <span class="etraction-dmfit-89-timer__sep" aria-hidden="true">:</span>

                <div class="etraction-dmfit-89-timer__unit" data-unit="m">
                    <strong class="etraction-dmfit-89-timer__num">00</strong>
                    <span class="etraction-dmfit-89-timer__txt">min</span>
                </div>

                <span class="etraction-dmfit-89-timer__sep" aria-hidden="true">:</span>

                <div class="etraction-dmfit-89-timer__unit" data-unit="s">
                    <strong class="etraction-dmfit-89-timer__num">00</strong>
                    <span class="etraction-dmfit-89-timer__txt">seg</span>
                </div>

            </div>
        `;


        return bloco;
    }


    function doisDigitos(n) {
        return n < 10 ? "0" + n : String(n);
    }


    function atualizarTimer() {

        if (!timer) {
            return;
        }


        var resta =
            Math.max(0, Math.floor((FIM - Date.now()) / 1000));


        // modo diário: virou o dia, recomeça a contagem
        if (resta <= 0 && DIARIO) {

            FIM = fimDoDia();

            resta = Math.min(86399, Math.floor((FIM - Date.now()) / 1000));
        }


        if (resta <= 0) {

            clearInterval(relogio);

            // acabou: só tira o cronômetro
            var dono =
                timer.closest(".etraction-dmfit-89-solo") || timer;

            dono.parentNode.removeChild(dono);

            timer = null;

            return;
        }


        var valores = {
            d: Math.floor(resta / 86400),
            h: Math.floor(resta % 86400 / 3600),
            m: Math.floor(resta % 3600 / 60),
            s: resta % 60
        };


        for (var unidade in valores) {

            var caixa =
                timer.querySelector('[data-unit="' + unidade + '"] .etraction-dmfit-89-timer__num');

            var texto =
                doisDigitos(valores[unidade]);


            if (caixa.textContent !== texto) {
                caixa.textContent = texto;
            }
        }


        // no último dia some a caixa de dias
        var semDias =
            valores.d === 0;

        timer.querySelector('[data-unit="d"]').hidden = semDias;
        timer.querySelector('[data-sep="d"]').hidden = semDias;
    }


    function criarTimer() {

        if (
            timer ||
            Date.now() >= FIM
        ) {
            return true;
        }


        var banner =
            document.querySelector(".pesquisa-cupom");


        if (banner) {

            if (CONFIG.TITULO) {

                var titulo =
                    banner.querySelector(".descricao-desconto h1");

                if (titulo) {
                    titulo.textContent = CONFIG.TITULO;
                }
            }


            if (CONFIG.TEXTO) {

                var texto =
                    banner.querySelector(".descricao-desconto .obs");

                if (texto) {
                    texto.innerHTML = CONFIG.TEXTO;
                }
            }


            if (!CONFIG.MOSTRAR_CUPOM) {
                banner.classList.add("etraction-dmfit-89-sem-cupom");
            }


            timer = montarTimer();

            banner.appendChild(timer);

        } else {

            // página sem o banner de cupom: cria uma faixa própria
            var lista =
                document.querySelector(".container-list");


            if (!lista) {
                return false;
            }


            var faixa =
                document.createElement("div");

            faixa.className =
                "etraction-dmfit-89-solo";

            faixa.innerHTML =
                '<p class="etraction-dmfit-89-solo__title">' +
                (CONFIG.TITULO || "Conjunto por apenas R$89 no PIX") +
                '</p>';


            timer = montarTimer();

            faixa.appendChild(timer);

            lista.parentNode.insertBefore(
                faixa,
                lista
            );
        }


        atualizarTimer();

        relogio =
            setInterval(atualizarTimer, 1000);


        return true;
    }


    /* =========================================================
       INICIAR
    ========================================================= */

    var agendado = false;


    function rodar() {

        agendado = false;

        criarTimer();

        aplicarCards();
    }


    function agendar() {

        if (agendado) {
            return;
        }


        agendado = true;

        setTimeout(rodar, 60);
    }


    function iniciar() {

        rodar();


        // a vitrine é React: refaz quando filtra, ordena ou pagina
        new MutationObserver(
            function (mutacoes) {

                for (var i = 0; i < mutacoes.length; i++) {

                    var alvo =
                        mutacoes[i].target;

                    var el =
                        alvo.nodeType === 1 ? alvo : alvo.parentElement;


                    // ignora o próprio cronômetro trocando os números
                    if (
                        el &&
                        el.closest &&
                        el.closest(".etraction-dmfit-89-timer")
                    ) {
                        continue;
                    }


                    agendar();

                    return;
                }

            }
        ).observe(
            document.body,
            {
                childList: true,
                subtree: true,
                characterData: true
            }
        );
    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            iniciar,
            {
                once: true
            }
        );

    } else {

        iniciar();
    }

})();
</script>

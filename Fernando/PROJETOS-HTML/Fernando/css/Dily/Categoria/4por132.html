<p>
<script>// <![CDATA[
(function () {

    function iniciarDilyBlack4Por312() {

        var areaCupom =
            document.querySelector(
                '.container.container-pc .aplicar-desconto'
            );

        var inputCupom =
            document.querySelector(
                '.container.container-pc .aplicar-desconto input[value="4POR312"]'
            );


        if (
            !areaCupom ||
            !inputCupom
        ) {
            return;
        }


        /* =====================================================
           TIMER
        ====================================================== */

        var timer =
            document.getElementById(
                'etr-dily-black-timer'
            );


        if (!timer) {

            timer =
                document.createElement(
                    'div'
                );

            timer.id =
                'etr-dily-black-timer';


            var label =
                document.createElement(
                    'div'
                );

            label.className =
                'etr-black-timer-label';

            label.textContent =
                'TERMINA EM';


            var clock =
                document.createElement(
                    'div'
                );

            clock.className =
                'etr-black-timer-clock';

            clock.id =
                'etr-dily-black-clock';

            clock.textContent =
                '--d --h --m --s';


            timer.appendChild(
                label
            );

            timer.appendChild(
                clock
            );


            areaCupom.insertBefore(
                timer,
                inputCupom
            );

        }


        var clockEl =
            document.getElementById(
                'etr-dily-black-clock'
            );


        /* =====================================================
           ENCERRA 30/10/2026 23:59:59
        ====================================================== */

        var endDate =
            new Date(
                2026,
                9,
                30,
                23,
                59,
                59
            );


        function atualizarTimer() {

            var agora =
                new Date().getTime();

            var distancia =
                endDate.getTime() -
                agora;


            if (distancia <= 0) {

                clockEl.textContent =
                    '00d 00h 00m 00s';

                return;

            }


            var dias =
                Math.floor(
                    distancia /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )
                );


            var horas =
                Math.floor(
                    (
                        distancia %
                        (
                            1000 *
                            60 *
                            60 *
                            24
                        )
                    ) /
                    (
                        1000 *
                        60 *
                        60
                    )
                );


            var minutos =
                Math.floor(
                    (
                        distancia %
                        (
                            1000 *
                            60 *
                            60
                        )
                    ) /
                    (
                        1000 *
                        60
                    )
                );


            var segundos =
                Math.floor(
                    (
                        distancia %
                        (
                            1000 *
                            60
                        )
                    ) /
                    1000
                );


            var d =
                String(dias)
                .padStart(2, '0');

            var h =
                String(horas)
                .padStart(2, '0');

            var m =
                String(minutos)
                .padStart(2, '0');

            var s =
                String(segundos)
                .padStart(2, '0');


            clockEl.textContent =
                d + 'd ' +
                h + 'h ' +
                m + 'm ' +
                s + 's';

        }


        atualizarTimer();

        setInterval(
            atualizarTimer,
            1000
        );

    }


    if (
        document.readyState ===
        'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            iniciarDilyBlack4Por312
        );

    } else {

        iniciarDilyBlack4Por312();

    }

})();
// ]]></script>

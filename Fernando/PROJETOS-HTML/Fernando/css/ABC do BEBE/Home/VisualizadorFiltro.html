<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizador - Filtro de Categorias | ABC de Bebê</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Italiana&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Sarabun,Arial,sans-serif;color:#201f1f;background:#fff}

  /* ---------- barra do visualizador ---------- */
  .viz{display:flex;flex-direction:column;height:100%;background:#eceef0}
  .viz-barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:#201f1f;color:#fff}
  .viz-barra strong{font-size:15px;margin-right:auto}
  .viz-barra button{font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid #555;background:none;color:#fff;cursor:pointer}
  .viz-barra button.ativo{background:#9dd466;border-color:#9dd466;color:#201f1f}
  .viz-barra span{font-size:13px;color:#bbb}
  .viz-palco{flex:1;min-height:0;display:flex;justify-content:center;padding:16px;overflow:auto}
  .viz-palco iframe{width:100%;height:100%;border:0;background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.18);transition:max-width .25s}

  /* ---------- simulação da loja ---------- */
  .loja-topo{background:#de6d9b;color:#fff;text-align:center;font-size:14px;padding:8px}
  .loja-cab{display:flex;align-items:center;justify-content:center;padding:16px;border-bottom:1px solid #eee;font-size:22px;color:#3fbfbd}
  .loja-banner{height:240px;display:flex;align-items:center;justify-content:center;background:#f3ede4;color:#a8998a;font-size:15px}
  .loja-aviso{text-align:center;color:#999;font-size:13px;padding:26px 16px 40px;border-top:1px solid #eee;margin-top:30px}
  .conteiner{max-width:1236px;margin:0 auto;padding:0 12px}
  .titulo-categoria{text-align:center;font-size:22px;margin:0 0 20px}

  /* ---------- filtro (mesmo CSS do FiltroDeCategorias.html) ---------- */
  .abc-filtro{margin:30px 0 10px}
  .abc-filtro-abas{margin:0 0 28px;padding:0 34px;position:relative}
  .abc-filtro-aba{padding:8px 9px 12px}
  .abc-filtro-aba button{display:block;width:100%;padding:0;border:0;background:none;font-family:inherit;cursor:pointer;text-align:center}
  .abc-filtro-quadro{display:block;position:relative;width:100%;padding-top:100%;border-radius:22px;overflow:hidden;background:#fbf3ee;box-shadow:0 4px 14px rgba(190,140,130,.2);transition:transform .3s,box-shadow .3s}
  .abc-filtro-quadro img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
  .abc-filtro-aba button:hover .abc-filtro-quadro img{transform:scale(1.06)}
  .abc-filtro-aba button:hover .abc-filtro-quadro{transform:translateY(-4px);box-shadow:0 10px 22px rgba(190,140,130,.3)}
  .abc-filtro-aba button.ativo .abc-filtro-quadro{box-shadow:0 0 0 3px #eaa9c1,0 8px 18px rgba(222,109,155,.25)}
  .abc-filtro-quadro:after{content:"";position:absolute;right:0;bottom:0;left:0;height:40%;background:linear-gradient(to top,rgba(255,247,242,.97) 0,rgba(255,247,242,.86) 38%,rgba(255,247,242,0) 100%);transition:height .3s}
  .abc-filtro-aba button:hover .abc-filtro-quadro:after,.abc-filtro-aba button.ativo .abc-filtro-quadro:after{height:48%}
  .abc-filtro-nome{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 8px 10px;color:#6f4a45;font-family:Italiana,Georgia,serif;font-size:23px;font-weight:400;line-height:1.05;text-align:center;transition:transform .3s}
  .abc-filtro-nome:after{content:"";display:block;width:0;height:2px;margin:5px auto 0;background:#eaa9c1;transition:width .3s}
  .abc-filtro-aba button:hover .abc-filtro-nome,.abc-filtro-aba button.ativo .abc-filtro-nome{transform:translateY(-4px)}
  .abc-filtro-aba button:hover .abc-filtro-nome:after,.abc-filtro-aba button.ativo .abc-filtro-nome:after{width:38px}
  .abc-filtro-conteudo{min-height:420px}
  .abc-filtro-vazio{text-align:center;padding:60px 0;color:#777}
  .abc-filtro-vermais{text-align:center;margin:18px 0 0}
  .abc-filtro-vermais a{display:inline-block;font-weight:600;color:#201f1f;border-bottom:2px solid #9dd466;padding-bottom:2px;text-decoration:none}

  /* setas e cards aproximados do tema da loja */
  .slick-arrow{position:absolute;top:calc(50% - 18px);z-index:2;width:26px;height:36px;display:flex!important;align-items:center;justify-content:center;background:#f4f4f4;border-radius:6px;cursor:pointer}
  .slick-arrow svg{width:12px;height:12px;fill:#999}
  .slick-prev{left:0}.slick-next{right:0}
  .slick-disabled{opacity:.3;cursor:default}
  .prod{padding:0 8px;text-align:center}
  .prod-img{position:relative;padding-top:100%;border-radius:6px;overflow:hidden;background:#f6f6f6}
  .prod-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
  .prod-selo{position:absolute;top:6px;left:6px;z-index:1;background:#9dd466;color:#fff;font-size:11px;font-weight:700;line-height:1.1;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:4px}
  .prod-nome{display:block;margin:12px 0 8px;font-size:15px;line-height:1.3;color:#201f1f;text-decoration:none;min-height:58px}
  .prod-pix{font-size:20px;font-weight:700;color:#4fcfc9}
  .prod-pix small{font-size:12px;font-weight:400}
  .prod-preco{font-size:13px;margin-top:2px}
  .prod-preco s{color:#999;margin-right:4px}
  .prod-parc{font-size:12px;color:#444}
  .prod-btn{display:block;margin-top:12px;padding:11px;border-radius:5px;background:#9dd466;color:#fff;font-weight:700;font-size:14px}
  .vitrine-carrossel{padding:0 34px;position:relative}

  @media(max-width:767px){
    .abc-filtro-abas{padding:0 6px;margin-bottom:20px}
    .abc-filtro-aba{padding:4px 6px}
    .abc-filtro-nome{font-size:19px;padding:0 6px 8px}
    .abc-filtro-conteudo{min-height:320px}
    .vitrine-carrossel{padding:0 4px}
    .vitrine-carrossel .slick-arrow{display:none!important}
    .prod{padding:0 5px}
    .prod-nome{font-size:13px;min-height:68px}
    .prod-pix{font-size:17px}
    .loja-banner{height:150px}
  }
</style>

      $.each(itens, function (i, p) { $ul.append(card(p)); });
      $conteudo.empty().append($ul);
      $ul.slick({ slidesToShow: 4, slidesToScroll: 4, infinite: false, dots: false, arrows: true, prevArrow: SETA_E, nextArrow: SETA_D,
        responsive: [
          { breakpoint: 1024, settings: { slidesToShow: 3, slidesToScroll: 3 } },
          { breakpoint: 600, settings: { slidesToShow: 2, slidesToScroll: 2 } },
          { breakpoint: 350, settings: { slidesToShow: 1, slidesToScroll: 1 } }
        ] });
    }
    $verMais.attr('href', LOJA + cat.url).text('Ver tudo em ' + cat.nome + ' →');
  }

  $abas.on('click', 'button', function () {
    var $b = $(this);
    if ($b.hasClass('ativo')) return;
    $abas.find('button').removeClass('ativo').attr('aria-selected', 'false');
    $b.addClass('ativo').attr('aria-selected', 'true');
    mostrar($b.data('cat'));
  });

  $abas.find('button').first().trigger('click');
})(window.jQuery);
</script>
</body>
</html>

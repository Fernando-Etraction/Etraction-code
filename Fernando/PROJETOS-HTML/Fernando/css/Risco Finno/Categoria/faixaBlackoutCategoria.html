<!-- FAIXA BLACKOUT RISCO FINNO | V1 — some sozinha após 23:59:59 do dia em data-rf-fim (AAAA-MM-DD, horário de Brasília) -->
<!-- ===================== V1 | CARD À DIREITA (estilo exemplo) ===================== -->
<div class="rf-bk rf-v1" data-rf-fim="2026-11-26" hidden>
  <span class="rf-fita rf-fita--tl">BLACKOUT &bull; RISCO FINNO &bull; BLACKOUT &bull;</span>
  <span class="rf-fita rf-fita--br">BLACKOUT &bull; RISCO FINNO &bull; BLACKOUT &bull;</span>
  <div class="rf-v1__marca">
    <span class="rf-eyebrow">RISCO FINNO</span>
    <h2 class="rf-v1__titulo">BLACK<br><span>OUT</span></h2>
    <p class="rf-v1__sub">Os pre&ccedil;os sa&iacute;ram do controle</p>
  </div>
  <div class="rf-v1__card">
    <span class="rf-v1__selo">Desconto j&aacute; no pre&ccedil;o</span>
    <div class="rf-v1__pct"><span class="rf-v1__lbl">At&eacute;</span><span class="rf-v1__num">60%</span><span class="rf-v1__lbl">OFF</span></div>
    <div class="rf-v1__acoes">
      <button type="button" class="rf-cupom" data-rf-copiar="PIXHOJE">Use o cupom <strong>PIXHOJE</strong></button>
      <span class="rf-dica">Clique para copiar</span>
      <p class="rf-v1__pix">+5% OFF no PIX comprando hoje</p>
      <div class="rf-timer-pill" data-rf-timer>Termina hoje em <strong><span data-h>00</span>:<span data-m>00</span>:<span data-s>00</span></strong></div>
    </div>
    <p class="rf-v1__nota">*Cupom v&aacute;lido somente hoje at&eacute; 23:59. Cole o cupom no carrinho.</p>
  </div>
</div>

<style><!--

.rf-cupom strong{font-weight:900!important;letter-spacing:.1em!important;margin-left:4px!important}
.rf-cupom:hover{transform:scale(1.03)!important}
.rf-cupom.rf-copiado{background:#1f1f1f!important;color:#fff!important;outline:1px solid #fff!important}
.rf-dica{display:block!important;margin-top:6px!important;font-size:11px!important;color:#999!important}

/* V1 */

.rf-fita--tl{top:20px!important;left:-60px!important;transform:rotate(-18deg)!important}
.rf-fita--br{bottom:20px!important;right:-60px!important;transform:rotate(-18deg)!important}
.rf-v1__marca{text-align:center!important}
.rf-v1__titulo{margin-top:8px!important;font-size:64px!important;font-weight:900!important;line-height:.9!important;letter-spacing:-.02em!important}
.rf-v1__titulo span{-webkit-text-stroke:2px #fff!important;color:transparent!important}
.rf-v1__sub{margin-top:14px!important;font-size:17px!important;color:#ccc!important}
.rf-v1__card{position:relative!important;display:grid!important;grid-template-columns:auto 1fr!important;gap:12px 28px!important;align-items:center!important;padding:34px 28px 18px!important;background:#151515!important;border:1px solid #333!important;border-radius:18px!important}
.rf-v1__selo{position:absolute!important;top:-13px!important;left:28px!important;background:#fff!important;color:#000!important;font-size:12px!important;font-weight:800!important;padding:5px 14px!important;border-radius:6px!important}
.rf-v1__pct{display:flex!important;flex-direction:column!important;align-items:center!important;line-height:1!important}
.rf-v1__pct small{font-size:22px!important;font-weight:800!important;font-style:italic!important}
.rf-v1__pct b{font-size:84px!important;font-weight:900!important;letter-spacing:-.04em!important}
.rf-v1__acoes{text-align:center!important}
.rf-v1__acoes .rf-cupom{border:2px solid #fff!important;font-size:15px!important}
.rf-v1__pix{margin-top:10px!important;font-size:16px!important;font-weight:800!important}
.rf-timer-pill{display:inline-block!important;margin-top:10px!important;background:#000!important;border:1px solid #333!important;border-radius:999px!important;padding:6px 14px!important;font-size:13px!important;color:#ccc!important}
.rf-timer-pill strong{color:#fff!important;font-size:15px!important;font-variant-numeric:tabular-nums!important;margin-left:4px!important}
.rf-v1__nota{grid-column:1/-1!important;border-top:1px solid #2a2a2a!important;padding-top:12px!important;text-align:center!important;font-size:11px!important;color:#888!important}

  .rf-v1{grid-template-columns:1fr!important;padding:44px 16px 28px!important;gap:26px!important}

  .rf-v1__card{grid-template-columns:1fr!important;padding:30px 16px 14px!important}
  .rf-v1__pct{flex-direction:row!important;gap:8px!important;align-items:baseline!important;justify-content:center!important}

}
.rf-bk.rf-bk[hidden]{display:none!important}

.rf-bk.rf-bk,.rf-bk.rf-bk *{font-family:Arial,Helvetica,sans-serif!important;text-transform:none!important;text-shadow:none!important}

.rf-bk.rf-bk .rf-v1__pct b{display:block!important}

.rf-bk.rf-bk .rf-v1__titulo span{display:inline!important;font-size:inherit!important;font-weight:inherit!important}

.rf-bk.rf-bk .rf-cupom strong{background:none!important}

/* FULL WIDTH: libera o corte do tema e estoura o container */

.rf-bk.rf-bk.rf-v1{width:var(--rf-vw,100vw)!important;max-width:none!important;margin-left:var(--rf-ml,calc(50% - 50vw))!important;margin-right:0!important;padding-left:max(48px,calc((var(--rf-vw,100vw) - 1200px)/2))!important;padding-right:max(48px,calc((var(--rf-vw,100vw) - 1200px)/2))!important}
/* 60% (o editor troca <b> por <strong>, por isso classes) */
.rf-bk.rf-bk .rf-v1__lbl{display:block!important;font-size:22px!important;font-weight:800!important;font-style:italic!important;line-height:1!important}
.rf-bk.rf-bk .rf-v1__num{display:block!important;font-size:84px!important;font-weight:900!important;letter-spacing:-.04em!important;line-height:1!important}

  .rf-bk.rf-bk.rf-v1{padding-left:16px!important;padding-right:16px!important}

  .rf-bk.rf-bk .rf-v1__num{font-size:64px!important}

--></style>
<script>// <![CDATA[
(function(){
  var hora=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hourCycle:'h23',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var dia=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'});
  function dd(v){return String(v).padStart(2,'0');}

  document.querySelectorAll('.rf-bk[data-rf-fim]').forEach(function(faixa){
    if(faixa.dataset.rfAtivo)return;faixa.dataset.rfAtivo='1';
    var fim=faixa.getAttribute('data-rf-fim');
    var timers=faixa.querySelectorAll('[data-rf-timer]');

    function tick(){
      var agora=new Date();
      // passou do dia final (horário de Brasília) -> remove a faixa
      if(dia.format(agora)>fim){faixa.remove();return;}
      faixa.hidden=false;
      var p=hora.format(agora).split(':').map(Number);
      var r=86399-(p[0]*3600+p[1]*60+p[2]);
      timers.forEach(function(t){
        t.querySelector('[data-h]').textContent=dd(Math.floor(r/3600));
        t.querySelector('[data-m]').textContent=dd(Math.floor(r/60)%60);
        t.querySelector('[data-s]').textContent=dd(r%60);
      });
      setTimeout(tick,1000-agora.getMilliseconds());
    }
    function largura(){
      var vw=document.documentElement.clientWidth;
      faixa.style.setProperty('--rf-vw',vw+'px');
      var pai=faixa.parentElement.getBoundingClientRect();
      faixa.style.setProperty('--rf-ml',(-pai.left)+'px');
    }
    largura();window.addEventListener('resize',largura);
    tick();

    faixa.querySelectorAll('[data-rf-copiar]').forEach(function(b){
      b.addEventListener('click',function(){
        var c=b.getAttribute('data-rf-copiar'),orig=b.innerHTML;
        function ok(){b.classList.add('rf-copiado');b.innerHTML='Copiado! &#10003;';setTimeout(function(){b.classList.remove('rf-copiado');b.innerHTML=orig;},1800);}
        if(navigator.clipboard){navigator.clipboard.writeText(c).then(ok,ok);}else{var i=document.createElement('input');i.value=c;document.body.appendChild(i);i.select();try{document.execCommand('copy');}catch(e){}i.remove();ok();}
      });
    });
  });
})();
// ]]></script>

<style>
  .etraction-modelagem {
    width: 100%;
    max-width: 535px;
    font-family: Arial, Helvetica, sans-serif;
    color: #1f1f1f;
  }

  .etraction-modelagem__titulo {
    margin: 0 0 22px;
    font-size: 14px;
    font-weight: 700;
  }

  .etraction-modelagem__opcoes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    width: 100%;
    border: 1px solid #3f3f3f;
    box-sizing: border-box;
  }

  .etraction-modelagem__opcao {
    min-height: 28px;
    display: grid;
    place-items: center;
    padding: 5px 10px;
    border-right: 1px solid #3f3f3f;
    background: #ffffff;
    font-size: 11px;
    line-height: 1;
    text-align: center;
    box-sizing: border-box;
  }

  .etraction-modelagem__opcao:last-child {
    border-right: 0;
  }

  .etraction-modelagem__opcao--ativa {
    background: #454545;
    color: #ffffff;
  }

  .etraction-modelagem__descricoes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }

  .etraction-modelagem__descricao {
    margin: 0;
    font-size: 11px;
    line-height: 1.7;
  }

  @media (max-width: 480px) {
    .etraction-modelagem__titulo {
      margin-bottom: 16px;
    }

    .etraction-modelagem__opcao {
      padding-inline: 5px;
      font-size: 10px;
    }

    .etraction-modelagem__descricoes {
      gap: 10px;
    }

    .etraction-modelagem__descricao {
      font-size: 10px;
      line-height: 1.5;
    }
  }
</style>

<div class="etraction-modelagem">
  <h3 class="etraction-modelagem__titulo">Modelagem da peça</h3>

  <div class="etraction-modelagem__opcoes">
    <div class="etraction-modelagem__opcao">
      Justa
    </div>

    <div class="etraction-modelagem__opcao etraction-modelagem__opcao--ativa">
      Fiel ao tamanho
    </div>

    <div class="etraction-modelagem__opcao">
      Grande
    </div>
  </div>

  <div class="etraction-modelagem__descricoes">
    <p class="etraction-modelagem__descricao">
      Sugerimos um tamanho maior
    </p>

    <p class="etraction-modelagem__descricao">
      Veste de forma fiel ao seu tamanho.
    </p>

    <p class="etraction-modelagem__descricao">
      Sugerimos um número menor.
    </p>
  </div>
</div>

  #produto-react-app #content-price-product .price.card > img,
  #produto-react-app #content-price-product .price.card img,
  #produto-react-app #content-price-product .price.card .full-price,
  #produto-react-app #content-price-product .price.card .price-big,
  #produto-react-app #content-price-product .price.card .percentual-desconto,

<script>
  (function () {
    'use strict';

    var EtractionPdpModelo01 = (function () {
      var observer = null;
      var framePending = false;

      function createBadges(info, title) {
        if (!info || !title || info.querySelector('.etraction-pdp-badges')) {
          return;
        }

        var badges = document.createElement('div');
        badges.className = 'etraction-pdp-badges';
        badges.setAttribute('aria-label', 'Tecnologias do produto');

        var labels = ['Best Seller', 'Blackout', 'Dry', 'Proteção UV50+'];

        labels.forEach(function (label) {
          var badge = document.createElement('span');
          badge.className = 'etraction-pdp-badge';
          badge.textContent = label;
          badges.appendChild(badge);
        });

        title.parentNode.insertBefore(badges, title);
      }

      function reorderHeader(info, title) {
        var rating = info.querySelector('.avaliacoes');

        if (!rating || !title) {
          return;
        }

        if (title.nextElementSibling !== rating) {
          title.insertAdjacentElement('afterend', rating);
        }
      }


      function parsePriceValue(value) {
        if (value === null || value === undefined || value === '') {
          return null;
        }

        var normalized = String(value)
          .trim()
          .replace(/\s/g, '')
          .replace(/R\$/gi, '');

        if (normalized.indexOf(',') !== -1) {
          normalized = normalized.replace(/\./g, '').replace(',', '.');
        }

        var number = Number(normalized);
        return Number.isFinite(number) ? number : null;
      }

      function formatPriceBRL(value) {
        try {
          return new Intl.NumberFormat('pt-BR', {
            style: 'currency',
            currency: 'BRL'
          }).format(value);
        } catch (error) {
          return 'R$ ' + value.toFixed(2).replace('.', ',');
        }
      }

      function ensureCardPrice(info) {
        var priceRoot = info.querySelector('#content-price-product');

        if (!priceRoot) {
          return;
        }

        var fallback = priceRoot.querySelector('.etraction-card-price');
        if (fallback) {
          fallback.remove();
        }

        var valuesArea = priceRoot.querySelector('.values-area');
        var pixPrice = priceRoot.querySelector('.price.pix');
        var nativeCard = priceRoot.querySelector('.price.card:not(.etraction-card-price)');

        if (!nativeCard) {
          return;
        }

        /* Ajusta somente o início da mensagem, preservando parcelas e valores nativos. */
        var paymentLabel = nativeCard.querySelector('.type-payment .forma-pagto');
        var paymentText = nativeCard.querySelector('.type-payment');

        if (paymentLabel) {
          paymentLabel.textContent = 'ou no cartão em até ';
        } else if (paymentText) {
          Array.prototype.some.call(paymentText.childNodes, function (node) {
            if (node.nodeType !== Node.TEXT_NODE) {
              return false;
            }

            var currentText = node.nodeValue || '';

            if (!/no\s+cart[aã]o/i.test(currentText)) {
              return false;
            }

            node.nodeValue = currentText.replace(/(?:ou\s+)?no\s+cart[aã]o/i, 'ou no cartão');
            return true;
          });
        }

        /* Coloca o cartão logo depois do PIX sem recriar preços ou parcelas. */
        if (pixPrice && pixPrice.parentNode && nativeCard.previousElementSibling !== pixPrice) {
          pixPrice.insertAdjacentElement('afterend', nativeCard);
        } else if (valuesArea && nativeCard.parentNode !== valuesArea) {
          valuesArea.appendChild(nativeCard);
        }

        nativeCard.style.setProperty('display', 'flex', 'important');
        nativeCard.style.setProperty('visibility', 'visible', 'important');
        nativeCard.style.setProperty('opacity', '1', 'important');
        nativeCard.style.setProperty('width', '100%', 'important');
        nativeCard.style.setProperty('max-width', '100%', 'important');
        nativeCard.style.setProperty('height', 'auto', 'important');
        nativeCard.style.setProperty('overflow', 'visible', 'important');
      }

      function normalizeText(value) {
        return String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim();
      }

      function stabilizeSizebayPosition(info) {
        var derivationArea = info.querySelector('.area-derivacoes');

        if (!derivationArea) {
          return;
        }

        var variations = Array.prototype.slice.call(
          derivationArea.querySelectorAll(':scope > .variacao-area')
        );

        var sizebayContainers = Array.prototype.slice.call(
          derivationArea.querySelectorAll(':scope > .vfr__container')
        );

        if (!variations.length || !sizebayContainers.length) {
          return;
        }

        var sizebayLooks = Array.prototype.slice.call(
          derivationArea.querySelectorAll(':scope > [id^="szb-look-"]')
        );

        sizebayContainers.forEach(function (container, index) {
          var productPath = normalizeText(container.getAttribute('szb-product-path'));
          var targetVariation = null;

          if (productPath.indexOf('top') !== -1) {
            targetVariation = variations.find(function (variation) {
              var title = variation.querySelector('.title');
              return normalizeText(title && title.textContent).indexOf('top') !== -1;
            });
          }

          if (!targetVariation && productPath.indexOf('legging') !== -1) {
            targetVariation = variations.find(function (variation) {
              var title = variation.querySelector('.title');
              return normalizeText(title && title.textContent).indexOf('legging') !== -1;
            });
          }

          if (!targetVariation) {
            targetVariation = variations[index] || variations[variations.length - 1];
          }

          if (!targetVariation) {
            return;
          }

          var look = null;
          var previous = container.previousElementSibling;

          if (previous && /^szb-look-/i.test(previous.id || '')) {
            look = previous;
          } else {
            look = sizebayLooks[index] || null;
          }

          /*
           * Mantém cada bloco Sizebay imediatamente após sua derivação:
           * Tamanho Top > Sizebay Top > Tamanho Legging > Sizebay Legging.
           * O append/move preserva os eventos nativos já registrados pela Sizebay.
           */
          if (look) {
            if (targetVariation.nextElementSibling !== look) {
              targetVariation.insertAdjacentElement('afterend', look);
            }

            if (look.nextElementSibling !== container) {
              look.insertAdjacentElement('afterend', container);
            }
          } else if (targetVariation.nextElementSibling !== container) {
            targetVariation.insertAdjacentElement('afterend', container);
          }
        });
      }

      /*
       * Corrige o bug de duplicacao das recomendacoes da Sizebay.
       * A cada clique em "Descubra seu tamanho" ou em um tamanho, a Sizebay
       * reinjeta um novo #szb-vfr-recommendation sem remover os anteriores,
       * gerando varias copias com o mesmo id. Aqui mantemos apenas a primeira
       * recomendacao de cada grupo (uma por derivacao) e removemos as copias.
       */
      function dedupeSizebayRecommendations() {
        var areas = document.querySelectorAll('.area-derivacoes');

        Array.prototype.forEach.call(areas, function (area) {
          Array.prototype.forEach.call(area.children, function (node) {
            if (node.id !== 'szb-vfr-recommendation') {
              return;
            }

            var prev = node.previousElementSibling;

            if (prev && prev.id === 'szb-vfr-recommendation') {
              node.parentNode.removeChild(node);
            }
          });
        });
      }

      function updateMeasurementTableMode(root, info) {
        var hasSizebay = Boolean(
          info.querySelector('.vfr__container .szb-vfr-btns') ||
          info.querySelector('.vfr__container button[id="szb-vfr-button"]') ||
          info.querySelector('.vfr__container button[id="szb-measurements-button"]')
        );

        root.classList.toggle('etraction-pdp-has-sizebay', hasSizebay);
        root.classList.toggle('etraction-pdp-no-sizebay', !hasSizebay);
      }

      function applyLayout() {
        var root = document.querySelector('#produto-react-app') ||
                   document.querySelector('.container-produto-react');

        if (!root) {
          return;
        }

        var info = root.querySelector('.informacoes-compra-produto');

        if (!info) {
          return;
        }

        var title = info.querySelector('h1');

        if (!title) {
          return;
        }

        createBadges(info, title);
        reorderHeader(info, title);
        ensureCardPrice(info);
        stabilizeSizebayPosition(info);
        dedupeSizebayRecommendations();
        updateMeasurementTableMode(root, info);
        root.classList.add('etraction-pdp-modelo-01-aplicado');
      }

      function scheduleApply() {
        if (framePending) {
          return;
        }

        framePending = true;

        window.requestAnimationFrame(function () {
          framePending = false;
          applyLayout();
        });
      }

      function observe() {
        var target = document.querySelector('#produto-react-app') || document.body;

        if (!target || observer) {
          return;
        }

        observer = new MutationObserver(scheduleApply);
        observer.observe(target, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['data-valor', 'data-valor-pix']
        });

        target.addEventListener('click', function (event) {
          if (!event.target.closest('.variacao-lista li')) {
            return;
          }

          window.setTimeout(scheduleApply, 80);
          window.setTimeout(scheduleApply, 350);
          window.setTimeout(scheduleApply, 800);
        });
      }

      function init() {
        applyLayout();
        observe();

        window.setTimeout(applyLayout, 400);
        window.setTimeout(applyLayout, 1000);
      }

      return {
        init: init
      };
    }());

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', EtractionPdpModelo01.init);
    } else {
      EtractionPdpModelo01.init();
    }
  }());
</script>

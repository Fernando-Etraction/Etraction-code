<script>
(function () {

  function etractionRealocarPromocao() {

    var buyArea =
      document.querySelector('.buy-area');

    var promocao =
      document.querySelector('.area-promocao');

    if (!buyArea || !promocao) {
      return false;
    }

    if (
      buyArea.nextElementSibling === promocao
    ) {
      return true;
    }

    buyArea.insertAdjacentElement(
      'afterend',
      promocao
    );

    return true;
  }

  etractionRealocarPromocao();

  var tentativas = 0;

  var intervalo = setInterval(function () {

    var sucesso =
      etractionRealocarPromocao();

    tentativas++;

    if (
      sucesso ||
      tentativas >= 30
    ) {
      clearInterval(intervalo);
    }

  }, 300);

})();
</script>
